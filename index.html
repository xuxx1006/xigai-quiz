析：\n“明确总体布局是四个全面、战略布局是五位一体”：总体布局与战略布局的对应被颠倒。"},{"id":"L070-M3","chapter":0,"topic":3,"label":"十个明确所包含的主要内容（网络拓展）","knowledge":["L070-6","L070-7","L070-8","L070-9"],"paragraphs":[],"source":"web","web":"w1","type":"multi","stem":"依据背诵稿及标注的网络来源，关于“十个明确所包含的主要内容”，下列选项与原文表述相符的有（多选）。","options":["明确全面推进依法治国总目标","明确党在新时代的强军目标","明确坚持完善社会主义基本经济制度并推动高质量发展","明确中国特色大国外交的主线和目标"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：明确中国共产党领导的地位和作用；明确坚持和发展中国特色社会主义的总任务；明确新时代我国社会主要矛盾；明确五位一体总体布局和四个全面战略布局；明确全面深化改革总目标；明确全面推进依法治国总目标；明确坚持完善社会主义基本经济制度并推动高质量发展；明确党在新时代的强军目标；明确中国特色大国外交的主线和目标；明确全面从严治党的战略方针和新时代党的建设要求。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L070-M4","chapter":0,"topic":3,"label":"十个明确所包含的主要内容（网络拓展）","knowledge":["L070-10","L070-1"],"paragraphs":[],"source":"web","web":"w1","type":"multi","stem":"依据背诵稿及标注的网络来源，关于“十个明确所包含的主要内容”，下列选项与原文表述相符的有（多选）。","options":["明确强军目标是听党指挥、规模最大、作风优良","明确全面从严治党的战略方针和新时代党的建设要求","明确中国共产党领导的地位和作用","明确社会主义基本经济制度是非公有制为主体"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"明确社会主义基本经济制度是非公有制为主体","reason":"基本经济制度要求公有制为主体，不能颠倒主体。"},{"text":"明确强军目标是听党指挥、规模最大、作风优良","reason":"强军目标中应为能打胜仗，不是规模最大。"}],"explanation":"本组完整内容：明确中国共产党领导的地位和作用；明确坚持和发展中国特色社会主义的总任务；明确新时代我国社会主要矛盾；明确五位一体总体布局和四个全面战略布局；明确全面深化改革总目标；明确全面推进依法治国总目标；明确坚持完善社会主义基本经济制度并推动高质量发展；明确党在新时代的强军目标；明确中国特色大国外交的主线和目标；明确全面从严治党的战略方针和新时代党的建设要求。\n易混辨析：\n“明确社会主义基本经济制度是非公有制为主体”：基本经济制度要求公有制为主体，不能颠倒主体。\n“明确强军目标是听党指挥、规模最大、作风优良”：强军目标中应为能打胜仗，不是规模最大。"},{"chapter":0,"topic":1,"label":"民族复兴的共同梦想与奋斗目标 · 期末截图","paragraphs":[350],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B01","screenshots":[1],"pages":["（p2）"],"kind":"黄色重点补充"},"id":"XB01-01","knowledge":["XB01-01-K1"],"type":"single","stem":"近代以来中国人民的共同梦想和中国共产党矢志不渝的奋斗目标是？（单选）","options":["实现第一个百年奋斗目标","全面建成社会主义现代化国家","基本实现社会主义现代化","实现中华民族伟大复兴"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"实现第一个百年奋斗目标","reason":"第一个百年奋斗目标是特定阶段目标，不能替代近代以来共同梦想的完整表述。"},{"text":"基本实现社会主义现代化","reason":"基本实现社会主义现代化是阶段性目标，与民族复兴的完整目标不同。"},{"text":"全面建成社会主义现代化国家","reason":"此项将民族复兴这一共同梦想替换为具体建设目标。"}],"explanation":"正确项：实现中华民族伟大复兴。\n原文要点：实现中华民族伟大复兴是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标。\n逐项辨析：\n“实现第一个百年奋斗目标”：第一个百年奋斗目标是特定阶段目标，不能替代近代以来共同梦想的完整表述。\n“基本实现社会主义现代化”：基本实现社会主义现代化是阶段性目标，与民族复兴的完整目标不同。\n“全面建成社会主义现代化国家”：此项将民族复兴这一共同梦想替换为具体建设目标。\n出处：《期末重点截图.docx》截图001，截图标注（p2）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":3,"label":"十个明确的完整作用 · 期末截图","paragraphs":[351],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B02","screenshots":[4],"pages":["（p7）"],"kind":"黄色重点补充"},"id":"XB02-01","knowledge":["XB02-01-K1","XB02-01-K2","XB02-01-K3","XB02-01-K4"],"type":"multi","stem":"关于“十个明确”的作用，下列与截图原文相符的有：（多选）","options":["是习近平新时代中国特色社会主义思想的主体内容","发挥着统摄作用","构成这一思想体系的四梁八柱","集中体现这一思想体系的主要观点和基本精神"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"正确项：是习近平新时代中国特色社会主义思想的主体内容；集中体现这一思想体系的主要观点和基本精神；构成这一思想体系的四梁八柱；发挥着统摄作用。\n原文要点：“十个明确”是主体内容，集中体现这一思想体系的主要观点和基本精神，构成四梁八柱，发挥统摄作用。\n本题四个选项均正确，应全部选中。\n出处：《期末重点截图.docx》截图004，截图标注（p7）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":3,"label":"四组内容的关系与科学体系的特色 · 期末截图","paragraphs":[352],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B03","screenshots":[6],"pages":["（p8）"],"kind":"黄色重点补充"},"id":"XB03-01","knowledge":["XB03-01-K1","XB03-01-K2","XB03-01-K3"],"type":"multi","stem":"关于构成思想科学体系的四组内容及其关系，下列正确的有：（多选）","options":["体现理论和实际相结合","内在贯通、有机统一","彼此独立、互不关联","体现认识论和方法论相统一"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"彼此独立、互不关联","reason":"截图强调四组内容内在贯通、有机统一，不能改为互不关联。"}],"explanation":"正确项：内在贯通、有机统一；体现理论和实际相结合；体现认识论和方法论相统一。\n原文要点：“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，体现理论和实际相结合、认识论和方法论相统一的鲜明特色。\n逐项辨析：\n“彼此独立、互不关联”：截图强调四组内容内在贯通、有机统一，不能改为互不关联。\n出处：《期末重点截图.docx》截图006，截图标注（p8）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":5,"label":"写入党章的具体时间 · 期末截图","paragraphs":[353],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B04","screenshots":[7],"pages":["（p9）"],"kind":"黄色重点补充"},"id":"XB04-01","knowledge":["XB04-01-K1"],"type":"single","stem":"党的十九大把习近平新时代中国特色社会主义思想确立为指导思想并写入党章，具体是在？（单选）","options":["2017年10月","2018年3月","2021年11月","2022年10月"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"2018年3月","reason":"2018年3月对应载入宪法，不能与写入党章的时间互换。"},{"text":"2021年11月","reason":"2021年11月不是党的十九大召开并写入党章的时间。"},{"text":"2022年10月","reason":"2022年10月对应党的二十大，写入党章发生在党的十九大。"}],"explanation":"正确项：2017年10月。\n原文要点：2017年10月，党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章，实现了党的指导思想的与时俱进。\n逐项辨析：\n“2018年3月”：2018年3月对应载入宪法，不能与写入党章的时间互换。\n“2021年11月”：2021年11月不是党的十九大召开并写入党章的时间。\n“2022年10月”：2022年10月对应党的二十大，写入党章发生在党的十九大。\n出处：《期末重点截图.docx》截图007，截图标注（p9）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":5,"label":"写入党章的具体时间 · 期末截图","paragraphs":[353],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B04","screenshots":[7],"pages":["（p9）"],"kind":"黄色重点补充"},"id":"XB04-02","knowledge":["XB04-02-K1"],"type":"single","stem":"2017年10月将这一思想确立为长期坚持的指导思想并写入党章，实现了什么？（单选）","options":["党的根本宗旨的重新确定","社会主义社会主要矛盾的消除","我国基本国情的根本改变","党的指导思想的与时俱进"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"我国基本国情的根本改变","reason":"写入党章不意味着社会主义初级阶段的基本国情已经根本改变。"},{"text":"党的根本宗旨的重新确定","reason":"党的根本宗旨没有因指导思想与时俱进而重新确定。"},{"text":"社会主义社会主要矛盾的消除","reason":"主要矛盾会发生变化，不能据此说矛盾已经消除。"}],"explanation":"正确项：党的指导思想的与时俱进。\n原文要点：2017年10月，党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章，实现了党的指导思想的与时俱进。\n逐项辨析：\n“我国基本国情的根本改变”：写入党章不意味着社会主义初级阶段的基本国情已经根本改变。\n“党的根本宗旨的重新确定”：党的根本宗旨没有因指导思想与时俱进而重新确定。\n“社会主义社会主要矛盾的消除”：主要矛盾会发生变化，不能据此说矛盾已经消除。\n出处：《期末重点截图.docx》截图007，截图标注（p9）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":1,"topic":10,"label":"社会主要矛盾转化前的表述 · 期末截图","paragraphs":[354],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B05","screenshots":[16],"pages":["（p24）"],"kind":"黄色重点补充"},"id":"XB05-01","knowledge":["XB05-01-K1"],"type":"single","stem":"新时代主要矛盾转化之前，我国社会主要矛盾的完整表述是？（单选）","options":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的物质文化需要和不平衡不充分的发展之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","人民日益增长的美好生活需要同落后的社会生产之间的矛盾"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人民日益增长的美好生活需要同落后的社会生产之间的矛盾","reason":"此项把新时代的需要一端与转化前的生产一端混接。"},{"text":"人民日益增长的物质文化需要和不平衡不充分的发展之间的矛盾","reason":"此项把转化前的需要一端与新时代的发展一端混接。"},{"text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","reason":"这是新时代主要矛盾，题目问转化前。"}],"explanation":"正确项：人民日益增长的物质文化需要同落后的社会生产之间的矛盾。\n原文要点：原来的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾；新时代转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一变化反映了我国社会主义初级阶段不断变化的新特点，是作出中国特色社会主义进入新时代重大判断的基本依据。\n逐项辨析：\n“人民日益增长的美好生活需要同落后的社会生产之间的矛盾”：此项把新时代的需要一端与转化前的生产一端混接。\n“人民日益增长的物质文化需要和不平衡不充分的发展之间的矛盾”：此项把转化前的需要一端与新时代的发展一端混接。\n“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”：这是新时代主要矛盾，题目问转化前。\n出处：《期末重点截图.docx》截图016，截图标注（p24）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":1,"topic":10,"label":"社会主要矛盾转化前的表述 · 期末截图","paragraphs":[354],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B05","screenshots":[16],"pages":["（p24）"],"kind":"黄色重点补充"},"id":"XB05-02","knowledge":["XB05-02-K1","XB05-02-K2"],"type":"multi","stem":"关于新时代我国社会主要矛盾的变化，下列正确的有：（多选）","options":["表明我国的社会基本矛盾已经消失","反映我国社会主义初级阶段不断变化的新特点","是作出中国特色社会主义进入新时代重大判断的基本依据","表明我国已超越社会主义初级阶段"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"表明我国已超越社会主义初级阶段","reason":"主要矛盾的变化仍是在社会主义初级阶段中发生的变化。"},{"text":"表明我国的社会基本矛盾已经消失","reason":"主要矛盾发生变化不能推导出社会基本矛盾消失。"}],"explanation":"正确项：反映我国社会主义初级阶段不断变化的新特点；是作出中国特色社会主义进入新时代重大判断的基本依据。\n原文要点：原来的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾；新时代转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一变化反映了我国社会主义初级阶段不断变化的新特点，是作出中国特色社会主义进入新时代重大判断的基本依据。\n逐项辨析：\n“表明我国已超越社会主义初级阶段”：主要矛盾的变化仍是在社会主义初级阶段中发生的变化。\n“表明我国的社会基本矛盾已经消失”：主要矛盾发生变化不能推导出社会基本矛盾消失。\n出处：《期末重点截图.docx》截图016，截图标注（p24）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":1,"topic":11,"label":"两个布局各自的推进方式 · 期末截图","paragraphs":[355],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B06","screenshots":[18],"pages":["（p30）"],"kind":"黄色重点补充"},"id":"XB06-01","knowledge":["XB06-01-K1"],"type":"single","stem":"“五位一体”总体布局与“四个全面”战略布局，对应的推进方式依次是？（单选）","options":["统筹推进；协调推进","统筹推进；同步推进","协调推进；统筹推进","同步推进；协调推进"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"协调推进；统筹推进","reason":"此项把两个布局对应的固定用词前后对调。"},{"text":"统筹推进；同步推进","reason":"“四个全面”对应协调推进，不是同步推进。"},{"text":"同步推进；协调推进","reason":"“五位一体”对应统筹推进，不是同步推进。"}],"explanation":"正确项：统筹推进；协调推进。\n原文要点：统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局。\n逐项辨析：\n“协调推进；统筹推进”：此项把两个布局对应的固定用词前后对调。\n“统筹推进；同步推进”：“四个全面”对应协调推进，不是同步推进。\n“同步推进；协调推进”：“五位一体”对应统筹推进，不是同步推进。\n出处：《期末重点截图.docx》截图018，截图标注（p30）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":1,"topic":11,"label":"两个布局各自的推进方式 · 期末截图","paragraphs":[355],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B06","screenshots":[18],"pages":["（p30）"],"kind":"黄色重点补充"},"id":"XB06-02","knowledge":["XB06-02-K1","XB06-02-K2"],"type":"multi","stem":"下列关于两个布局的固定表述，正确的有：（多选）","options":["协调推进“五位一体”总体布局","统筹推进“四个全面”战略布局","协调推进“四个全面”战略布局","统筹推进“五位一体”总体布局"],"answer":[2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"协调推进“五位一体”总体布局","reason":"按截图固定表述，“五位一体”应与统筹推进对应。"},{"text":"统筹推进“四个全面”战略布局","reason":"按截图固定表述，“四个全面”应与协调推进对应。"}],"explanation":"正确项：统筹推进“五位一体”总体布局；协调推进“四个全面”战略布局。\n原文要点：统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局。\n逐项辨析：\n“协调推进“五位一体”总体布局”：按截图固定表述，“五位一体”应与统筹推进对应。\n“统筹推进“四个全面”战略布局”：按截图固定表述，“四个全面”应与协调推进对应。\n出处：《期末重点截图.docx》截图018，截图标注（p30）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":29,"label":"绿色发展的完整定位 · 期末截图","paragraphs":[356],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B07","screenshots":[60],"pages":["（p115）"],"kind":"黄色重点补充"},"id":"XB07-01","knowledge":["XB07-01-K1"],"type":"single","stem":"绿色除了是永续发展的必要条件，还是？（单选）","options":["人民对美好生活追求的重要体现","持续健康发展的内在要求","解决社会公平正义问题的直接对应","国家繁荣发展的必由之路"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"国家繁荣发展的必由之路","reason":"这是开放的定位，不是绿色的这一表述。"},{"text":"持续健康发展的内在要求","reason":"这是协调的定位，不能与绿色互换。"},{"text":"解决社会公平正义问题的直接对应","reason":"共享注重解决社会公平正义问题，绿色注重人与自然和谐共生。"}],"explanation":"正确项：人民对美好生活追求的重要体现。\n原文要点：绿色是永续发展的必要条件和人民对美好生活追求的重要体现。\n逐项辨析：\n“国家繁荣发展的必由之路”：这是开放的定位，不是绿色的这一表述。\n“持续健康发展的内在要求”：这是协调的定位，不能与绿色互换。\n“解决社会公平正义问题的直接对应”：共享注重解决社会公平正义问题，绿色注重人与自然和谐共生。\n出处：《期末重点截图.docx》截图060，截图标注（p115）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":31,"label":"市场作用与政府作用的统一关系 · 期末截图","paragraphs":[357],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B08","screenshots":[63],"pages":["（p124）"],"kind":"黄色重点补充"},"id":"XB08-01","knowledge":["XB08-01-K1","XB08-01-K2"],"type":"multi","stem":"市场决定性作用与更好发挥政府作用之间的关系，下列正确的有：（多选）","options":["不能将二者割裂开来、对立起来","市场起决定性作用就意味着政府无需发挥作用","二者有机统一","二者相互否定，只能选择一种"],"answer":[0,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"二者相互否定，只能选择一种","reason":"截图明确二者不是相互否定的，不能二选一。"},{"text":"市场起决定性作用就意味着政府无需发挥作用","reason":"市场决定性作用与更好发挥政府作用相统一。"}],"explanation":"正确项：二者有机统一；不能将二者割裂开来、对立起来。\n原文要点：使市场在资源配置中起决定性作用，更好发挥政府作用，二者是有机统一的，不是相互否定的，不能割裂开来、对立起来。\n逐项辨析：\n“二者相互否定，只能选择一种”：截图明确二者不是相互否定的，不能二选一。\n“市场起决定性作用就意味着政府无需发挥作用”：市场决定性作用与更好发挥政府作用相统一。\n出处：《期末重点截图.docx》截图063，截图标注（p124）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":39,"label":"政治制度体系与根本政治制度安排 · 期末截图","paragraphs":[358],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B09","screenshots":[75],"pages":["（p160）"],"kind":"黄色重点补充"},"id":"XB09-01","knowledge":["XB09-01-K1","XB09-01-K2","XB09-01-K3"],"type":"multi","stem":"中国特色社会主义政治制度体系由哪些层次的制度等组成？（多选）","options":["重要政治制度","基本政治制度","根本政治制度","一般经济制度"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"一般经济制度","reason":"本题考政治制度体系，不能用经济制度替代其层次。"}],"explanation":"正确项：根本政治制度；基本政治制度；重要政治制度。\n原文要点：中国特色社会主义政治制度是由根本政治制度、基本政治制度、重要政治制度等组成的制度体系。人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。\n逐项辨析：\n“一般经济制度”：本题考政治制度体系，不能用经济制度替代其层次。\n出处：《期末重点截图.docx》截图075，截图标注（p160）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":39,"label":"政治制度体系与根本政治制度安排 · 期末截图","paragraphs":[358],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B09","screenshots":[75],"pages":["（p160）"],"kind":"黄色重点补充"},"id":"XB09-02","knowledge":["XB09-02-K1"],"type":"single","stem":"坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排是？（单选）","options":["中国共产党领导的多党合作和政治协商制度","民族区域自治制度","基层群众自治制度","人民代表大会制度"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"中国共产党领导的多党合作和政治协商制度","reason":"此项属于基本政治制度，不能替代根本政治制度安排。"},{"text":"民族区域自治制度","reason":"民族区域自治制度是基本政治制度，不是本题的根本政治制度安排。"},{"text":"基层群众自治制度","reason":"基层群众自治制度是基本政治制度，不能与人大制度地位混淆。"}],"explanation":"正确项：人民代表大会制度。\n原文要点：中国特色社会主义政治制度是由根本政治制度、基本政治制度、重要政治制度等组成的制度体系。人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。\n逐项辨析：\n“中国共产党领导的多党合作和政治协商制度”：此项属于基本政治制度，不能替代根本政治制度安排。\n“民族区域自治制度”：民族区域自治制度是基本政治制度，不是本题的根本政治制度安排。\n“基层群众自治制度”：基层群众自治制度是基本政治制度，不能与人大制度地位混淆。\n出处：《期末重点截图.docx》截图075，截图标注（p160）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":37,"label":"三个有机统一的实践归宿 · 期末截图","paragraphs":[359],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B10","screenshots":[76],"pages":["（p163）"],"kind":"黄色重点补充"},"id":"XB10-01","knowledge":["XB10-01-K1"],"type":"single","stem":"党的领导、人民当家作主、依法治国三者统一于什么实践？（单选）","options":["社会主义文化建设全部实践","国家机关单一执法环节","我国社会主义民主政治伟大实践","中国特色社会主义市场经济实践"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"中国特色社会主义市场经济实践","reason":"题目讨论民主政治，不能把归宿替换为市场经济实践。"},{"text":"社会主义文化建设全部实践","reason":"文化建设不是这一政治关系的原句归宿。"},{"text":"国家机关单一执法环节","reason":"三者统一于民主政治伟大实践，不能缩减为单一环节。"}],"explanation":"正确项：我国社会主义民主政治伟大实践。\n原文要点：党的领导、人民当家作主、依法治国，三者统一于我国社会主义民主政治伟大实践。党的领导是人民当家作主和依法治国的根本保证。\n逐项辨析：\n“中国特色社会主义市场经济实践”：题目讨论民主政治，不能把归宿替换为市场经济实践。\n“社会主义文化建设全部实践”：文化建设不是这一政治关系的原句归宿。\n“国家机关单一执法环节”：三者统一于民主政治伟大实践，不能缩减为单一环节。\n出处：《期末重点截图.docx》截图076，截图标注（p163）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":37,"label":"三个有机统一的实践归宿 · 期末截图","paragraphs":[359],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B10","screenshots":[76],"pages":["（p163）"],"kind":"黄色重点补充"},"id":"XB10-02","knowledge":["XB10-02-K1"],"type":"single","stem":"在三个有机统一中，党的领导是人民当家作主和依法治国的什么？（单选）","options":["本质特征","重要保障","根本保证","基本方式"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"本质特征","reason":"人民当家作主是社会主义民主政治的本质特征，不能移作党的领导的定位。"},{"text":"基本方式","reason":"依法治国是党领导人民治理国家的基本方式。"},{"text":"重要保障","reason":"党的领导在这一关系中的固定定位是根本保证，重要保障弱化并改变了用词。"}],"explanation":"正确项：根本保证。\n原文要点：党的领导、人民当家作主、依法治国，三者统一于我国社会主义民主政治伟大实践。党的领导是人民当家作主和依法治国的根本保证。\n逐项辨析：\n“本质特征”：人民当家作主是社会主义民主政治的本质特征，不能移作党的领导的定位。\n“基本方式”：依法治国是党领导人民治理国家的基本方式。\n“重要保障”：党的领导在这一关系中的固定定位是根本保证，重要保障弱化并改变了用词。\n出处：《期末重点截图.docx》截图076，截图标注（p163）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":38,"label":"全过程人民民主的实质成效 · 期末截图","paragraphs":[360],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B11","screenshots":[79],"pages":["（p168）"],"kind":"黄色重点补充"},"id":"XB11-01","knowledge":["XB11-01-K1","XB11-01-K2","XB11-01-K3"],"type":"multi","stem":"全过程人民民主的实质成效包括：（多选）","options":["维护和保障人民群众的根本利益","有效促进国家治理高效和社会和谐稳定","确保人民充分享有各方面权利","只关注投票程序，不关心治理成效"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"只关注投票程序，不关心治理成效","reason":"截图同时强调权利保障、治理成效和根本利益，不能局限于投票程序。"}],"explanation":"正确项：确保人民充分享有各方面权利；有效促进国家治理高效和社会和谐稳定；维护和保障人民群众的根本利益。\n原文要点：全过程人民民主既能确保人民充分享有各方面权利，又能有效促进国家治理高效和社会和谐稳定，维护和保障人民群众的根本利益。\n逐项辨析：\n“只关注投票程序，不关心治理成效”：截图同时强调权利保障、治理成效和根本利益，不能局限于投票程序。\n出处：《期末重点截图.docx》截图079，截图标注（p168）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":39,"label":"人民代表大会制度的伟大创造地位 · 期末截图","paragraphs":[361],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B12","screenshots":[80],"pages":["（p170）"],"kind":"黄色重点补充"},"id":"XB12-01","knowledge":["XB12-01-K1"],"type":"single","stem":"人民代表大会制度是我们党领导人民在哪一领域的伟大创造？（单选）","options":["人类社会福利制度史","人类行政管理技术史","人类经济体制演变史","人类政治制度史"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人类社会福利制度史","reason":"此项把人大制度的政治制度属性替换成社会福利属性。"},{"text":"人类经济体制演变史","reason":"人大制度是政治制度，不能改为经济体制。"},{"text":"人类行政管理技术史","reason":"根本政治制度不能缩减为行政管理技术。"}],"explanation":"正确项：人类政治制度史。\n原文要点：人民代表大会制度是我们党领导人民在人类政治制度史上的伟大创造。\n逐项辨析：\n“人类社会福利制度史”：此项把人大制度的政治制度属性替换成社会福利属性。\n“人类经济体制演变史”：人大制度是政治制度，不能改为经济体制。\n“人类行政管理技术史”：根本政治制度不能缩减为行政管理技术。\n出处：《期末重点截图.docx》截图080，截图标注（p170）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"中国特色社会主义法治之魂 · 期末截图","paragraphs":[362],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B13","screenshots":[87],"pages":["（p185-187）"],"kind":"黄色重点补充"},"id":"XB13-01","knowledge":["XB13-01-K1"],"type":"single","stem":"中国特色社会主义法治之魂是什么？（单选）","options":["党的领导","社会主义市场经济","民主集中制","人民当家作主"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人民当家作主","reason":"本题考法治之魂的固定对应，应为党的领导。"},{"text":"民主集中制","reason":"民主集中制是党的根本组织原则和领导制度，不是此处法治之魂。"},{"text":"社会主义市场经济","reason":"此项属于经济体制概念，不能替代法治之魂。"}],"explanation":"正确项：党的领导。\n原文要点：党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。\n逐项辨析：\n“人民当家作主”：本题考法治之魂的固定对应，应为党的领导。\n“民主集中制”：民主集中制是党的根本组织原则和领导制度，不是此处法治之魂。\n“社会主义市场经济”：此项属于经济体制概念，不能替代法治之魂。\n出处：《期末重点截图.docx》截图087，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"中国特色社会主义法治之魂 · 期末截图","paragraphs":[362],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B13","screenshots":[87],"pages":["（p185-187）"],"kind":"黄色重点补充"},"id":"XB13-02","knowledge":["XB13-02-K1"],"type":"single","stem":"按照截图，我国法治同西方资本主义国家法治最大的区别在于？（单选）","options":["是否制定成文法律","坚持党的领导","是否设置司法机关","是否存在市场经济"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"是否制定成文法律","reason":"成文法律不是截图所指出的最大区别。"},{"text":"是否存在市场经济","reason":"市场经济的存在与否不是截图这一判断。"},{"text":"是否设置司法机关","reason":"是否设置司法机关不能替代党的领导这一根本对应。"}],"explanation":"正确项：坚持党的领导。\n原文要点：党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。\n逐项辨析：\n“是否制定成文法律”：成文法律不是截图所指出的最大区别。\n“是否存在市场经济”：市场经济的存在与否不是截图这一判断。\n“是否设置司法机关”：是否设置司法机关不能替代党的领导这一根本对应。\n出处：《期末重点截图.docx》截图087，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"中国特色社会主义法治之魂 · 期末截图","paragraphs":[362],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B13","screenshots":[87],"pages":["（p185-187）"],"kind":"黄色重点补充"},"id":"XB13-03","knowledge":["XB13-03-K1"],"type":"single","stem":"党的领导在中国特色社会主义法治中的地位，正确概括是？（单选）","options":["中国特色社会主义法治之魂","中国特色社会主义法治的临时条件","中国特色社会主义法治的可选补充","中国特色社会主义法治的技术环节"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"中国特色社会主义法治的临时条件","reason":"党的领导不是临时条件，而是法治之魂。"},{"text":"中国特色社会主义法治的可选补充","reason":"党的领导不能作为可选补充。"},{"text":"中国特色社会主义法治的技术环节","reason":"法治之魂不能降为一般技术环节。"}],"explanation":"正确项：中国特色社会主义法治之魂。\n原文要点：党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。\n逐项辨析：\n“中国特色社会主义法治的临时条件”：党的领导不是临时条件，而是法治之魂。\n“中国特色社会主义法治的可选补充”：党的领导不能作为可选补充。\n“中国特色社会主义法治的技术环节”：法治之魂不能降为一般技术环节。\n出处：《期末重点截图.docx》截图087，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"全面依法治国的根本目的 · 期末截图","paragraphs":[363],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B14","screenshots":[88,89],"pages":["（p185-187）"],"kind":"黄色重点补充"},"id":"XB14-01","knowledge":["XB14-01-K1"],"type":"single","stem":"推进全面依法治国的根本目的是什么？（单选）","options":["建设中国特色社会主义法治体系","实现国家各项工作法治化","提高党依法治国、依法执政的能力","依法保障人民权益"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"建设中国特色社会主义法治体系","reason":"建设中国特色社会主义法治体系属于全面依法治国总目标，题目问根本目的。"},{"text":"提高党依法治国、依法执政的能力","reason":"提高依法治国、依法执政能力是相关要求，不能替代依法保障人民权益这一根本目的。"},{"text":"实现国家各项工作法治化","reason":"国家各项工作法治化是推进法治建设的重要要求，题目所问根本目的对应人民权益。"}],"explanation":"正确项：依法保障人民权益。\n原文要点：推进全面依法治国，根本目的是依法保障人民权益。\n逐项辨析：\n“建设中国特色社会主义法治体系”：建设中国特色社会主义法治体系属于全面依法治国总目标，题目问根本目的。\n“提高党依法治国、依法执政的能力”：提高依法治国、依法执政能力是相关要求，不能替代依法保障人民权益这一根本目的。\n“实现国家各项工作法治化”：国家各项工作法治化是推进法治建设的重要要求，题目所问根本目的对应人民权益。\n出处：《期末重点截图.docx》截图088、089，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":44,"label":"法律规范体系的完整定义 · 期末截图","paragraphs":[364],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B15","screenshots":[96],"pages":["（p192）"],"kind":"黄色重点补充"},"id":"XB15-01","knowledge":["XB15-01-K1","XB15-01-K2","XB15-01-K3"],"type":"multi","stem":"以宪法为核心的法律规范体系，其法律规范的特征包括：（多选）","options":["部门齐全","内部协调","部门齐全、结构严密、外部协调","结构严谨"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"部门齐全、结构严密、外部协调","reason":"此项把法律规范特征中的内部协调换成外部协调。"}],"explanation":"正确项：部门齐全；结构严谨；内部协调。\n原文要点：法律规范体系是以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律规范所构成的有机整体。\n逐项辨析：\n“部门齐全、结构严密、外部协调”：此项把法律规范特征中的内部协调换成外部协调。\n出处：《期末重点截图.docx》截图096，截图标注（p192）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":44,"label":"法律规范体系的完整定义 · 期末截图","paragraphs":[364],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B15","screenshots":[96],"pages":["（p192）"],"kind":"黄色重点补充"},"id":"XB15-02","knowledge":["XB15-02-K1","XB15-02-K2","XB15-02-K3"],"type":"multi","stem":"关于法律规范体系的完整定义，下列与原文相符的有：（多选）","options":["以党章为核心","以宪法为核心","体例科学","调整有效"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"以党章为核心","reason":"法律规范体系以宪法为核心，党章是党内法规体系的根本。"}],"explanation":"正确项：以宪法为核心；体例科学；调整有效。\n原文要点：法律规范体系是以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律规范所构成的有机整体。\n逐项辨析：\n“以党章为核心”：法律规范体系以宪法为核心，党章是党内法规体系的根本。\n出处：《期末重点截图.docx》截图096，截图标注（p192）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":44,"label":"党内法规体系的完整组成 · 期末截图","paragraphs":[365],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B16","screenshots":[97],"pages":["（p194）"],"kind":"黄色重点补充"},"id":"XB16-01","knowledge":["XB16-01-K1"],"type":"single","stem":"党内法规体系的主干是什么？（单选）","options":["准则、条例等中央党内法规","宪法及普通法律","部委党内法规、地方党内法规","地方性法规和行政规章"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"部委党内法规、地方党内法规","reason":"这两类是重要组成部分，不能与主干互换。"},{"text":"宪法及普通法律","reason":"此项混淆国家法律规范体系与党内法规体系。"},{"text":"地方性法规和行政规章","reason":"此项属于国家法律规范，不能替代中央党内法规。"}],"explanation":"正确项：准则、条例等中央党内法规。\n原文要点：党内法规体系以党章为根本，以民主集中制为核心，以准则、条例等中央党内法规为主干，以部委党内法规、地方党内法规为重要组成部分，由各领域各层级党内法规组成有机统一整体。\n逐项辨析：\n“部委党内法规、地方党内法规”：这两类是重要组成部分，不能与主干互换。\n“宪法及普通法律”：此项混淆国家法律规范体系与党内法规体系。\n“地方性法规和行政规章”：此项属于国家法律规范，不能替代中央党内法规。\n出处：《期末重点截图.docx》截图097，截图标注（p194）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":44,"label":"党内法规体系的完整组成 · 期末截图","paragraphs":[365],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B16","screenshots":[97],"pages":["（p194）"],"kind":"黄色重点补充"},"id":"XB16-02","knowledge":["XB16-02-K1"],"type":"single","stem":"党内法规体系的重要组成部分是？（单选）","options":["地方性法规、地方政府规章","部门规章、行政法规","准则、条例等中央党内法规","部委党内法规、地方党内法规"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"准则、条例等中央党内法规","reason":"中央党内法规是主干，题目问重要组成部分。"},{"text":"地方性法规、地方政府规章","reason":"地方性法规和政府规章不是地方党内法规。"},{"text":"部门规章、行政法规","reason":"行政法规和部门规章属于国家法律规范。"}],"explanation":"正确项：部委党内法规、地方党内法规。\n原文要点：党内法规体系以党章为根本，以民主集中制为核心，以准则、条例等中央党内法规为主干，以部委党内法规、地方党内法规为重要组成部分，由各领域各层级党内法规组成有机统一整体。\n逐项辨析：\n“准则、条例等中央党内法规”：中央党内法规是主干，题目问重要组成部分。\n“地方性法规、地方政府规章”：地方性法规和政府规章不是地方党内法规。\n“部门规章、行政法规”：行政法规和部门规章属于国家法律规范。\n出处：《期末重点截图.docx》截图097，截图标注（p194）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":44,"label":"党内法规体系的完整组成 · 期末截图","paragraphs":[365],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B16","screenshots":[97],"pages":["（p194）"],"kind":"黄色重点补充"},"id":"XB16-03","knowledge":["XB16-03-K1","XB16-03-K2"],"type":"multi","stem":"关于党内法规体系，下列对应正确的有：（多选）","options":["以党章为根本","以民主集中制为根本","以党章为核心","以民主集中制为核心"],"answer":[0,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"以民主集中制为根本","reason":"此项把根本与核心互换；根本是党章。"},{"text":"以党章为核心","reason":"按完整定义，核心是民主集中制，党章是根本。"}],"explanation":"正确项：以党章为根本；以民主集中制为核心。\n原文要点：党内法规体系以党章为根本，以民主集中制为核心，以准则、条例等中央党内法规为主干，以部委党内法规、地方党内法规为重要组成部分，由各领域各层级党内法规组成有机统一整体。\n逐项辨析：\n“以民主集中制为根本”：此项把根本与核心互换；根本是党章。\n“以党章为核心”：按完整定义，核心是民主集中制，党章是根本。\n出处：《期末重点截图.docx》截图097，截图标注（p194）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":42,"label":"建设法治中国总体目标的完整内容 · 期末截图","paragraphs":[366],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B17","screenshots":[98],"pages":["（p195）"],"kind":"黄色重点补充"},"id":"XB17-01","knowledge":["XB17-01-K1","XB17-01-K2","XB17-01-K3"],"type":"multi","stem":"建设法治中国的总体目标中，关于法律、执法司法与权力运行的表述，正确的有：（多选）","options":["权力运行受到充分尊重保障","法律规范科学完备统一","执法司法公正高效权威","权力运行受到有效制约监督"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"权力运行受到充分尊重保障","reason":"充分尊重保障对应人民合法权益，权力运行对应有效制约监督。"}],"explanation":"正确项：法律规范科学完备统一；执法司法公正高效权威；权力运行受到有效制约监督。\n原文要点：实现法律规范科学完备统一，执法司法公正高效权威，权力运行受到有效制约监督，人民合法权益得到充分尊重保障，法治信仰普遍确立，法治国家、法治政府、法治社会全面建成。\n逐项辨析：\n“权力运行受到充分尊重保障”：充分尊重保障对应人民合法权益，权力运行对应有效制约监督。\n出处：《期末重点截图.docx》截图098，截图标注（p195）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":42,"label":"建设法治中国总体目标的完整内容 · 期末截图","paragraphs":[366],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B17","screenshots":[98],"pages":["（p195）"],"kind":"黄色重点补充"},"id":"XB17-02","knowledge":["XB17-02-K1","XB17-02-K2","XB17-02-K3"],"type":"multi","stem":"建设法治中国的总体目标还包括：（多选）","options":["法治国家、法治政府、法治社会全面建成","法治信仰普遍确立","人民合法权益得到充分尊重保障","法治信仰基本确立"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"法治信仰基本确立","reason":"总体目标原文是普遍确立，此项把普遍换成基本。"}],"explanation":"正确项：人民合法权益得到充分尊重保障；法治信仰普遍确立；法治国家、法治政府、法治社会全面建成。\n原文要点：实现法律规范科学完备统一，执法司法公正高效权威，权力运行受到有效制约监督，人民合法权益得到充分尊重保障，法治信仰普遍确立，法治国家、法治政府、法治社会全面建成。\n逐项辨析：\n“法治信仰基本确立”：总体目标原文是普遍确立，此项把普遍换成基本。\n出处：《期末重点截图.docx》截图098，截图标注（p195）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":10,"topic":45,"label":"文化自信的第二组地位表述 · 期末截图","paragraphs":[367],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B18","screenshots":[100],"pages":["（p202-203）"],"kind":"黄色重点补充"},"id":"XB18-01","knowledge":["XB18-01-K1"],"type":"single","stem":"文化自信是一个国家、一个民族发展中怎样的力量？（单选）","options":["最直接、最迅速、最短期","更基础、更广泛、更深厚","最普遍、最均衡、最外在","最基本、最深沉、最持久"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"最直接、最迅速、最短期","reason":"三个词均改变了原文对力量性质的表述。"},{"text":"更基础、更广泛、更深厚","reason":"这是文化自信作为自信的定位；本题问作为发展力量的另一组固定表述。"},{"text":"最普遍、最均衡、最外在","reason":"此项将最基本、最深沉、最持久替换为其他概念。"}],"explanation":"正确项：最基本、最深沉、最持久。\n原文要点：文化自信是一个国家、一个民族发展中最基本、最深沉、最持久的力量。\n逐项辨析：\n“最直接、最迅速、最短期”：三个词均改变了原文对力量性质的表述。\n“更基础、更广泛、更深厚”：这是文化自信作为自信的定位；本题问作为发展力量的另一组固定表述。\n“最普遍、最均衡、最外在”：此项将最基本、最深沉、最持久替换为其他概念。\n出处：《期末重点截图.docx》截图100，截图标注（p202-203）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":10,"topic":47,"label":"理论最新成果与最现实最鲜活的马克思主义 · 期末截图","paragraphs":[368],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B19","screenshots":[104],"pages":["（p208）"],"kind":"黄色重点补充"},"id":"XB19-01","knowledge":["XB19-01-K1","XB19-01-K2","XB19-01-K3"],"type":"multi","stem":"关于马克思主义的发展和这一思想的地位，下列正确的有：（多选）","options":["这一思想是当今时代最现实、最鲜活的马克思主义","马克思主义的具体结论不随实践发展而发展","马克思主义始终随着时代、实践、认识发展而发展","这一思想是马克思主义中国化时代化最新成果"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"马克思主义的具体结论不随实践发展而发展","reason":"此项把发展的理论僵化为不变的具体结论。"}],"explanation":"正确项：马克思主义始终随着时代、实践、认识发展而发展；这一思想是马克思主义中国化时代化最新成果；这一思想是当今时代最现实、最鲜活的马克思主义。\n原文要点：马克思主义始终是随着时代、实践、认识发展而发展的。习近平新时代中国特色社会主义思想是马克思主义中国化时代化最新成果，是当今时代最现实、最鲜活的马克思主义。\n逐项辨析：\n“马克思主义的具体结论不随实践发展而发展”：此项把发展的理论僵化为不变的具体结论。\n出处：《期末重点截图.docx》截图104，截图标注（p208）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":10,"topic":48,"label":"精神谱系与四个历史时期的对应 · 期末截图","paragraphs":[369],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B20","screenshots":[107],"pages":["（p215）"],"kind":"黄色重点补充"},"id":"XB20-01","knowledge":["XB20-01-K1","XB20-01-K2","XB20-01-K3"],"type":"multi","stem":"按照截图列举，下列属于新民主主义革命时期铸就的精神的有：（多选）","options":["苏区精神","雷锋精神","井冈山精神","长征精神"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"雷锋精神","reason":"截图将雷锋精神归于社会主义革命和建设时期。"}],"explanation":"正确项：井冈山精神；苏区精神；长征精神。\n原文要点：新民主主义革命时期：井冈山精神、苏区精神、长征精神、遵义会议精神、延安精神、抗战精神、红岩精神、西柏坡精神等。社会主义革命和建设时期：抗美援朝精神、“两弹一星”精神、雷锋精神、焦裕禄精神、大庆精神（铁人精神）、红旗渠精神等。改革开放和社会主义现代化建设新时期：改革开放精神、特区精神、抗洪精神、抗击“非典”精神、抗震救灾精神、载人航天精神等。中国特色社会主义新时代：脱贫攻坚精神、抗疫精神、探月精神、新时代北斗精神等。\n逐项辨析：\n“雷锋精神”：截图将雷锋精神归于社会主义革命和建设时期。\n出处：《期末重点截图.docx》截图107，截图标注（p215）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":10,"topic":48,"label":"精神谱系与四个历史时期的对应 · 期末截图","paragraphs":[369],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B2
