<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#182e29">
  <title>习概刷题 · 把每个知识点学扎实</title>
  <style>:root {
  --paper: #f7f7f3;
  --ink: #182e29;
  --red: #b74135;
  --green: #55766a;
  --line: #dde3dd;
  --muted: #697770;
  --amber: #9c651d;
  --white: #fff;
  --soft: #edf2ec;
  --danger: #fff0ed;
  --radius: 16px;
  --shadow: 0 6px 30px #182e2907;
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  touch-action: manipulation;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
a {
  color: var(--green);
  text-underline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #b7413580;
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-weight: 600;
}
h1,
.display {
  font-family: "STSong", "Songti SC", "SimSun", serif;
  letter-spacing: 0.02em;
}
h1 {
  font-size: 38px;
  line-height: 1.45;
}
h2 {
  font-size: 22px;
  line-height: 1.5;
}
h3 {
  font-size: 17px;
  line-height: 1.6;
}
p {
  line-height: 1.85;
}
.muted {
  color: var(--muted);
}
.mono {
  font-family: Consolas, ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.13em;
  color: var(--green);
  font-weight: 700;
}
.shell {
  display: grid;
  grid-template-columns: 246px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--ink);
  color: #e5eee8;
  padding: 32px 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #55766a transparent;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 30px;
  padding: 0 10px;
}
.brand-mark {
  width: 42px;
  height: 42px;
  background: var(--red);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font:
    25px "SimSun",
    serif;
}
.brand-title {
  font-size: 22px;
  letter-spacing: 0.06em;
}
.brand small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.13em;
  color: #a3b4aa;
  margin-top: 5px;
}
.main-nav {
  display: grid;
  gap: 5px;
}
.nav-item {
  border: 0;
  background: none;
  color: #b8c8bf;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  width: 100%;
}
.nav-item:hover {
  background: #ffffff0c;
  color: white;
}
.nav-item.active {
  background: #eaf0e7;
  color: var(--ink);
  font-weight: 700;
}
.nav-glyph {
  font-size: 18px;
  width: 20px;
  text-align: center;
}
.nav-item .badge {
  margin-left: auto;
  background: #ffffff18;
  color: inherit;
  min-width: 23px;
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 11px;
}
.nav-item.active .badge {
  background: #182e2910;
}
.side-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: #8da397;
  margin: 32px 12px 12px;
}
.chapter-nav {
  display: grid;
  gap: 3px;
}
.chapter-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: none;
  color: #aebfb5;
  padding: 8px 12px;
  text-align: left;
  font-size: 12px;
  line-height: 1.5;
  border-radius: 7px;
}
.chapter-link:hover {
  background: #ffffff0b;
  color: white;
}
.chapter-link .chapter-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #5c7166;
}
.chapter-link .chapter-dot.done {
  background: #aacfb8;
}
.chapter-link span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-foot {
  border-top: 1px solid #ffffff15;
  margin-top: 26px;
  padding: 18px 12px 0;
  font-size: 11px;
  line-height: 1.9;
  color: #91a69a;
}
.paper-side-note {
  margin: 38px 12px 0;
  padding-top: 24px;
  border-top: 1px solid #ffffff18;
  color: #aec2b5;
}
.paper-side-note .side-label {
  margin: 0;
  font-size: 10px;
  display: block;
}
.paper-side-note p {
  font-size: 12px;
  line-height: 2;
  margin-top: 14px;
  color: #a8bfb0;
}
.paper-side-stats {
  margin-top: 25px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.paper-side-stats strong {
  font:
    42px Consolas,
    monospace;
  color: #e7efe7;
}
.paper-side-stats span {
  font-size: 10px;
  color: #91a69a;
}
.static-field {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: var(--paper);
  border-radius: 9px;
  border: 1px solid var(--line);
  font-size: 12px;
}
.paper-rules {
  display: grid;
  gap: 8px;
  margin-top: 22px;
  color: var(--green);
  font-size: 12px;
  line-height: 1.8;
}
.paper-preview {
  padding: 28px 27px;
  background: #edf2ec;
  display: flex;
  flex-direction: column;
}
.paper-preview-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.paper-preview-top .eyebrow {
  font-size: 10px;
}
.paper-stamp {
  border: 1px solid var(--red);
  color: var(--red);
  font:
    17px "SimSun",
    serif;
  padding: 6px;
  border-radius: 4px;
  transform: rotate(-5deg);
}
.paper-preview h2 {
  font-size: 24px;
  line-height: 1.8;
  font-family: "SimSun", serif;
  letter-spacing: 0.03em;
}
.paper-subtitle {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--green);
  margin-top: 9px;
}
.paper-structure {
  display: grid;
  gap: 16px;
  margin: 29px 0 24px;
  padding: 23px 0;
  border-top: 1px solid #d1dbcf;
  border-bottom: 1px solid #d1dbcf;
}
.paper-structure > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  font-size: 12px;
}
.paper-structure strong {
  font:
    22px Consolas,
    monospace;
}
.paper-structure strong small {
  font:
    10px "Microsoft YaHei",
    sans-serif;
  color: var(--muted);
  margin-left: 7px;
}
.paper-meta {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  font-size: 11px;
  color: var(--muted);
}
.paper-meta strong {
  font-weight: 600;
  color: var(--ink);
}
.paper-preview-note {
  font-size: 10px;
  color: var(--muted);
  margin-top: auto;
  padding-top: 22px;
  line-height: 1.9;
}
.review-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}
.metric-card {
  padding: 23px 25px;
  display: flex;
  flex-direction: column;
  align-items: start;
}
.metric-card > span {
  font-size: 12px;
  color: var(--muted);
}
.metric-card > strong {
  font:
    37px Consolas,
    monospace;
  margin: 15px 0 10px;
}
.metric-card strong small {
  font-size: 13px;
  color: var(--muted);
}
.metric-card p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.9;
}
.metric-card .text-button {
  margin-top: auto;
  font-size: 11px;
}
@media (max-width: 720px) {
  .paper-side-note {
    display: none;
  }
  .paper-preview {
    padding: 23px;
  }
  .paper-preview h2 {
    font-size: 25px;
  }
  .review-metrics {
    grid-template-columns: 1fr;
  }
  .metric-card {
    padding: 21px 23px;
  }
  .paper-rules {
    font-size: 11px;
  }
  .paper-structure {
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .paper-structure > div {
    font-size: 11px;
  }
  .paper-structure strong {
    font-size: 21px;
  }
  .section-heading > button.text-button {
    flex-shrink: 0;
    max-width: 80px;
  }
  .study-modes .mode-tab {
    font-size: 11px;
    line-height: 1.8;
  }
}
.content {
  min-width: 0;
}
.topbar {
  height: 77px;
  padding: 0 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: #ffffff70;
  gap: 16px;
}
.breadcrumb {
  font-size: 13px;
  color: var(--muted);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--muted);
}
.online-dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  background: var(--green);
  border-radius: 50%;
  margin-right: 6px;
}
.text-button {
  border: 0;
  background: none;
  color: var(--green);
  padding: 7px 4px;
  font-size: 12px;
}
.main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 38px 44px 60px;
}
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}
.section-heading p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 9px;
  max-width: 680px;
}
.title-meta {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.panel {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(240px, 1fr);
  gap: 24px;
}
.study-panel {
  padding: 29px 30px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 23px;
}
.panel-head small {
  color: var(--muted);
  font-size: 12px;
}
.study-modes {
  display: flex;
  gap: 7px;
  background: var(--paper);
  border-radius: 11px;
  padding: 5px;
  margin-bottom: 23px;
}
.mode-tab {
  flex: 1;
  border: 0;
  border-radius: 8px;
  color: var(--muted);
  background: none;
  padding: 11px 8px;
  font-size: 13px;
}
.mode-tab.active {
  background: var(--white);
  box-shadow: 0 2px 7px #182e2910;
  color: var(--ink);
  font-weight: 700;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 16px;
}
.form-field {
  display: grid;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}
.form-field.full {
  grid-column: 1/-1;
}
select,
.search-input,
input[type="number"] {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 9px;
  padding: 11px 12px;
  color: var(--ink);
  font-size: 13px;
  min-width: 0;
  width: 100%;
  height: 44px;
}
.check-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.check-label input {
  accent-color: var(--red);
  width: 15px;
  height: 15px;
}
.form-footer {
  border-top: 1px solid var(--line);
  margin-top: 23px;
  padding-top: 21px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.pool-label {
  font-size: 12px;
  color: var(--muted);
}
.pool-label strong {
  color: var(--ink);
  font-size: 17px;
  margin: 0 5px;
}
.btn {
  border: 1px solid transparent;
  border-radius: 9px;
  min-height: 43px;
  padding: 11px 22px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  line-height: 1.5;
  text-decoration: none;
}
.primary {
  background: var(--red);
  color: white;
}
.primary:hover {
  background: #a1362d;
}
.secondary {
  background: white;
  border-color: var(--line);
  color: var(--ink);
}
.secondary:hover {
  background: var(--paper);
}
.quiet {
  background: var(--soft);
  color: var(--green);
}
.btn.small {
  padding: 7px 12px;
  min-height: 34px;
  font-size: 12px;
}
.overview {
  padding: 27px;
  background: #edf2ec;
  display: flex;
  flex-direction: column;
  border-color: #dae3d9;
}
.overview .eyebrow {
  margin-bottom: 18px;
}
.progress-ring {
  width: 144px;
  height: 144px;
  margin: 6px auto 22px;
  border-radius: 50%;
  background: conic-gradient(var(--green) var(--progress), #d9e3d8 0);
  display: grid;
  place-items: center;
  position: relative;
}
.progress-ring:before {
  content: "";
  position: absolute;
  inset: 9px;
  background: #edf2ec;
  border-radius: 50%;
}
.ring-copy {
  position: relative;
  text-align: center;
}
.ring-copy strong {
  display: block;
  font:
    38px Consolas,
    monospace;
}
.ring-copy small {
  font-size: 11px;
  color: var(--muted);
}
.overview-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid #d5dfd4;
  padding-top: 20px;
  margin-top: auto;
  gap: 20px;
}
.overview-stats strong {
  font:
    24px Consolas,
    monospace;
  display: block;
  margin-bottom: 6px;
}
.overview-stats small {
  font-size: 11px;
  color: var(--muted);
}
.overview-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 18px;
  line-height: 1.8;
}
.resume-banner {
  background: var(--ink);
  color: white;
  border-radius: 12px;
  padding: 18px 23px;
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}
.resume-banner small {
  color: #b6c8bd;
  display: block;
  margin-top: 5px;
  font-size: 12px;
}
.resume-banner .btn {
  background: #fff;
  color: var(--ink);
  white-space: nowrap;
}
.section {
  margin-top: 34px;
}
.mini-title {
  font-size: 17px;
  margin-bottom: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.mini-title small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}
.journey {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 8px;
  margin-bottom: 17px;
}
.journey-segment {
  height: 9px;
  background: #e1e7e0;
  border-radius: 2px;
  border: 0;
  padding: 0;
  position: relative;
  overflow: hidden;
}
.journey-segment span {
  position: absolute;
  height: 100%;
  background: var(--green);
  left: 0;
  top: 0;
}
.chapters-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.chapter-card {
  padding: 18px 19px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: white;
  text-align: left;
  color: var(--ink);
  position: relative;
  transition:
    transform 0.15s,
    border-color 0.15s;
}
.chapter-card:hover {
  border-color: #8fa79a;
  transform: translateY(-2px);
}
.chapter-card .chapter-num {
  font:
    11px Consolas,
    monospace;
  color: var(--green);
  margin-bottom: 8px;
  display: block;
}
.chapter-card h3 {
  font-size: 13px;
  line-height: 1.65;
  min-height: 43px;
}
.chapter-card .chapter-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 10px;
  color: var(--muted);
}
.chapter-progress {
  height: 3px;
  background: var(--soft);
  margin-top: 9px;
}
.chapter-progress span {
  height: 100%;
  display: block;
  background: var(--green);
}
.type-overview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.type-tile {
  padding: 17px 19px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.type-tile small {
  font-size: 12px;
  color: var(--muted);
}
.type-tile strong {
  font:
    25px Consolas,
    monospace;
}
.footnote {
  margin-top: 30px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.9;
}
.notice {
  padding: 12px 18px;
  background: #fff5df;
  color: var(--amber);
  border: 1px solid #ecddbc;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 20px;
}
.quiz-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 228px;
  gap: 23px;
  align-items: start;
}
.quiz-panel {
  padding: 30px 33px;
}
.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.tag {
  display: inline-flex;
  border-radius: 5px;
  background: var(--soft);
  color: var(--green);
  padding: 4px 8px;
  font-size: 10px;
  vertical-align: middle;
  font-weight: 500;
}
.tag.web {
  background: #fff1d9;
  color: var(--amber);
}
.quiz-stem {
  font-size: 21px;
  line-height: 1.95;
  margin: 25px 0 24px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.quiz-hint {
  font-size: 11px;
  color: var(--muted);
  margin: -12px 0 22px;
}
.quiz-material {
  margin-top: 22px;
  padding: 18px 21px;
  border-left: 3px solid var(--green, #295b49);
  border-radius: 0 8px 8px 0;
  background: #f3f6f2;
  overflow-wrap: anywhere;
}
.material-label { font-size: 11px; font-weight: 600; color: #35604a; letter-spacing: 1px; }
.quiz-material p { font-size: 15px; line-height: 2; margin: 9px 0; }
.quiz-material small { font-size: 11px; line-height: 1.7; color: var(--muted); display: block; }
.options {
  display: grid;
  gap: 12px;
}
.option {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  text-align: left;
  line-height: 1.9;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  padding: 15px 17px;
  font-size: 14px;
  opacity: 1 !important;
}
.option-letter {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  font:
    12px Consolas,
    monospace;
  margin-top: 1px;
  background: white;
}
.options.multi .option-letter {
  border-radius: 5px;
}
.option:hover:not(:disabled) {
  background: #f5f7f3;
  border-color: #9aada1;
}
.option.selected {
  border-color: var(--green);
  background: #eff5ef;
}
.option.selected .option-letter {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.option.is-right {
  border-color: #81a88e;
  background: #edf6ef;
}
.option.is-wrong {

,"material":{"bookPage":105,"pdfPage":116,"kind":"教材内容改编","text":"某改革试点取得阶段性成效后，仍定期检查制度运行中的堵点，根据生产力发展和社会生活的新变化继续调整政策，没有把试点成功当作停止改革的理由。"}},{"id":"F046-S2","chapter":5,"topic":28,"label":"改革应坚持怎样的方向和方法","knowledge":["F046-2"],"paragraphs":[106],"source":"document","web":null,"type":"single","stem":"“改革开放只有进行时，没有____”中，应填入的是哪一种时态？（选择最恰当的一项）","options":["过去时","将来时","进行时","完成时"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"进行时","reason":"本题应为“完成时”，此项将其替换成了“进行时”。"},{"text":"过去时","reason":"本题应为“完成时”，此项将其替换成了“过去时”。"},{"text":"将来时","reason":"本题应为“完成时”，此项将其替换成了“将来时”。"}],"explanation":"正确表述：改革开放只有进行时，没有完成时；要坚定不移扩大高水平对外开放。\n辨析：注意原文中的限定词和概念对应。\n“进行时”：本题应为“完成时”，此项将其替换成了“进行时”。\n“过去时”：本题应为“完成时”，此项将其替换成了“过去时”。\n“将来时”：本题应为“完成时”，此项将其替换成了“将来时”。"},{"id":"F046-B","chapter":5,"topic":28,"label":"改革应坚持怎样的方向和方法","knowledge":["F046-1","F046-2"],"paragraphs":[106],"source":"document","web":null,"type":"fill","stem":"改革开放只有____，没有____；要坚定不移扩大高水平对外开放。","answer":[["进行时"],["完成时"]],"explanation":"逐空对应：进行时；完成时。完整表述：改革开放只有进行时，没有完成时；要坚定不移扩大高水平对外开放。"},{"id":"F046-J","chapter":5,"topic":28,"label":"改革应坚持怎样的方向和方法","knowledge":["F046-1"],"paragraphs":[106],"source":"document","web":null,"type":"judge","stem":"改革开放只有倒退时，没有完成时；要坚定不移扩大高水平对外开放。","answer":false,"explanation":"表述错误，请注意概念与对应关系。正确表述：改革开放只有进行时，没有完成时；要坚定不移扩大高水平对外开放。"},{"id":"F047-S1","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F047-1"],"paragraphs":[110],"source":"document","web":null,"type":"single","stem":"材料体现的、也是全面建设社会主义现代化国家首要任务的发展要求是？（单选）","options":["高效能治理","高质量发展","高速增长","高水平开放"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"高速增长","reason":"本题应为“高质量发展”，此项将其替换成了“高速增长”。"},{"text":"高水平开放","reason":"本题应为“高质量发展”，此项将其替换成了“高水平开放”。"},{"text":"高效能治理","reason":"本题应为“高质量发展”，此项将其替换成了“高效能治理”。"}],"explanation":"材料分析：从单纯数量扩张转向质量、结构、效率和可持续性，指向高质量发展，不能等同于高速增长。\n教材依据：《习近平新时代中国特色社会主义思想概论》第114页（所提供PDF第125页）。\n正确表述：全面建设社会主义现代化国家的首要任务是高质量发展，也是新时代我国经济社会发展的鲜明主题。\n辨析：注意原文中的限定词和概念对应。\n“高速增长”：本题应为“高质量发展”，此项将其替换成了“高速增长”。\n“高水平开放”：本题应为“高质量发展”，此项将其替换成了“高水平开放”。\n“高效能治理”：本题应为“高质量发展”，此项将其替换成了“高效能治理”。","material":{"bookPage":114,"pdfPage":125,"kind":"教材内容改编","text":"某地评价发展成效时，不再只看新增产值与投资规模，而是同时考察创新能力、产业结构、资源利用效率和发展的持续性，推动经济由数量扩张转向提质增效。"}},{"id":"F047-B","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F047-1"],"paragraphs":[110],"source":"document","web":null,"type":"fill","stem":"全面建设社会主义现代化国家的首要任务是____，也是新时代我国经济社会发展的鲜明主题。","answer":[["高质量发展"]],"explanation":"逐空对应：高质量发展。完整表述：全面建设社会主义现代化国家的首要任务是高质量发展，也是新时代我国经济社会发展的鲜明主题。"},{"id":"F047-J","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F047-1"],"paragraphs":[110],"source":"document","web":null,"type":"judge","stem":"全面建设社会主义现代化国家的首要任务是高质量发展，也是新时代我国经济社会发展的鲜明主题。","answer":true,"explanation":"表述正确。正确表述：全面建设社会主义现代化国家的首要任务是高质量发展，也是新时代我国经济社会发展的鲜明主题。"},{"id":"F048-S1","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F048-1"],"paragraphs":[111],"source":"document","web":null,"type":"single","stem":"新发展理念中，创新解决____，是引领发展的第一动力。（选择最恰当的一项）","options":["发展动力问题","社会公平正义问题","发展内外联动问题","发展不平衡问题"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"发展不平衡问题","reason":"本题应为“发展动力问题”，此项将其替换成了“发展不平衡问题”。"},{"text":"发展内外联动问题","reason":"本题应为“发展动力问题”，此项将其替换成了“发展内外联动问题”。"},{"text":"社会公平正义问题","reason":"本题应为“发展动力问题”，此项将其替换成了“社会公平正义问题”。"}],"explanation":"正确表述：新发展理念中，创新解决发展动力问题，是引领发展的第一动力。\n辨析：创新—动力；协调—不平衡；绿色—人与自然；开放—内外联动；共享—公平正义。\n“发展不平衡问题”：本题应为“发展动力问题”，此项将其替换成了“发展不平衡问题”。\n“发展内外联动问题”：本题应为“发展动力问题”，此项将其替换成了“发展内外联动问题”。\n“社会公平正义问题”：本题应为“发展动力问题”，此项将其替换成了“社会公平正义问题”。"},{"id":"F048-B","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F048-1"],"paragraphs":[111],"source":"document","web":null,"type":"fill","stem":"新发展理念中，创新解决____，是引领发展的第一动力。","answer":[["发展动力问题"]],"explanation":"逐空对应：发展动力问题。完整表述：新发展理念中，创新解决发展动力问题，是引领发展的第一动力。"},{"id":"F048-J","chapter":6,"topic":29,"label":"高质量发展的地位与新发展理念","knowledge":["F048-1"],"paragraphs":[111],"source":"document","web":null,"type":"jud ation":"正确表述：走中国特色社会主义政治发展道路，党的领导是根本保障，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。\n辨析：党的领导—根本保障；人民当家作主—本质特征；依法治国—基本方式。\n“根本保障”：本题应为“基本方式”，此项将其替换成了“根本保障”。\n“本质特征”：本题应为“基本方式”，此项将其替换成了“本质特征”。\n“制度载体”：本题应为“基本方式”，此项将其替换成了“制度载体”。"},{"id":"F064-B","chapter":8,"topic":37,"label":"政治发展道路必须坚持什么","knowledge":["F064-1","F064-2","F064-3"],"paragraphs":[136],"source":"document","web":null,"type":"fill","stem":"走中国特色社会主义政治发展道路，党的领导是____，人民当家作主是社会主义民主政治的____，依法治国是党领导人民治理国家的____。","answer":[["根本保障"],["本质特征"],["基本方式"]],"explanation":"逐空对应：根本保障；本质特征；基本方式。完整表述：走中国特色社会主义政治发展道路，党的领导是根本保障，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。"},{"id":"F064-J","chapter":8,"topic":37,"label":"政治发展道路必须坚持什么","knowledge":["F064-1"],"paragraphs":[136],"source":"document","web":null,"type":"judge","stem":"走中国特色社会主义政治发展道路，党的领导是次要补充，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。","answer":false,"explanation":"表述错误，请注意概念与对应关系。正确表述：走中国特色社会主义政治发展道路，党的领导是根本保障，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。"},{"id":"F065-S1","chapter":8,"topic":38,"label":"全过程人民民主的本质属性与优势","knowledge":["F065-1"],"paragraphs":[138],"source":"document","web":null,"type":"single","stem":"材料体现的社会主义民主政治本质属性是？（单选）","options":["选举民主","基层民主","协商民主","全过程人民民主"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"协商民主","reason":"本题应为“全过程人民民主”，此项将其替换成了“协商民主”。"},{"text":"选举民主","reason":"本题应为“全过程人民民主”，此项将其替换成了“选举民主”。"},{"text":"基层民主","reason":"本题应为“全过程人民民主”，此项将其替换成了“基层民主”。"}],"explanation":"材料分析：参与贯穿多个环节而非仅一次投票，体现全过程人民民主，不能只概括为选举民主或某一种参与形式。\n教材依据：《习近平新时代中国特色社会主义思想概论》第164页（所提供PDF第175页）。\n正确表述：社会主义民主政治的本质属性是全过程人民民主，它是新时代我国民主政治领域具有重大创新意义的标志性成果。\n辨析：注意原文中的限定词和概念对应。\n“协商民主”：本题应为“全过程人民民主”，此项将其替换成了“协商民主”。\n“选举民主”：本题应为“全过程人民民主”，此项将其替换成了“选举民主”。\n“基层民主”：本题应为“全过程人民民主”，此项将其替换成了“基层民主”。","material":{"bookPage":164,"pdfPage":175,"kind":"教材内容改编","text":"某公共项目从议题提出、方案讨论、依法作出决定到实施监督，都设置公众参与渠道；参与既有制度保障，也能实际影响项目结果，并不只发生在一次投票中。"}},{"id":"F065-B","chapter":8,"topic":38,"label":"全过程人民民主的本质属性与优势","knowledge":["F065-1"],"paragraphs":[138],"source":"document" null,"type":"single","stem":"人民军队的建军之本、强军之魂是____。（选择最恰当的一项）","options":["党对人民军队的政治领导","党对人民军队的绝对领导","党对人民军队的思想领导","党对人民军队的组织领导"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"党对人民军队的政治领导","reason":"本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的政治领导”。"},{"text":"党对人民军队的组织领导","reason":"本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的组织领导”。"},{"text":"党对人民军队的思想领导","reason":"本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的思想领导”。"}],"explanation":"正确表述：人民军队的建军之本、强军之魂是党对人民军队的绝对领导。\n辨析：建军之本、强军之魂要求党对军队的绝对领导，不能缩减为某一个方面的领导。\n“党对人民军队的政治领导”：本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的政治领导”。\n“党对人民军队的组织领导”：本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的组织领导”。\n“党对人民军队的思想领导”：本题应为“党对人民军队的绝对领导”，此项将其替换成了“党对人民军队的思想领导”。"},{"id":"F099-B","chapter":14,"topic":56,"label":"建军之本与强军目标","knowledge":["F099-1"],"paragraphs":[206],"source":"document","web":null,"type":"fill","stem":"人民军队的建军之本、强军之魂是____。","answer":[["党对人民军队的绝对领导","党对军队的绝对领导"]],"explanation":"逐空对应：党对人民军队的绝对领导。完整表述：人民军队的建军之本、强军之魂是党对人民军队的绝对领导。"},{"id":"F099-J","chapter":14,"topic":56,"label":"建军之本与强军目标","knowledge":["F099-1"],"paragraphs":[206],"source":"document","web":null,"type":"judge","stem":"人民军队的建军之本、强军之魂是党对人民军队的绝对领导。","answer":true,"explanation":"表述正确。正确表述：人民军队的建军之本、强军之魂是党对人民军队的绝对领导。"},{"id":"F100-S1","chapter":14,"topic":56,"label":"建军之本与强军目标","knowledge":["F100-1"],"paragraphs":[207],"source":"document","web":null,"type":"single","stem":"着眼强国强军目标，应把人民军队建成什么样的军队？（单选）","options":["世界最大规模军队","世界一流装备军队","世界一流军队","区域一流军队"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"区域一流军队","reason":"本题应为“世界一流军队”，此项将其替换成了“区域一流军队”。"},{"text":"世界最大规模军队","reason":"本题应为“世界一流军队”，此项将其替换成了“世界最大规模军队”。"},{"text":"世界一流装备军队","reason":"本题应为“世界一流军队”，此项将其替换成了“世界一流装备军队”。"}],"explanation":"材料分析：材料以国家安全需求和世界先进军事水平为参照，目标是世界一流军队，不能用规模最大或单一装备领先替代。\n教材依据：《习近平新时代中国特色社会主义思想概论》第282页（所提供PDF第293页）。\n正确表述：强国必须强军，要把人民军队建成世界一流军队。\n辨析：注意原文中的限定词和概念对应。\n“区域一流军队”：本题应为“世界一流军队”，此项将其替换成了“区域一流军队”。\n“世界最大规模军队”：本题应为“世界一流军队”，此项将其替换成了“世界最大规模军队”。\n“世界一流装备军队”：本题应为“世界一流军队”，此项将其替换成了“世界一流装备军队”。","material":{"bookPage":282,"pdfPage":293,"kind":"教材内容改编","text":"教材分析国防和军队建设时，既指出与国家安全需求相比仍存在差距，也指出与世界先进军事水平相比存在差距，要求在接续奋斗中全面提高现代化水平。"}},{"id":"F100-B","chapter":14,"topic":56,"label":"建军之本与强军目标","knowledge":["F100-1"],"paragraphs":[207],"source":"document","web":null,"type":"fill","stem":"强国必须强军，要把人民军队建成____。","answer":[["世界一流军队"]],"explanation":"逐空对应：世界一流军队。完整表述：强国必须强军，要把人民军队建成世界一流军队。"},{"id":"F100-J","chapter":14,"topic":56,"label":"建军之本与强军目标","knowledge":["F100-1"],"paragraphs":[207],"source":"document","web":null,"type":"judge","stem":"强国必须强军，要把人民军队建成只追求规模的军队。","answer":false,"explanation":"表述错误，请注意概念与对应关系。正确表述：强国必须强军，要把人民军队建成世界一流军队。"},{"id":"F101-S1","chapter":14,"topic":57,"label":"强军思想中的重要对应关系","knowledge":["F101-1"],"paragraphs":[209],"source":"document","web":null,"type":"single","stem":"军队是要准备____的。（选择最恰当的一项）","options":["训练","执勤","威慑","打仗"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"威慑","reason":"本题应为“打仗”，此项将其替换成了“威慑”。"},{"text":"训练","reason":"本题应为“打仗”，此项将其替换成了“训练”。"},{"text":"执勤","reason":"本题应为“打仗”，此项将其替换成了“执勤”。"}],"explanation":"正确表述：军队是要准备打仗的。\n辨析：注意原文中的限定词和概念对应。\n“威慑”：本题应为“打仗”，此项将其替换成了“威慑”。\n“训练”：本题应为“打仗”，此项将其替换成了“训练”。\n“执勤”：本题应为“打仗”，此项将其替换成了“执勤”。"},{"id":"F101-B","chapter":14,"topic":57,"label":"强军思想中的重要对应关系","knowledge":["F101-1"],"paragraphs":[209],"source":"document","web":null,"type":"fill","stem":"军队是要准备____的。","answer":[["打仗"]],"explanation":"逐空对应：打仗。完整表述：军队是要准备打仗的。"},{"id":"F101-J","chapter":14,"topic":57,"label":"强军思想中的重要对应关系","knowledge":["F101-1"],"paragraphs":[209],"source":"document","web":null,"type":"judge","stem":"军队是要准备打仗的。","answer":true,"explanation":"表述正确。正确表述：军队是要准备打仗的。"},{"id":"F102-S1","chapter":14,"topic":57,"label":"强军思想中的重要对应关系","knowledge":["F102-1"],"paragraphs":[209],"source":"document","web":null,"type":"single","stem":"强军思想中，____是核心战斗力。（选择最恰当的一项）","options":["科技","人才","装备","训练"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人才","reason":"本题应为“科技”，此项将其 ge":["F108-1"],"paragraphs":[214],"source":"document","web":null,"type":"judge","stem":"“一国两制”伟大构想最早针对香港问题提出，首先运用于解决香港和澳门问题。","answer":false,"explanation":"表述错误，请注意概念与对应关系。正确表述：“一国两制”伟大构想最早针对台湾问题提出，首先运用于解决香港和澳门问题。"},{"id":"F109-S1","chapter":15,"topic":58,"label":"一国两制的提出 宗旨与最高原则","knowledge":["F109-1"],"paragraphs":[216],"source":"document","web":null,"type":"single","stem":"“一国两制”方针的最高原则是____。（选择最恰当的一项）","options":["保持港澳长期繁荣稳定","保持原有资本主义制度","保障高度自治权","维护国家主权、安全、发展利益"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"保持港澳长期繁荣稳定","reason":"本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保持港澳长期繁荣稳定”。"},{"text":"保持原有资本主义制度","reason":"本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保持原有资本主义制度”。"},{"text":"保障高度自治权","reason":"本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保障高度自治权”。"}],"explanation":"正确表述：“一国两制”方针的最高原则是维护国家主权、安全、发展利益。\n辨析：注意原文中的限定词和概念对应。\n“保持港澳长期繁荣稳定”：本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保持港澳长期繁荣稳定”。\n“保持原有资本主义制度”：本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保持原有资本主义制度”。\n“保障高度自治权”：本题应为“维护国家主权、安全、发展利益”，此项将其替换成了“保障高度自治权”。"},{"id":"F109-B","chapter":15,"topic":58,"label":"一国两制的提出 宗旨与最高原则","knowledge":["F109-1"],"paragraphs":[216],"source":"document","web":null,"type":"fill","stem":"“一国两制”方针的最高原则是____。","answer":[["维护国家主权、安全、发展利益"]],"explanation":"逐空对应：维护国家主权、安全、发展利益。完整表述：“一国两制”方针的最高原则是维护国家主权、安全、发展利益。"},{"id":"F109-J","chapter":15,"topic":58,"label":"一国两制的提出 宗旨与最高原则","knowledge":["F109-1"],"paragraphs":[216],"source":"document","web":null,"type":"judge","stem":"“一国两制”方针的最高原则是维护国家主权、安全、发展利益。","answer":true,"explanation":"表述正确。正确表述：“一国两制”方针的最高原则是维护国家主权、安全、发展利益。"},{"id":"F110-S1","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F110-1"],"paragraphs":[218],"source":"document","web":null,"type":"single","stem":"从“一国”和“两制”的关系看，前提和基础是什么？（单选）","options":["一国","高度自治","两制","港人治港"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"两制","reason":"本题应为“一国”，此项将其替换成了“两制”。"},{"text":"高度自治","reason":"本题应为“一国”，此项将其替换成了“高度自治”。"},{"text":"港人治港","reason":"本题应为“一国”，此项将其替换成了“港人治港”。"}],"explanation":"材料分析：制度差异是在同一国家之内存在，一国是实行两制的前提和基础，两制不能脱离一国。\n教材依据：《习近平新时代中国特色社会主义思想概论》第299页（所提供PDF第310页）。\n正确表述：“一国”是实行“两制”的前提和基础；两制从属和派生于一国，并统一于一国之内。\n辨析：一国是前提和基础，两制从属和派生于一国，两者地位不能倒置。\n“两制”：本题应为“一国”，此项将其替换成了“两制”。\n“高度自治”：本题应为“一国”，此项将其替换成了“高度自治”。\n“港人治港”：本题应为“一国”，此项将其替换成了“港人治港”。","material":{"bookPage":299,"pdfPage":310,"kind":"教材内容改编","text":"讨论特别行政区制度安排时，有同学认为不同社会制度既然可以并存，就应当处于完全平行、互不统属的地位。另一位同学指出，这忽视了国家统一这一前提。"}},{"id":"F110-S2","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F110-2"],"paragraphs":[218],"source":"document","web":null,"type":"single","stem":"在“一国”和“两制”的关系中，从属和派生于一国的是____。（选择最恰当的一项）","options":["一国","澳人治澳","高度自治","两制"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"一国","reason":"本题应为“两制”，此项将其替换成了“一国”。"},{"text":"高度自治","reason":"本题应为“两制”，此项将其替换成了“高度自治”。"},{"text":"澳人治澳","reason":"本题应为“两制”，此项将其替换成了“澳人治澳”。"}],"explanation":"正确表述：“一国”是实行“两制”的前提和基础；两制从属和派生于一国，并统一于一国之内。\n辨析：一国是前提和基础，两制从属和派生于一国，两者地位不能倒置。\n“一国”：本题应为“两制”，此项将其替换成了“一国”。\n“高度自治”：本题应为“两制”，此项将其替换成了“高度自治”。\n“澳人治澳”：本题应为“两制”，此项将其替换成了“澳人治澳”。"},{"id":"F110-B","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F110-1","F110-2"],"paragraphs":[218],"source":"document","web":null,"type":"fill","stem":"“____”是实行“____”的前提和基础；两制从属和派生于一国，并统一于一国之内。","answer":[["一国"],["两制"]],"explanation":"逐空对应：一国；两制。完整表述：“一国”是实行“两制”的前提和基础；两制从属和派生于一国，并统一于一国之内。"},{"id":"F110-J","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F110-1"],"paragraphs":[218],"source":"document","web":null,"type":"judge","stem":"“两国”是实行“两制”的前提和基础；两制从属和派生于一国，并统一于一国之内。","answer":false,"explanation":"表述错误，请注意概念与对应关系。正确表述：“一国”是实行“两制”的前提和基础；两制从属和派生于一国，并统一于一国之内。"},{"id":"F111-S1","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F111-1"],"paragraphs":[219],"source":"document","web":null,"type":"single","stem":"实现两岸统一的最佳方式是“____”。（选择最恰当的一项）","options":["和平统一、一国一制","和平统一、一国两制","和平统一、高度自治","和平发展、一国两制"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"和平统一、一国一制","reason":"本题应为“和平统一、一国两制”，此项将其替换成了“和平统一、一国一制”。"},{"text":"和平发展、一国两制","reason":"本题应为“和平统一、一国两制”，此项将其替换成了“和平发展、一国两制”。"},{"text":"和平统一、高度自治","reason":"本题应为“和平统一、一国两制”，此项将其替换成了“和平统一、高度自治”。"}],"explanation":"正确表述：实现两岸统一的最佳方式是“和平统一、一国两制”。\n辨析：注意原文中的限定词和概念对应。\n“和平统一、一国一制”：本题应为“和平统一、一国两制”，此项将其替换成了“和平统一、一国一制”。\n“和平发展、一国两制”：本题应为“和平统一、一国两制”，此项将其替换成了“和平发展、一国两制”。\n“和平统一、高度自治”：本题应为“和平统一、一国两制”，此项将其替换成了“和平统一、高度自治”。"},{"id":"F111-B","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F111-1"],"paragraphs":[219],"source":"document","web":null,"type":"fill","stem":"实现两岸统一的最佳方式是“____”。","answer":[["和平统一、一国两制"]],"explanation":"逐空对应：和平统一、一国两制。完整表述：实现两岸统一的最佳方式是“和平统一、一国两制”。"},{"id":"F111-J","chapter":15,"topic":59,"label":"一国与两制的关系及统一方式","knowledge":["F111-1"],"paragraphs":[219],"source":"document","web":null,"type":"judge","stem":"实现两岸统一的最佳方式是“和平统一、一国两制”。","answer":true,"explanation":"表述正确。正确表述：实现两岸统一的最佳方式是“和平统一、一国两制”。"},{"id":"F112-S1","chapter":16,"topic":60,"label":"中国特色大国外交的主线与原则","knowledge":["F112-1"],"paragraphs":[224],"source":"document","web":null,"type":"single","stem":"上述要求是在坚持哪一发展道路的同时提出的？（单选）","options":["坚持走均衡发展道路","坚持走协调发展道路","坚持走和平发展道路","坚持走合作发展道路"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"坚持走合作发展道路","reason":"本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走合作发展道路”。"},{"text":"坚持走均衡发展道路","reason":"本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走均衡发展道路”。"},{"text":"坚持走协调发展道路","reason":"本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走协调发展道路”。"}],"explanation":"材料分析：教材将维护正当权益与坚持走和平发展道路相统一，和平发展不能理解为放弃核心利益。\n教材依据：《习近平新时代中国特色社会主义思想概论》第326页（所提供PDF第337页）。\n正确表述：新时代中国外交的基本原则是坚持走和平发展道路。\n辨析：本题按背诵稿所列“新时代中国外交的基本原则”命题；外交政策、交往原则等概念不能直接替代该条表述。\n“坚持走合作发展道路”：本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走合作发展道路”。\n“坚持走均衡发展道路”：本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走均衡发展道路”。\n“坚持走协调发展道路”：本题应为“坚持走和平发展道路”，此项将其替换成了“坚持走协调发展道路”。","material":{"bookPage":326,"pdfPage":337,"kind":"教材内容改编","text":"教材强调，我国开展对外交往、寻求合作，同时坚决维护正当权益，不拿核心利益做交易；维护国家利益与反对霸权、开展国际合作相统一。"}},{"id":"F112-B","chapter":16,"topic":60,"label":"中国特色大国外交的主线与原则","knowledge":["F112 ","knowledge":["L001-3","L001-4","L001-1"],"paragraphs":[9],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“思想创立的时代背景”，下列选项与原文表述相符的有（多选）。","options":["中华民族伟大复兴进入关键时期","科学社会主义在二十一世纪中国焕发新生机","中国共产党自我革命开辟新境界","中国共产党社会革命取代自我革命"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"中国共产党社会革命取代自我革命","reason":"原文是自我革命开辟新境界，两种革命不能替换。"}],"explanation":"本组完整内容：中华民族伟大复兴进入关键时期；世界百年未有之大变局加速演进；中国共产党自我革命开辟新境界；科学社会主义在二十一世纪中国焕发新生机。\n易混辨析：\n“中国共产党社会革命取代自我革命”：原文是自我革命开辟新境界，两种革命不能替换。"},{"id":"L002-M1","chapter":0,"topic":1,"label":"两个结合","knowledge":["L002-1","L002-2"],"paragraphs":[10,274,312],"source":"document","web":null,"type":"multi","stem":"结合材料，下列哪些选项准确表述了理论创新中的“两个结合”？（多选）","options":["马克思主义基本原理同中国具体实际相结合","马克思主义基本原理同中国具体历史相结合","马克思主义基本原理同中华全部传统文化相结合","马克思主义基本原理同中华优秀传统文化相结合"],"answer":[0,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"马克思主义基本原理同中国具体历史相结合","reason":"第一个结合的对象是中国具体实际，不能缩减为具体历史。"},{"text":"马克思主义基本原理同中华全部传统文化相结合","reason":"第二个结合强调中华优秀传统文化，不能删去“优秀”的限定。"}],"explanation":"材料分析：中国具体实际与中华优秀传统文化是两个不同结合对象，“优秀”是选择和转化传统文化时不能删去的限定。\n教材依据：《习近平新时代中国特色社会主义思想概论》第5页（所提供PDF第16页）。\n本组完整内容：马克思主义基本原理同中国具体实际相结合；马克思主义基本原理同中华优秀传统文化相结合。\n易混辨析：\n“马克思主义基本原理同中国具体历史相结合”：第一个结合的对象是中国具体实际，不能缩减为具体历史。\n“马克思主义基本原理同中华全部传统文化相结合”：第二个结合强调中华优秀传统文化，不能删去“优秀”的限定。","material":{"bookPage":5,"pdfPage":16,"kind":"教材内容改编","text":"某研究小组反对照搬现成结论，主张用理论研究中国现实，又从传统思想中筛选有益资源，但不把所有旧观念都原样继承。"}},{"id":"L003-M1","chapter":0,"topic":2,"label":"习近平新时代中国特色社会主义思想回答的重大时代课题","knowledge":["L003-1","L003-2","L003-3"],"paragraphs":[12],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“习近平新时代中国特色社会主义思想回答的重大时代课题”，下列选项与原文表述相符的有（多选）。","options":["建设什么样的社会主义现代化大国、怎样建设社会主义现代化大国","新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义","建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国","建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"建设什么样的社会主义现代化大国、怎样建设社会主义现代化大国","reason":"教材概括的时代课题是现代化强国，“大国”不能替换“强国”。"}],"explanation":"本组完整内容：新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。\n易混辨析：\n“建设什么样的社会主义现代化大国、怎样建设社会主义现代化大国”：教材概括的时代课题是现代化强国，“大国”不能替换“强国”。"},{"id":"L004-M1","chapter":0,"topic":3,"label":"习近平新时代中国特色社会主义思想的科学体系组成概括","knowledge":["L004-1","L004-2"],"paragraphs":[15],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“习近平新时代中国特色社会主义思想的科学体系组成概括”，下列选项与原文表述相符的有（多选）。","options":["十个明确","十四个坚持","十一个明确","十三个坚持"],"answer":[0,1],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"十一个明确","reason":"这是强军思想的内容概括，不能替换科学体系概括中的“十个明确”。"},{"text":"十三个坚持","reason":"这是党的建设重要思想的概括，不能替换基本方略“十四个坚持”。"}],"explanation":"本组完整内容：十个明确；十四个坚持；十三个方面成就；六个必须坚持。\n易混辨析：\n“十一个明确”：这是强军思想的内容概括，不能替换科学体系概括中的“十个明确”。\n“十三个坚持”：这是党的建设重要思想的概括，不能替换基本方略“十四个坚持”。"},{"id":"L004-M2","chapter":0,"topic":3,"label":"习近平新时代中国特色社会主义思想的科学体系组成概括","knowledge":["L004-3","L004-4","L004-1"],"paragraphs":[15],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“习近平新时代中国特色社会主义思想的科学体系组成概括”，下列选项与原文表述相符的有（多选）。","options":["十四个方面成就","十三个方面成就","六个必须坚持","十个明确"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"十四个方面成就","reason":"成就概括是十三个方面，不是十四个方面。"}],"explanation":"本组完整内容：十个明确；十四个坚持；十三个方面成就；六个必须坚持。\n易混辨析：\n“十四个方面成就”：成就概括是十三个方面，不是十四个方面。"},{"id":"L005-M1","chapter":0,"topic":4,"label":"六个必须坚持","knowledge":["L005-1","L005-2","L005-3"],"paragraphs":[17,315],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“六个必须坚持”，下列选项与原文表述相符的有（多选）。","options":["自信自立","自信自强","守正创新","人民至上"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"自信自强","reason":"六个必须坚持的对应成员是自信自立，注意“自立”不能换成“自强”。"}],"explanation":"本组完整内容：人民至上；自信自立；守正创新；问题导向；系统观念；胸怀天下。\n易混辨析：\n“自信自强”：六个必须坚持的对应成员是自信自立，注意“自立”不能换成“自强”。"},{"id":"L005-M2","chapter":0,"topic":4,"label":"六个必须坚持","knowledge":["L005-4","L005-5","L005-6","L005-1"],"paragraphs":[17,315],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“六个必须坚持”，下列选项与原文表述相符的有（多选）。","options":["问题导向","系统观念","胸怀天下","人民至上"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：人民至上；自信自立；守正创新；问题导向；系统观念；胸怀天下。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L006-M1","chapter":0,"topic":5,"label":"习近平新时代中国特色社会主义思想的历史地位","knowledge":["L006-1","L006-2","L006-3"],"paragraphs":[22],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“习近平新时代中国特色社会主义思想的历史地位”，下列选项与原文表述相符的有（多选）。","options":["当代中国马克思主义、二十一世纪马克思主义","当代中国马克思主义、二十世纪马克思主义","实现了马克思主义中国化时代化新的飞跃","中华文化和中国精神的时代精华"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"当代中国马克思主义、二十世纪马克思主义","reason":"对应时代是二十一世纪，不能提前为二十世纪。"}],"explanation":"本组完整内容：当代中国马克思主义、二十一世纪马克思主义；中华文化和中国精神的时代精华；实现了马克思主义中国化时代化新的飞跃。\n易混辨析：\n“当代中国马克思主义、二十世纪马克思主义”：对应时代是二十一世纪，不能提前为二十世纪。"},{"id":"L007-M1","chapter":0,"topic":6,"label":"两个确立","knowledge":["L007-1","L007-2"],"paragraphs":[24,313],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“两个确立”，下列选项与原文表述相符的有（多选）。","options":["确立习近平新时代中国特色社会主义思想的指导地位","确立习近平新时代中国特色社会主义思想的基本方略地位","确立习近平同志党中央的核心、全党的核心地位","确立习近平同志中央政治局的核心、全党的核心地位"],"answer":[0,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"确立习近平同志中央政治局的核心、全党的核心地位","reason":"原文是党中央的核心、全党的核心，不能缩减为中央政治局的核心。"},{"text":"确立习近平新时代中国特色社会主义思想的基本方略地位","reason":"原文是指导地位，“基本方略”与“指导地位”不同。"}],"explanation":"本组完整内容：确立习近平同志党中央的核心、全党的核心地位；确立习近平新时代中国特色社会主义思想的指导地位。\n易混辨析：\n“确立习近平同志中央政治局的核心、全党的核心地位”：原文是党中央的核心、全党的核心，不能缩减为中央政治局的核心。\n“确立习近平新时代中国特色社会主义思想的基本方略地位”：原文是指导地位，“基本方略”与“指导地位”不同。"},{"id":"L008-M1","chapter":1,"topic":7,"label":"当代中国伟大社会变革的正确认识","knowledge":["L008-1","L008-2","L008-3"],"paragraphs":[30],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“当代中国伟大社会变革的正确认识”，下列选项与原文表述相符的有（多选）。","options":["不是其他国家社会主义实践的再版","不是简单套用马克思主义经典作家设想的模板","不是简单延续我国历史文化的母版","是对我国历史文化母版的简单延续"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"是对我国历史文化母版的简单延续","reason":"原文否定简单延续，删去否定词改变了含义。"}],"explanation":"本组完整内容：不是简单延续我国历史文化的母版；不是简单套用马克思主义经典作家设想的模板；不是其他国家社会主义实践的再版；不是国外现代化发展的翻版；社会主义没有定于一尊、一成不变的套路。\n易混辨析：\n“是对我国历史文化母版的简单延续”：原文否定简单延续，删去否定词改变了含义。"},{"id":"L008-M2","chapter":1,"topic":7,"label":"当代中国伟大社会变革的正确认识","knowledge":["L008-4","L008-5","L008-1","L008-2"],"paragraphs":[30],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“当代中国伟大社会变革的正确认识”，下列选项与原文表述相符的有（多选）。","options":["社会主义没有定于一尊、一成不变的套路","不是简单套用马克思主义经典作家设想的模板","不是国外现代化发展的翻版","不是简单延续我国历史文化的母版"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：不是简单延续我国历史文化的母版；不是简单套用马克思主义经典作家设想的模板；不是其他国家社会主义实践的再版；不是国外现代化发展的翻版；社会主义没有定于一尊、一成不变的套路。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L009-M1","chapter":1,"topic":8,"label":"四个自信","knowledge":["L009-1","L009-2","L009-3","L009-4"],"paragraphs":[32,267,314],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“四个自信”，下列选项与原文表述相符的有（多选）。","options":["制度自信","文化自信","理论自信","道路自信"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：道路自信；理论自信；制度自信；文化自信。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L009-M2","chapter":1,"topic":8,"label":"四个自信","knowledge":["L009-1","L009-2"],"paragraphs":[32,267,314],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“四个自信”，下列选项与原文表述相符的有（多选）。","options":["道路自信","道路自觉","理论自信","制度自立"],"answer":[0,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"道路自觉","reason":"四个自信中的对应成员是道路自信，“自觉”不能替代“自信”。"},{"text":"制度自立","reason":"对应成员是制度自信，注意自信与自立的区别。"}],"explanation":"本组完整内容：道路自信；理论自信；制度自信；文化自信。\n易混辨析：\n“道路自觉”：四个自信中的对应成员是道路自信，“自觉”不能替代“自信”。\n“制度自立”：对应成员是制度自信，注意自信与自立的区别。"},{"id":"L010-M1","chapter":1,"topic":9,"label":"中国特色社会主义进入新时代的意义","knowledge":["L010-1","L010-2","L010-3"],"paragraphs":[36],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国特色社会主义进入新时代的意义”，下列选项与原文表述相符的有（多选）。","options":["中华民族迎来从站起来、富起来到强起来的伟大飞跃","中国特色社会主义道路、理论、制度、文化不断发展，为其他国家和民族现代化提供全新选择并贡献中国智慧和中国方案","我国已经跨越社会主义初级阶段","科学社会主义在二十一世纪的中国焕发强大生机活力"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"我国已经跨越社会主义初级阶段","reason":"进入新时代没有改变社会主义初级阶段基本国情。"}],"explanation":"本组完整内容：中华民族迎来从站起来、富起来到强起来的伟大飞跃；科学社会主义在二十一世纪的中国焕发强大生机活力；中国特色社会主义道路、理论、制度、文化不断发展，为其他国家和民族现代化提供全新选择并贡献中国智慧和中国方案。\n易混辨析：\n“我国已经跨越社会主义初级阶段”：进入新时代没有改变社会主义初级阶段基本国情。"},{"id":"L011-M1","chapter":1,"topic":11,"label":"五位一体总体布局","knowledge":["L011-1","L011-2","L011-3"],"paragraphs":[43],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“五位一体总体布局”，下列选项与原文表述相符的有（多选）。","options":["政治建设","经济建设","党的建设","文化建设"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"党的建设","reason":"党的建设不能替换五位一体中的社会建设，注意总体布局和党的建设的范围区别。"}],"explanation":"本组完整内容：经济建设；政治建设；文化建设；社会建设；生态文明建设。\n易混辨析：\n“党的建设”：党的建设不能替换五位一体中的社会建设，注意总体布局和党的建设的范围区别。"},{"id":"L011-M2","chapter":1,"topic":11,"label":"五位一体总体布局","knowledge":["L011-4","L011-5","L011-1","L011-2"],"paragraphs":[43],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“五位一体总体布局”，下列选项与原文表述相符的有（多选）。","options":["社会建设","经济建设","政治建设","生态文明建设"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：经济建设；政治建设；文化建设；社会建设；生态文明建设。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L012-M1","chapter":1,"topic":11,"label":"四个全面战略布局","knowledge":["L012-1","L012-2","L012-3","L012-4"],"paragraphs":[44],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“四个全面战略布局”，下列选项与原文表述相符的有（多选）。","options":["全面建设社会主义现代化国家","全面深化改革","全面依法治国","全面从严治党"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：全面建设社会主义现代化国家；全面深化改革；全面依法治国；全面从严治党。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L012-M2","chapter":1,"topic":11,"label":"四个全面战略布局","knowledge":["L012-1","L012-2"],"paragraphs":[44],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“四个全面战略布局”，下列选项与原文表述相符的有（多选）。","options":["全面深化改革","全面建设社会主义现代化国家","全面以德治国","全面建成社会主义现代化国家"],"answer":[0,1],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"全面建成社会主义现代化国家","reason":"现行四个全面的首项是全面建设社会主义现代化国家，区分建设与建成。"},{"text":"全面以德治国","reason":"对应成员是全面依法治国，法治与德治不能在此替换。"}],"explanation":"本组完整内容：全面建设社会主义现代化国家；全面深化改革；全面依法治国；全面从严治党。\n易混辨析：\n“全面建成社会主义现代化国家”：现行四个全面的首项是全面建设社会主义现代化国家，区分建设与建成。\n“全面以德治国”：对应成员是全面依法治国，法治与德治不能在此替换。"},{"id":"L013-M1","chapter":2,"topic":12,"label":"新时代新征程党的中心任务的表述","knowledge":["L013-1","L013-2","L013-3"],"paragraphs":[48],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“新时代新征程党的中心任务的表述”，下列选项与原文表述相符的有（多选）。","options":["实现第二个百年奋斗目标","以中国式现代化全面推进中华民族伟大复兴","实现第一个百年奋斗目标","团结带领全国各族人民全面建成社会主义现代化强国"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"实现第一个百年奋斗目标","reason":"新时代新征程中心任务对应第二个百年奋斗目标，不能混淆已经完成的第一个目标。"}],"explanation":"本组完整内容：团结带领全国各族人民全面建成社会主义现代化强国；实现第二个百年奋斗目标；以中国式现代化全面推进中华民族伟大复兴。\n易混辨析：\n“实现第一个百年奋斗目标”：新时代新征程中心任务对应第二个百年奋斗目标，不能混淆已经完成的第一个目标。"},{"id":"L014-M1","chapter":2,"topic":12,"label":"中国梦的本质","knowledge":["L014-1","L014-2","L014-3"],"paragraphs":[50],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国梦的本质”，下列选项与原文表述相符的有（多选）。","options":["人民幸福","民族富强","国家富强","民族振兴"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"民族富强","reason":"中国梦本质的固定对应是国家富强、民族振兴、人民幸福，此项错配了对象和状态。"}],"explanation":"本组完整内容：国家富强；民族振兴；人民幸福。\n易混辨析：\n“民族富强”：中国梦本质的固定对应是国家富强、民族振兴、人民幸福，此项错配了对象和状态。"},{"id":"L015-M1","chapter":2,"topic":13,"label":"中国式现代化的五个中国特色","knowledge":["L015-1","L015-2","L015-3","L015-4"],"paragraphs":[52,317],"source":"document","web":null,"type":"multi","stem":"结合材料，下列哪些选项属于中国式现代化的中国特色？（多选）","options":["人与自然和谐共生的现代化","人口规模巨大的现代化","全体人民共同富裕的现代化","物质文明和精神文明相协调的现代化"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"材料分析：材料分别提示人口规模、共同富裕、两种文明相协调；共同不等于同步，相协调不等于所有环节同步。\n教材依据：《习近平新时代中国特色社会主义思想概论》第45页（所提供PDF第56页）。\n本组完整内容：人口规模巨大的现代化；全体人民共同富裕的现代化；物质文明和精神文明相协调的现代化；人与自然和谐共生的现代化；走和平发展道路的现代化。\n本题四个选项均与原文表述相符，应全部选中。","material":{"bookPage":45,"pdfPage":56,"kind":"教材内容改编","text":"教材指出，我国推进现代化既有超大规模人口这一条件，又要在增进人民福祉中防止两极分化，并重视物质生活改善与精神生活充实。"}},{"id":"L015-M2","chapter":2,"topic":13,"label":"中国式现代化的五个中国特色","knowledge":["L015-5","L015-1"],"paragraphs":[52,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国式现代化的五个中国特色”，下列选项与原文表述相符的有（多选）。","options":["全体人民同步富裕的现代化","物质文明和精神文明相同步的现代化","走和平发展道路的现代化","人口规模巨大的现代化"],"answer":[2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"全体人民同步富裕的现代化","reason":"共同富裕不等于同步富裕，不能把“共同”改成“同步”。"},{"text":"物质文明和精神文明相同步的现代化","reason":"原文是相协调，相协调不要求二者在每一步都同步。"}],"explanation":"本组完整内容：人口规模巨大的现代化；全体人民共同富裕的现代化；物质文明和精神文明相协调的现代化；人与自然和谐共生的现代化；走和平发展道路的现代化。\n易混辨析：\n“全体人民同步富裕的现代化”：共同富裕不等于同步富裕，不能把“共同”改成“同步”。\n“物质文明和精神文明相同步的现代化”：原文是相协调，相协调不要求二者在每一步都同步。"},{"id":"L016-M1","chapter":2,"topic":14,"label":"中国式现代化的本质要求","knowledge":["L016-1","L016-2"],"paragraphs":[54,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国式现代化的本质要求”，下列选项与原文表述相符的有（多选）。","options":["坚持中国共产党领导","实现高速度发展","坚持中国特色社会主义","实现全体人民平均富裕"],"answer":[0,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"实现高速度发展","reason":"本质要求是高质量发展，不能把质量换成速度。"},{"text":"实现全体人民平均富裕","reason":"共同富裕不等于平均主义，不能把共同改为平均。"}],"explanation":"本组完整内容：坚持中国共产党领导；坚持中国特色社会主义；实现高质量发展；发展全过程人民民主；丰富人民精神世界；实现全体人民共同富裕；促进人与自然和谐共生；推动构建人类命运共同体；创造人类文明新形态。\n易混辨析：\n“实现高速度发展”：本质要求是高质量发展，不能把质量换成速度。\n“实现全体人民平均富裕”：共同富裕不等于平均主义，不能把共同改为平均。"},{"id":"L016-M2","chapter":2,"topic":14,"label":"中国式现代化的本质要求","knowledge":["L016-3","L016-4","L016-5"],"paragraphs":[54,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国式现代化的本质要求”，下列选项与原文表述相符的有（多选）。","options":["发展全过程选举民主","实现高质量发展","发展全过程人民民主","丰富人民精神世界"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"发展全过程选举民主","reason":"原文是全过程人民民主，不能将人民民主缩减为选举民主。"}],"explanation":"本组完整内容：坚持中国共产党领导；坚持中国特色社会主义；实现高质量发展；发展全过程人民民主；丰富人民精神世界；实现全体人民共同富裕；促进人与自然和谐共生；推动构建人类命运共同体；创造人类文明新形态。\n易混辨析：\n“发展全过程选举民主”：原文是全过程人民民主，不能将人民民主缩减为选举民主。"},{"id":"L016-M3","chapter":2,"topic":14,"label":"中国式现代化的本质要求","knowledge":["L016-6","L016-7","L016-8","L016-9"],"paragraphs":[54,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“中国式现代化的本质要求”，下列选项与原文表述相符的有（多选）。","options":["推动构建人类命运共同体","创造人类文明新形态","实现全体人民共同富裕","促进人与自然和谐共生"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：坚持中国共产党领导；坚持中国特色社会主义；实现高质量发展；发展全过程人民民主；丰富人民精神世界；实现全体人民共同富裕；促进人与自然和谐共生；推动构建人类命运共同体；创造人类文明新形态。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L017-M1","chapter":2,"topic":15,"label":"推进中国式现代化的重大原则","knowledge":["L017-1","L017-2","L017-3"],"paragraphs":[56,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“推进中国式现代化的重大原则”，下列选项与原文表述相符的有（多选）。","options":["坚持以人民为中心的发展思想","坚持和加强党的局部领导","坚持中国特色社会主义道路","坚持和加强党的全面领导"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"坚持和加强党的局部领导","reason":"重大原则是坚持和加强党的全面领导，不能以局部替代全面。"}],"explanation":"本组完整内容：坚持和加强党的全面领导；坚持中国特色社会主义道路；坚持以人民为中心的发展思想；坚持深化改革开放；坚持发扬斗争精神。\n易混辨析：\n“坚持和加强党的局部领导”：重大原则是坚持和加强党的全面领导，不能以局部替代全面。"},{"id":"L017-M2","chapter":2,"topic":15,"label":"推进中国式现代化的重大原则","knowledge":["L017-4","L017-5","L017-1","L017-2"],"paragraphs":[56,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“推进中国式现代化的重大原则”，下列选项与原文表述相符的有（多选）。","options":["坚持深化改革开放","坚持和加强党的全面领导","坚持发扬斗争精神","坚持中国特色社会主义道路"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：坚持和加强党的全面领导；坚持中国特色社会主义道路；坚持以人民为中心的发展思想；坚持深化改革开放；坚持发扬斗争精神。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L018-M1","chapter":2,"topic":16,"label":"推进中国式现代化需要正确处理的重大关系","knowledge":["L018-1","L018-2","L018-3","L018-4"],"paragraphs":[58,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“推进中国式现代化需要正确处理的重大关系”，下列选项与原文表述相符的有（多选）。","options":["顶层设计与实践探索","效率与公平","守正与创新","战略与策略"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：顶层设计与实践探索；战略与策略；守正与创新；效率与公平；活力与秩序；自立自强与对外开放。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L018-M2","chapter":2,"topic":16,"label":"推进中国式现代化需要正确处理的重大关系","knowledge":["L018-5","L018-6"],"paragraphs":[58,317],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“推进中国式现代化需要正确处理的重大关系”，下列选项与原文表述相符的有（多选）。","options":["自立自强与对外开放","自立自强与自我封闭","顶层设计与理论推演","活力与秩序"],"answer":[0,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"顶层设计与理论推演","reason":"原文成对列举的是顶层设计与实践探索，不能将实践探索换为理论推演。"},{"text":"自立自强与自我封闭","reason":"原文成对列举的是自立自强与对外开放，自立自强不等于自我封闭。"}],"explanation":"本组完整内容：顶层设计与实践探索；战略与策略；守正与创新；效率与公平；活力与秩序；自立自强与对外开放。\n易混辨析：\n“顶层设计与理论推演”：原文成对列举的是顶层设计与实践探索，不能将实践探索换为理论推演。\n“自立自强与自我封闭”：原文成对列举的是自立自强与对外开放，自立自强不等于自我封闭。"},{"id":"L019-M1","chapter":3,"topic":18,"label":"党的领导的基本属性","knowledge":["L019-1","L019-2","L019-3"],"paragraphs":[67],"source":"document","web":null,"type":"multi","stem":"材料所体现的党的领导，具有下列哪些基本属性？（多选）","options":["系统的","全面的","局部的","整体的"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"局部的","reason":"党的领导是全面的，不能缩减为局部的。"}],"explanation":"材料分析：全过程和各领域体现全面性，各层级与各方面协同体现系统性、整体性，不能缩减为局部或分散领导。\n教材依据：《习近平新时代中国特色社会主义思想概论》第62页（所提供PDF第73页）。\n本组完整内容：全面的；系统的；整体的。\n易混辨析：\n“局部的”：党的领导是全面的，不能缩减为局部的。","material":{"bookPage":62,"pdfPage":73,"kind":"教材内容改编","text":"教材总结重大任务中的组织经验：中央统筹、地方负责、基层落实，各领域相互配合，党把各方面力量汇聚起来，领导作用贯穿任务全过程。"}},{"id":"L020-M1","chapter":4,"topic":21,"label":"坚持人民立场必须解决的问题","knowledge":["L020-1","L020-2","L020-3"],"paragraphs":[80],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“坚持人民立场必须解决的问题”，下列选项与原文表述相符的有（多选）。","options":["由谁来评价","依靠谁","为了谁","服从哪级"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"服从哪级","reason":"本稿列举的三个根本问题是为了谁、依靠谁、由谁来评价，不是上下级服从关系。"}],"explanation":"本组完整内容：为了谁；依靠谁；由谁来评价。\n易混辨析：\n“服从哪级”：本稿列举的三个根本问题是为了谁、依靠谁、由谁来评价，不是上下级服从关系。"},{"id":"L021-M1","chapter":4,"topic":24,"label":"群众路线的基本内容","knowledge":["L021-1","L021-2","L021-3","L021-4"],"paragraphs":[89,261],"source":"document","web":null,"type":"multi","stem":"结合材料，下列哪些选项符合群众路线的基本内容？（多选）","options":["一切依靠群众","从群众中来，到群众中去","把党的正确主张变为群众的自觉行动","一切为了群众"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"材料分析：不能把意见收集当成终点，还要集中为正确决策、回到群众并转为行动；既不是到机关中去，也不是照单接受一切主张。\n教材依据：《习近平新时代中国特色社会主义思想概论》第84页（所提供PDF第95页）。\n本组完整内容：一切为了群众；一切依靠群众；从群众中来，到群众中去；把党的正确主张变为群众的自觉行动；把群众路线贯彻到治国理政全部活动之中。\n本题四个选项均与原文表述相符，应全部选中。","material":{"bookPage":84,"pdfPage":95,"kind":"教材内容改编","text":"某街道在改造公共空间时，先收集居民真实诉求，再把分散意见集中形成可行方案，随后向居民解释并组织参与施工监督，建成后继续听取反馈。"}},{"id":"L021-M2","chapter":4,"topic":24,"label":"群众路线的基本内容","knowledge":["L021-5","L021-1"],"paragraphs":[89,261],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“群众路线的基本内容”，下列选项与原文表述相符的有（多选）。","options":["从群众中来，到机关中去","一切为了群众","把群众路线贯彻到治国理政全部活动之中","把群众的全部主张变为党的决策"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"从群众中来，到机关中去","reason":"完整路线是从群众中来、到群众中去，终点不能改成机关。"},{"text":"把群众的全部主张变为党的决策","reason":"原文强调党的正确主张与群众自觉行动的结合，不是无条件接受所有主张。"}],"explanation":"本组完整内容：一切为了群众；一切依靠群众；从群众中来，到群众中去；把党的正确主张变为群众的自觉行动；把群众路线贯彻到治国理政全部活动之中。\n易混辨析：\n“从群众中来，到机关中去”：完整路线是从群众中来、到群众中去，终点不能改成机关。\n“把群众的全部主张变为党的决策”：原文强调党的正确主张与群众自觉行动的结合，不是无条件接受所有主张。"},{"id":"L022-M1","chapter":4,"topic":25,"label":"扎实推进共同富裕应坚持的原则","knowledge":["L022-1","L022-2"],"paragraphs":[92],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“扎实推进共同富裕应坚持的原则”，下列选项与原文表述相符的有（多选）。","options":["鼓励勤劳创新致富","鼓励勤劳创新同步致富","尽力而为、超前而行","坚持基本经济制度"],"answer":[0,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"鼓励勤劳创新同步致富","reason":"鼓励勤劳创新致富不等于要求同步致富。"},{"text":"尽力而为、超前而行","reason":"原文要求尽力而为、量力而行，不能超越能力。"}],"explanation":"本组完整内容：鼓励勤劳创新致富；坚持基本经济制度；尽力而为量力而行；坚持循序渐进。\n易混辨析：\n“鼓励勤劳创新同步致富”：鼓励勤劳创新致富不等于要求同步致富。\n“尽力而为、超前而行”：原文要求尽力而为、量力而行，不能超越能力。"},{"id":"L022-M2","chapter":4,"topic":25,"label":"扎实推进共同富裕应坚持的原则","knowledge":["L022-3","L022-4","L022-1"],"paragraphs":[92],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“扎实推进共同富裕应坚持的原则”，下列选项与原文表述相符的有（多选）。","options":["坚持循序渐进","鼓励勤劳创新致富","坚持同步推进","尽力而为量力而行"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"坚持同步推进","reason":"原文是循序渐进，不是要求所有人同步推进。"}],"explanation":"本组完整内容：鼓励勤劳创新致富；坚持基本经济制度；尽力而为量力而行；坚持循序渐进。\n易混辨析：\n“坚持同步推进”：原文是循序渐进，不是要求所有人同步推进。"},{"id":"L023-M1","chapter":5,"topic":28,"label":"全面深化改革应坚持的正确方向","knowledge":["L023-1","L023-2","L023-3"],"paragraphs":[103],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“全面深化改革应坚持的正确方向”，下列选项与原文表述相符的有（多选）。","options":["该改的坚决不改，不该改的坚决改","不走封闭僵化的老路","不走改旗易帜的邪路","该改的、能改的坚决改"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"该改的坚决不改，不该改的坚决改","reason":"原文明确该改的坚决改、不该改的坚决不改，此项颠倒了判断。"}],"explanation":"本组完整内容：不走封闭僵化的老路；不走改旗易帜的邪路；该改的、能改的坚决改；不该改的、不能改的坚决不改。\n易混辨析：\n“该改的坚决不改，不该改的坚决改”：原文明确该改的坚决改、不该改的坚决不改，此项颠倒了判断。"},{"id":"L023-M2","chapter":5,"topic":28,"label":"全面深化改革应坚持的正确方向","knowledge":["L023-4","L023-1","L023-2","L023-3"],"paragraphs":[103],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“全面深化改革应坚持的正确方向”，下列选项与原文表述相符的有（多选）。","options":["不该改的、不能改的坚决不改","不走改旗易帜的邪路","该改的、能改的坚决改","不走封闭僵化的老路"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"本组完整内容：不走封闭僵化的老路；不走改旗易帜的邪路；该改的、能改的坚决改；不该改的、不能改的坚决不改。\n本题四个选项均与原文表述相符，应全部选中。"},{"id":"L024-M1","chapter":6,"topic":29,"label":"新发展理念","knowledge":["L024-1","L024-2","L024-3","L024-4"],"paragraphs":[111],"source":"document","web":null,"type":"multi","stem":"下列哪些选项属于指导这类发展转变的新发展理念？（多选）","options":["创新","协调","绿色","开放"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"材料分析：材料提示创新、协调、绿色等理念；题目仍考查新发展理念的准确成员，不能把开放写成开发、共享写成共建。\n教材依据：《习近平新时代中国特色社会主义思想概论》第114页（所提供PDF第125页）。\n本组完整内容：创新；协调；绿色；开放；共享。\n本题四个选项均与原文表述相符，应全部选中。","material":{"bookPage":114,"pdfPage":125,"kind":"教材内容改编","text":"某地区推动产业升级时，既加大技术研发，又改善区域之间的协作，同时降低单位产品的资源消耗，力求改变过去单靠扩大投入的发展方式。"}},{"id":"L024-M2","chapter":6,"topic":29,"label":"新发展理念","knowledge":["L024-5","L024-1"],"paragraphs":[111],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“新发展理念”，下列选项与原文表述相符的有（多选）。","options":["开发","共享","创新","共建"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"共建","reason":"五大发展理念的对应成员是共享，共建不能替换共享。"},{"text":"开发","reason":"五大发展理念的对应成员是开放，开发不能替换开放。"}],"explanation":"本组完整内容：创新；协调；绿色；开放；共享。\n易混辨析：\n“共建”：五大发展理念的对应成员是共享，共建不能替换共享。\n“开发”：五大发展理念的对应成员是开放，开发不能替换开放。"},{"id":"L025-M1","chapter":6,"topic":30,"label":"社会主义基本经济制度","knowledge":["L025-1","L025-2","L025-3"],"paragraphs":[113],"source":"document","web":null,"type":"multi","stem":"下列哪些选项准确表述了社会主义基本经济制度的内容？（多选）","options":["按劳分配为主体、多种分配方式并存","公有制为主导、多种所有制经济共同发展","社会主义市场经济体制","公有制为主体、多种所有制经济共同发展"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"公有制为主导、多种所有制经济共同发展","reason":"基本经济制度的准确表述是公有制为主体，“主体”不能改成“主导”。"}],"explanation":"材料分析：三方面分别对应公有制为主体、多种所有制共同发展，按劳分配为主体、多种分配方式并存，以及社会主义市场经济体制。\n教材依据：《习近平新时代中国特色社会主义思想概论》第120页（所提供PDF第131页）。\n本组完整内容：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。\n易混辨析：\n“公有制为主导、多种所有制经济共同发展”：基本经济制度的准确表述是公有制为主体，“主体”不能改成“主导”。","material":{"bookPage":120,"pdfPage":131,"kind":"教材内容改编","text":"教材把社会主义基本经济制度理解为相互联系的整体：既涉及所有制结构，也涉及分配方式，还涉及资源配置的体制机制，不能只保留其中一个方面。"}},{"id":"L026-M1","chapter":6,"topic":30,"label":"两个毫不动摇","knowledge":["L026-1","L026-2"],"paragraphs":[114],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“两个毫不动摇”，下列选项与原文表述相符的有（多选）。","options":["毫不动摇巩固和发展非公有制经济","毫不动摇鼓励、支持、引导公有制经济发展","毫不动摇巩固和发展公有制经济","毫不动摇鼓励、支持、引导非公有制经济发展"],"answer":[2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"毫不动摇巩固和发展非公有制经济","reason":"巩固和发展对应公有制经济，不能与非公有制经济错配。"},{"text":"毫不动摇鼓励、支持、引导公有制经济发展","reason":"鼓励、支持、引导的特定对应是非公有制经济，注意对象与动词组合。"}],"explanation":"本组完整内容：毫不动摇巩固和发展公有制经济；毫不动摇鼓励、支持、引导非公有制经济发展。\n易混辨析：\n“毫不动摇巩固和发展非公有制经济”：巩固和发展对应公有制经济，不能与非公有制经济错配。\n“毫不动摇鼓励、支持、引导公有制经济发展”：鼓励、支持、引导的特定对应是非公有制经济，注意对象与动词组合。"},{"id":"L027-M1","chapter":6,"topic":32,"label":"对新发展格局的准确理解","knowledge":["L027-1","L027-2","L027-3"],"paragraphs":[118],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“对新发展格局的准确理解”，下列选项与原文表述相符的有（多选）。","options":["是开放的国内国际双循环","是封闭的国内单循环","是把握未来发展主动权的先手棋","以全国统一大市场基础上的国内大循环为主体"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"是封闭的国内单循环","reason":"新发展格局是开放的国内国际双循环，不能改为封闭的单循环。"}],"explanation":"本组完整内容：是把握未来发展主动权的先手棋；是开放的国内国际双循环；以全国统一大市场基础上的国内大循环为主体。\n易混辨析：\n“是封闭的国内单循环”：新发展格局是开放的国内国际双循环，不能改为封闭的单循环。"},{"id":"L028-M1","chapter":6,"topic":33,"label":"乡村振兴的总要求","knowledge":["L028-1","L028-2"],"paragraphs":[121],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“乡村振兴的总要求”，下列选项与原文表述相符的有（多选）。","options":["产业富裕","生态宜居","产业兴旺","生活兴旺"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"产业富裕","reason":"总要求的对应是产业兴旺，不能与生活富裕错配。"},{"text":"生活兴旺","reason":"总要求的对应是生活富裕，不能与产业兴旺错配。"}],"explanation":"本组完整内容：产业兴旺；生态宜居；乡风文明；治理有效；生活富裕。\n易混辨析：\n“产业富裕”：总要求的对应是产业兴旺，不能与生活富裕错配。\n“生活兴旺”：总要求的对应是生活富裕，不能与产业兴旺错配。"},{"id":"L028-M2","chapter":6,"topic":33,"label":"乡村振兴的总要求","knowledge":["L028-3","L028-4","L028-5"],"paragraphs":[121],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“乡村振兴的总要求”，下列选项与原文表述相符的有（多选）。","options":["治理有效","治理文明","乡风文明","生活富裕"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"治理文明","reason":"总要求的对应是治理有效，文明对应乡风。"}],"explanation":"本组完整内容：产业兴旺；生态宜居；乡风文明；治理有效；生活富裕。\n易混辨析：\n“治理文明”：总要求的对应是治理有效，文明对应乡风。"},{"id":"L029-M1","chapter":7,"topic":34,"label":"全面建设社会主义现代化国家的基础性、战略性支撑","knowledge":["L029-1","L029-2","L029-3"],"paragraphs":[125],"source":"document","web":null,"type":"multi","stem":"材料所涉及的、全面建设社会主义现代化国家的基础性战略性支撑有哪些？（多选）","options":["人才","资本","科技","教育"],"answer":[0,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"资本","reason":"本题列举的三项基础性战略性支撑是教育、科技、人才，资本不能替代其中一项。"}],"explanation":"材料分析：学校育人、技术攻关、人才集聚分别指向教育、科技、人才，不能套用一般生产要素分类。\n教材依据：《习近平新时代中国特色社会主义思想概论》第139页（所提供PDF第150页）。\n本组完整内容：教育；科技；人才。\n易混辨析：\n“资本”：本题列举的三项基础性战略性支撑是教育、科技、人才，资本不能替代其中一项。","material":{"bookPage":139,"pdfPage":150,"kind":"教材内容改编","text":"某地规划现代化建设时，把人才培养、关键技术攻关和优秀人才集聚统筹部署，强调三者相互支持，避免学校、科研和人才政策各自孤立推进。"}},{"id":"L030-M1","chapter":7,"topic":35,"label":"教育的根本问题","knowledge":["L030-1","L030-2","L030-3"],"paragraphs":[129],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“教育的根本问题”，下列选项与原文表述相符的有（多选）。","options":["培养什么人","为谁培养人","在哪里培养人","怎样培养人"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"在哪里培养人","reason":"教育根本问题的三个对应是培养什么人、怎样培养人、为谁培养人，不是教育地点。"}],"explanation":"本组完整内容：培养什么人；怎样培养人；为谁培养人。\n易混辨析：\n“在哪里培养人”：教育根本问题的三个对应是培养什么人、怎样培养人、为谁培养人，不是教育地点。"},{"id":"L031-M1","chapter":8,"topic":37,"label":"中国特色社会主义政治发展道路必须坚持的有机统一","knowledge":["L031-1","L031-2","L031-3"],"paragraphs":[136],"source":"document","web":null,"type":"multi","stem":"材料体现中国特色社会主义政治发展道路必须坚持哪几方面有机统一？（多选）","options":["人民当家作主","党的领导","人民代表作主","依法治国"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人民代表作主","reason":"本质对应是人民当家作主，不能将主体缩减为人民代表。"}],"explanation":"材料分析：政治方向、群众主体地位、法治轨道分别对应党的领导、人民当家作主、依法治国，三者有机统一。\n教材依据：《习近平新时代中国特色社会主义思想概论》第164页（所提供PDF第175页）。\n本组完整内容：党的领导；人民当家作主；依法治国。\n易混辨析：\n“人民代表作主”：本质对应是人民当家作主，不能将主体缩减为人民代表。","material":{"bookPage":164,"pdfPage":175,"kind":"教材内容改编","text":"某地推进公共事务治理，既把握正确政治方向，又保障群众依法参与讨论和监督，并将各项决定及其执行纳入法治轨道，避免把三者割裂。"}},{"id":"L032-M1","chapter":8,"topic":38,"label":"全过程人民民主的鲜明优势","knowledge":["L032-1","L032-2","L032-3"],"paragraphs":[139],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“全过程人民民主的鲜明优势”，下列选项与原文表述相符的有（多选）。","options":["最广泛","最真实","最管用","最直接"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"最直接","reason":"三个鲜明优势是最广泛、最真实、最管用，不是把一切民主形式都等同于直接民主。"}],"explanation":"本组完整内容：最广泛；最真实；最管用。\n易混辨析：\n“最直接”：三个鲜明优势是最广泛、最真实、最管用，不是把一切民主形式都等同于直接民主。"},{"id":"L033-M1","chapter":8,"topic":39,"label":"人民代表大会制度的优势","knowledge":["L033-1","L033-2","L033-3","L033-4"],"paragraphs":[142],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“人民代表大会制度的优势”，下列选项与原文表述相符的有（多选）。","options":["体现社会主义国家性质","保障人民当家作主","保障实现中华民族伟大复兴","符合国情和实际"],"answer":[0,1,2,3],"choiceRevision": ext":"以党内监督替代人民监督","reason":"原文要求把自我监督与人民监督结合起来，不是相互替代。"},{"text":"以社会革命引领党的自我革命","reason":"原文为以伟大自我革命引领伟大社会革命，方向不能颠倒。"}],"explanation":"本组完整内容：健全党和国家监督体系；主动接受人民监督；规范权力运行；使权力在阳光下运行；以伟大自我革命引领伟大社会革命。\n易混辨析：\n“以党内监督替代人民监督”：原文要求把自我监督与人民监督结合起来，不是相互替代。\n“以社会革命引领党的自我革命”：原文为以伟大自我革命引领伟大社会革命，方向不能颠倒。"},{"id":"L064-M1","chapter":17,"topic":66,"label":"党的建设重要思想的十三个坚持","knowledge":["L064-1","L064-2"],"paragraphs":[294,295,296,297,298,299,300,301,302,303,304,305,306],"source":"document","web":null,"type":"multi","stem":"结合材料，下列哪些选项属于党的建设重要思想“十三个坚持”的准确表述？（多选）","options":["坚持和加强党的全面领导","坚持以党的自我革命引领社会革命","坚持以党的社会革命引领自我革命","坚持以党的思想建设统领党的建设各项工作"],"answer":[0,1],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"坚持以党的社会革命引领自我革命","reason":"原文方向为以党的自我革命引领社会革命。"},{"text":"坚持以党的思想建设统领党的建设各项工作","reason":"统领作用对应政治建设；思想建设是基础性建设。"}],"explanation":"材料分析：政治建设统领各项建设，自我革命引领社会革命；把政治换成思想、把引领方向颠倒，都会改变原意。\n教材依据：《习近平新时代中国特色社会主义思想概论》第345页（所提供PDF第356页）。\n本组完整内容：坚持和加强党的全面领导；坚持以党的自我革命引领社会革命；坚持以党的政治建设统领党的建设各项工作；坚持江山就是人民、人民就是江山；坚持思想建党、理论强党；坚持严密党的组织体系；坚持造就忠诚干净担当的高素质干部队伍；坚持聚天下英才而用之；坚持持之以恒正风肃纪；坚持一体推进不敢腐、不能腐、不想腐；坚持完善党和国家监督体系；坚持制度治党、依规治党；坚持落实全面从严治党政治责任。\n易混辨析：\n“坚持以党的社会革命引领自我革命”：原文方向为以党的自我革命引领社会革命。\n“坚持以党的思想建设统领党的建设各项工作”：统领作用对应政治建设；思想建设是基础性建设。","material":{"bookPage":345,"pdfPage":356,"kind":"教材内容改编","text":"教材指出，党的各项建设需要有明确的方向和统领，同时要通过解决自身问题保持先进性和纯洁性，进而推动党领导的社会事业发展，不能把两种革命的关系倒置。"}},{"id":"L064-M2","chapter":17,"topic":66,"label":"党的建设重要思想的十三个坚持","knowledge":["L064-3","L064-4","L064-5"],"paragraphs":[294,295,296,297,298,299,300,301,302,303,304,305,306],"source":"document","web":null,"type":"multi","stem":"依据背诵稿，关于“党的建设重要思想的十三个坚持”，下列选项与原文表述相符的有（多选）。","options":["坚持江山就是人民、人民就是江山","坚持以党的政治建设统领党的建设各项工作","坚持制度治党、依宪治党","坚持思想建党、理论强党"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"坚持制度治党、依宪治党","reason":"原文为制度治党、依规治党，党内法规与国家宪法的适用语境不能错配。"}],"explanation":"本组完整内容：坚持和加强党的全面领导；坚持以党的自我革命引领社会革命；坚持以党的政治建设统领党的建设各项工作；坚持江山就是人民、人民就是江山；坚持思想建党、理论强党；坚持严密党的组织体系；坚持造就忠诚干净担当的高素质干部队伍；坚持聚天下英才而
