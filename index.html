· 期末截图","paragraphs":[370],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B21","screenshots":[114],"pages":["（p246）"],"kind":"黄色重点补充"},"id":"XB21-01","knowledge":["XB21-01-K1","XB21-01-K2","XB21-01-K3"],"type":"multi","stem":"生态文明建设涉及的三类重大问题，正确的有：（多选）","options":["只涉及自然保护而与党的使命宗旨无关的问题","重大经济问题","关系党的使命宗旨的重大政治问题","关系民生福祉的重大社会问题"],"answer":[1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"只涉及自然保护而与党的使命宗旨无关的问题","reason":"截图明确生态文明建设也是关系党的使命宗旨的重大政治问题。"}],"explanation":"正确项：重大经济问题；关系党的使命宗旨的重大政治问题；关系民生福祉的重大社会问题。\n原文要点：生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题。\n逐项辨析：\n“只涉及自然保护而与党的使命宗旨无关的问题”：截图明确生态文明建设也是关系党的使命宗旨的重大政治问题。\n出处：《期末重点截图.docx》截图114，截图标注（p246）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":12,"topic":50,"label":"绿色发展与发展观的深刻革命 · 期末截图","paragraphs":[371],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B22","screenshots":[115],"pages":["（p248）"],"kind":"黄色重点补充"},"id":"XB22-01","knowledge":["XB22-01-K1"],"type":"single","stem":"绿色发展除了是新发展理念的重要内容，还是？（单选）","options":["发展观的一场深刻革命","发展观的一场渐进改良","发展方式的一次局部调整","增长观的一场局部革命"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"发展方式的一次局部调整","reason":"题目问原文对绿色发展的定位，应为发展观的一场深刻革命，不能缩为局部调整。"},{"text":"发展观的一场渐进改良","reason":"此项将深刻革命换成渐进改良，改变原句的性质和程度。"},{"text":"增长观的一场局部革命","reason":"此项将发展观、深刻分别换为增长观、局部。"}],"explanation":"正确项：发展观的一场深刻革命。\n原文要点：绿色发展是新发展理念的重要内容，是发展观的一场深刻革命。\n逐项辨析：\n“发展方式的一次局部调整”：题目问原文对绿色发展的定位，应为发展观的一场深刻革命，不能缩为局部调整。\n“发展观的一场渐进改良”：此项将深刻革命换成渐进改良，改变原句的性质和程度。\n“增长观的一场局部革命”：此项将发展观、深刻分别换为增长观、局部。\n出处：《期末重点截图.docx》截图115，截图标注（p248）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":13,"topic":53,"label":"国家安全的人民性与政治安全工作体系 · 期末截图","paragraphs":[372],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B23","screenshots":[116],"pages":["（p262）"],"kind":"黄色重点补充"},"id":"XB23-01","knowledge":["XB23-01-K1","XB23-01-K2"],"type":"multi","stem":"按照截图，总体国家安全观中的人民性要求包括：（多选）","options":["国家安全一切为了人民、一切依靠政府","把保护政治安全放在最重要的位置","国家安全一切依靠人民","国家安全一切为了人民"],"answer":[2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"国家安全一切为了人民、一切依靠政府","reason":"依靠对象应是人民，不能改为政府。"},{"text":"把保护政治安全放在最重要的位置","reason":"此处人民性表述是把保护人民安全放在最重要的位置；政治安全另有首要位置的定位。"}],"explanation":"正确项：国家安全一切为了人民；国家安全一切依靠人民。\n原文要点：坚持国家安全一切为了人民、一切依靠人民；完善政治安全工作体系。\n逐项辨析：\n“国家安全一切为了人民、一切依靠政府”：依靠对象应是人民，不能改为政府。\n“把保护政治安全放在最重要的位置”：此处人民性表述是把保护人民安全放在最重要的位置；政治安全另有首要位置的定位。\n出处：《期末重点截图.docx》截图116，截图标注（p262）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":13,"topic":53,"label":"国家安全的人民性与政治安全工作体系 · 期末截图","paragraphs":[372],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B23","screenshots":[116],"pages":["（p262）"],"kind":"黄色重点补充"},"id":"XB23-02","knowledge":["XB23-02-K1"],"type":"single","stem":"把政治安全放在首要位置，还应完善什么工作体系？（单选）","options":["政治安全工作体系","文化安全工作体系","社会安全工作体系","经济安全工作体系"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"经济安全工作体系","reason":"经济安全是基础，本题问政治安全对应的工作体系。"},{"text":"文化安全工作体系","reason":"文化安全工作不能替代政治安全工作体系。"},{"text":"社会安全工作体系","reason":"社会安全与政治安全的概念和定位不同。"}],"explanation":"正确项：政治安全工作体系。\n原文要点：坚持国家安全一切为了人民、一切依靠人民；完善政治安全工作体系。\n逐项辨析：\n“经济安全工作体系”：经济安全是基础，本题问政治安全对应的工作体系。\n“文化安全工作体系”：文化安全工作不能替代政治安全工作体系。\n“社会安全工作体系”：社会安全与政治安全的概念和定位不同。\n出处：《期末重点截图.docx》截图116，截图标注（p262）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":16,"topic":60,"label":"和平发展道路的战略依据 · 期末截图","paragraphs":[373],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"B24","screenshots":[126],"pages":["（p322）"],"kind":"黄色重点补充"},"id":"XB24-01","knowledge":["XB24-01-K1"],"type":"single","stem":"坚持走和平发展道路，是根据什么作出的战略抉择？（单选）","options":["时代发展潮流和国际共同利益","时代发展潮流和我国根本利益","时代发展潮流和我国阶段性利益","国际竞争格局和我国根本利益"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"时代发展潮流和我国阶段性利益","reason":"此项把我国根本利益替换为阶段性利益。"},{"text":"国际竞争格局和我国根本利益","reason":"此项把时代发展潮流替换为国际竞争格局，不是截图的完整战略依据。"},{"text":"时代发展潮流和国际共同利益","reason":"此项把我国根本利益替换为国际共同利益。"}],"explanation":"正确项：时代发展潮流和我国根本利益。\n原文要点：坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择。\n逐项辨析：\n“时代发展潮流和我国阶段性利益”：此项把我国根本利益替换为阶段性利益。\n“国际竞争格局和我国根本利益”：此项把时代发展潮流替换为国际竞争格局，不是截图的完整战略依据。\n“时代发展潮流和国际共同利益”：此项把我国根本利益替换为国际共同利益。\n出处：《期末重点截图.docx》截图126，截图标注（p322）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":1,"label":"两个结合的规律性与最大法宝 · 期末截图","paragraphs":[374],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U01","screenshots":[2],"pages":["（p4）"],"kind":"截图可见正文补充"},"id":"XU01-01","knowledge":["XU01-01-K1"],"type":"single","stem":"我们党探索中国特色社会主义道路得出的规律性认识、取得成功的最大法宝是？（单选）","options":["两个结合","两个维护","两个确立","两个毫不动摇"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"两个确立","reason":"两个确立强调核心地位与思想指导地位，不能替代这里的两个结合。"},{"text":"两个维护","reason":"两个维护是明确的政治要求，不是本题中的规律性认识。"},{"text":"两个毫不动摇","reason":"两个毫不动摇针对公有制与非公有制经济发展。"}],"explanation":"正确项：两个结合。\n原文要点：“两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。\n逐项辨析：\n“两个确立”：两个确立强调核心地位与思想指导地位，不能替代这里的两个结合。\n“两个维护”：两个维护是明确的政治要求，不是本题中的规律性认识。\n“两个毫不动摇”：两个毫不动摇针对公有制与非公有制经济发展。\n出处：《期末重点截图.docx》截图002，截图标注（p4）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":4,"label":"人民至上的价值立场 · 期末截图","paragraphs":[375],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U02","screenshots":[5],"pages":["（p8）"],"kind":"截图可见正文补充"},"id":"XU02-01","knowledge":["XU02-01-K1"],"type":"single","stem":"坚持人民至上体现了什么群众史观？（单选）","options":["历史唯心主义英雄史观","辩证唯物主义自然观","历史唯物主义英雄史观","历史唯物主义群众史观"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"历史唯心主义英雄史观","reason":"此项改变唯物史观和人民群众创造历史的立场。"},{"text":"辩证唯物主义自然观","reason":"题目考查群众史观，其对应历史唯物主义，不能换为自然观。"},{"text":"历史唯物主义英雄史观","reason":"此项保留历史唯物主义却将群众史观换为英雄史观，改变了原文对应。"}],"explanation":"正确项：历史唯物主义群众史观。\n原文要点：坚持人民至上是根本价值立场，体现了历史唯物主义群众史观。\n逐项辨析：\n“历史唯心主义英雄史观”：此项改变唯物史观和人民群众创造历史的立场。\n“辩证唯物主义自然观”：题目考查群众史观，其对应历史唯物主义，不能换为自然观。\n“历史唯物主义英雄史观”：此项保留历史唯物主义却将群众史观换为英雄史观，改变了原文对应。\n出处：《期末重点截图.docx》截图005，截图标注（p8）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":0,"topic":4,"label":"人民至上的价值立场 · 期末截图","paragraphs":[375],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U02","screenshots":[5],"pages":["（p8）"],"kind":"截图可见正文补充"},"id":"XU02-02","knowledge":["XU02-02-K1"],"type":"single","stem":"坚持人民至上的价值定位是？（单选）","options":["根本工作方法","基本价值原则","根本价值立场","根本政治保证"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"根本政治保证","reason":"题目问人民至上的价值定位，根本价值立场不能与政治保证互换。"},{"text":"根本工作方法","reason":"价值立场与工作方法属于不同定位，此处应是根本价值立场。"},{"text":"基本价值原则","reason":"固定表述是根本价值立场，此项改动程度词和概念。"}],"explanation":"正确项：根本价值立场。\n原文要点：坚持人民至上是根本价值立场，体现了历史唯物主义群众史观。\n逐项辨析：\n“根本政治保证”：题目问人民至上的价值定位，根本价值立场不能与政治保证互换。\n“根本工作方法”：价值立场与工作方法属于不同定位，此处应是根本价值立场。\n“基本价值原则”：固定表述是根本价值立场，此项改动程度词和概念。\n出处：《期末重点截图.docx》截图005，截图标注（p8）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":1,"topic":7,"label":"科学社会主义的新版本 · 期末截图","paragraphs":[376],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U03","screenshots":[12],"pages":["（p19）"],"kind":"截图可见正文补充"},"id":"XU03-01","knowledge":["XU03-01-K1"],"type":"single","stem":"中国特色社会主义写出了什么的“新版本”？（单选）","options":["空想社会主义","国外现代化固定模板","科学社会主义","历史文化母版"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"空想社会主义","reason":"中国特色社会主义坚持科学社会主义基本原则，不能改为空想社会主义。"},{"text":"历史文化母版","reason":"原文强调不是简单延续历史文化母版。"},{"text":"国外现代化固定模板","reason":"原文强调不是国外现代化发展的翻版。"}],"explanation":"正确项：科学社会主义。\n原文要点：中国特色社会主义写出了科学社会主义的“新版本”。\n逐项辨析：\n“空想社会主义”：中国特色社会主义坚持科学社会主义基本原则，不能改为空想社会主义。\n“历史文化母版”：原文强调不是简单延续历史文化母版。\n“国外现代化固定模板”：原文强调不是国外现代化发展的翻版。\n出处：《期末重点截图.docx》截图012，截图标注（p19）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":2,"topic":14,"label":"中国式现代化本质要求与一般规律 · 期末截图","paragraphs":[377],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U04","screenshots":[28],"pages":["（p47）"],"kind":"截图可见正文补充"},"id":"XU04-01","knowledge":["XU04-01-K1"],"type":"single","stem":"中国式现代化的本质要求符合什么规律？（单选）","options":["资本主义现代化的普遍规律","人类现代化的特殊规律","人类现代化的一般规律","中国现代化的个别规律"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人类现代化的特殊规律","reason":"此项把一般规律换为特殊规律。"},{"text":"资本主义现代化的普遍规律","reason":"此项把人类现代化一般规律限缩为资本主义现代化。"},{"text":"中国现代化的个别规律","reason":"本质要求符合人类现代化一般规律，不能限缩为个别规律。"}],"explanation":"正确项：人类现代化的一般规律。\n原文要点：中国式现代化的本质要求符合人类现代化的一般规律。\n逐项辨析：\n“人类现代化的特殊规律”：此项把一般规律换为特殊规律。\n“资本主义现代化的普遍规律”：此项把人类现代化一般规律限缩为资本主义现代化。\n“中国现代化的个别规律”：本质要求符合人类现代化一般规律，不能限缩为个别规律。\n出处：《期末重点截图.docx》截图028，截图标注（p47）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":3,"topic":19,"label":"民主集中制的可见服从要求 · 期末截图","paragraphs":[378],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U05","screenshots":[44],"pages":["（p68）"],"kind":"截图可见正文补充"},"id":"XU05-01","knowledge":["XU05-01-K1","XU05-01-K2"],"type":"multi","stem":"截图中完整显示的民主集中制服从要求，有：（多选）","options":["少数服从多数","党的组织服从党员个人","多数服从少数","党员个人服从党的组织"],"answer":[0,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"党的组织服从党员个人","reason":"此项颠倒个人与组织的服从方向。"},{"text":"多数服从少数","reason":"此项颠倒多数与少数的服从方向。"}],"explanation":"正确项：党员个人服从党的组织；少数服从多数。\n原文要点：必须坚持党员个人服从党的组织，少数服从多数。截图后续没有完整显示，本条只收录这两个完整要求。\n逐项辨析：\n“党的组织服从党员个人”：此项颠倒个人与组织的服从方向。\n“多数服从少数”：此项颠倒多数与少数的服从方向。\n出处：《期末重点截图.docx》截图044，截图标注（p68）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":4,"topic":22,"label":"政治立场的含义与人民立场的实践 · 期末截图","paragraphs":[379],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U06","screenshots":[48],"pages":["（p78）"],"kind":"截图可见正文补充"},"id":"XU06-01","knowledge":["XU06-01-K1"],"type":"single","stem":"一个政党观察、认识、处理政治问题的立足点是什么？（单选）","options":["政治立场","政治道路","政治原则","政治方向"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"政治方向","reason":"题目问观察、认识、处理政治问题的立足点，属于政治立场这一概念。"},{"text":"政治原则","reason":"政治原则不能替代政治立场的这一定义。"},{"text":"政治道路","reason":"政治道路与政治立场各有对应，此定义属于政治立场。"}],"explanation":"正确项：政治立场。\n原文要点：政治立场是一个政党观察、认识、处理政治问题的立足点，反映这个政党的世界观、方法论和执政理念，体现这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。\n逐项辨析：\n“政治方向”：题目问观察、认识、处理政治问题的立足点，属于政治立场这一概念。\n“政治原则”：政治原则不能替代政治立场的这一定义。\n“政治道路”：政治道路与政治立场各有对应，此定义属于政治立场。\n出处：《期末重点截图.docx》截图048，截图标注（p78）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":4,"topic":22,"label":"政治立场的含义与人民立场的实践 · 期末截图","paragraphs":[379],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U06","screenshots":[48],"pages":["（p78）"],"kind":"截图可见正文补充"},"id":"XU06-02","knowledge":["XU06-02-K1","XU06-02-K2","XU06-02-K3"],"type":"multi","stem":"政治立场所反映或体现的内容包括：（多选）","options":["政党的执政理念","政党的世界观和方法论","政党成员的私人消费偏好","政党的根本属性"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"政党成员的私人消费偏好","reason":"私人消费偏好不属于截图所述政治立场内涵。"}],"explanation":"正确项：政党的世界观和方法论；政党的执政理念；政党的根本属性。\n原文要点：政治立场是一个政党观察、认识、处理政治问题的立足点，反映这个政党的世界观、方法论和执政理念，体现这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。\n逐项辨析：\n“政党成员的私人消费偏好”：私人消费偏好不属于截图所述政治立场内涵。\n出处：《期末重点截图.docx》截图048，截图标注（p78）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":4,"topic":22,"label":"政治立场的含义与人民立场的实践 · 期末截图","paragraphs":[379],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U06","screenshots":[48],"pages":["（p78）"],"kind":"截图可见正文补充"},"id":"XU06-03","knowledge":["XU06-03-K1"],"type":"single","stem":"在人民立场这一语境中，我们党区别于其他政党的显著标志是？（单选）","options":["人民立场","组织规模大小","执政时间长短","一般行政效率"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"组织规模大小","reason":"截图指出的是人民立场，不是组织规模。"},{"text":"执政时间长短","reason":"执政时长不能替代根本政治立场。"},{"text":"一般行政效率","reason":"行政效率不是此处显著标志的原文表述。"}],"explanation":"正确项：人民立场。\n本题限定人民立场语境。其他段落中“勇于自我革命”也有显著标志的表述，应分别按语境记忆。\n原文要点：政治立场是一个政党观察、认识、处理政治问题的立足点，反映这个政党的世界观、方法论和执政理念，体现这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。\n逐项辨析：\n“组织规模大小”：截图指出的是人民立场，不是组织规模。\n“执政时间长短”：执政时长不能替代根本政治立场。\n“一般行政效率”：行政效率不是此处显著标志的原文表述。\n出处：《期末重点截图.docx》截图048，截图标注（p78）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":4,"topic":22,"label":"政治立场的含义与人民立场的实践 · 期末截图","paragraphs":[379],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U06","screenshots":[48],"pages":["（p78）"],"kind":"截图可见正文补充"},"id":"XU06-04","knowledge":["XU06-04-K1"],"type":"single","stem":"坚持人民立场，应将哪种执政理念贯穿党和国家事业发展各方面？（单选）","options":["以短期增长为唯一中心","以少数群体偏好为中心","以部门利益为中心","以人民为中心"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"以短期增长为唯一中心","reason":"此项把人民中心替换成单一增长导向。"},{"text":"以部门利益为中心","reason":"部门利益不能替代人民利益。"},{"text":"以少数群体偏好为中心","reason":"人民立场不能缩减为少数群体偏好。"}],"explanation":"正确项：以人民为中心。\n原文要点：政治立场是一个政党观察、认识、处理政治问题的立足点，反映这个政党的世界观、方法论和执政理念，体现这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。\n逐项辨析：\n“以短期增长为唯一中心”：此项把人民中心替换成单一增长导向。\n“以部门利益为中心”：部门利益不能替代人民利益。\n“以少数群体偏好为中心”：人民立场不能缩减为少数群体偏好。\n出处：《期末重点截图.docx》截图048，截图标注（p78）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":4,"topic":23,"label":"血肉联系与党的生死存亡 · 期末截图","paragraphs":[380],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U07","screenshots":[49],"pages":["（p79）"],"kind":"截图可见正文补充"},"id":"XU07-01","knowledge":["XU07-01-K1"],"type":"single","stem":"关系到党的生死存亡、兴旺发达的联系是什么？（单选）","options":["同人民群众的血肉联系","同单一行业的经济联系","同个别部门的业务联系","同少数利益集团的利益联系"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"同少数利益集团的利益联系","reason":"党与人民群众的联系不能替换为利益集团联系。"},{"text":"同个别部门的业务联系","reason":"部门业务联系不是这一政治判断。"},{"text":"同单一行业的经济联系","reason":"单一行业不能替代人民群众。"}],"explanation":"正确项：同人民群众的血肉联系。\n原文要点：同人民群众的血肉联系关系到党的生死存亡、兴旺发达。\n逐项辨析：\n“同少数利益集团的利益联系”：党与人民群众的联系不能替换为利益集团联系。\n“同个别部门的业务联系”：部门业务联系不是这一政治判断。\n“同单一行业的经济联系”：单一行业不能替代人民群众。\n出处：《期末重点截图.docx》截图049，截图标注（p79）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":29,"label":"新发展理念的实践要求 · 期末截图","paragraphs":[381],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U08","screenshots":[60],"pages":["（p115）"],"kind":"截图可见正文补充"},"id":"XU08-01","knowledge":["XU08-01-K1"],"type":"single","stem":"创新在我国现代化建设全局中应处于什么地位？（单选）","options":["基础地位","核心地位","根本地位","主体地位"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"基础地位","reason":"本题创新在现代化建设全局中的定位是核心地位，不能换为基础地位。"},{"text":"主体地位","reason":"主体地位不是创新在现代化建设全局中的固定表述。"},{"text":"根本地位","reason":"应区分核心与根本，截图此处表述是核心地位。"}],"explanation":"正确项：核心地位。\n原文要点：必须坚持创新在我国现代化建设全局中的核心地位。协调发展必须正确处理局部和全局、当前和长远、重点和非重点的关系。绿色发展必须实现经济社会发展和生态环境保护协同共进。开放发展必须推动形成更大范围、更宽领域、更深层次对外开放格局。\n逐项辨析：\n“基础地位”：本题创新在现代化建设全局中的定位是核心地位，不能换为基础地位。\n“主体地位”：主体地位不是创新在现代化建设全局中的固定表述。\n“根本地位”：应区分核心与根本，截图此处表述是核心地位。\n出处：《期末重点截图.docx》截图060，截图标注（p115）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":29,"label":"新发展理念的实践要求 · 期末截图","paragraphs":[381],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U08","screenshots":[60],"pages":["（p115）"],"kind":"截图可见正文补充"},"id":"XU08-02","knowledge":["XU08-02-K1","XU08-02-K2","XU08-02-K3"],"type":"multi","stem":"协调发展需要正确处理的关系包括：（多选）","options":["局部和全局","重点和非重点","当前和长远","主要矛盾和矛盾的主要方面"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"主要矛盾和矛盾的主要方面","reason":"原文列举局部和全局、当前和长远、重点和非重点，不能用这组哲学概念替代该清单。"}],"explanation":"正确项：局部和全局；当前和长远；重点和非重点。\n原文要点：必须坚持创新在我国现代化建设全局中的核心地位。协调发展必须正确处理局部和全局、当前和长远、重点和非重点的关系。绿色发展必须实现经济社会发展和生态环境保护协同共进。开放发展必须推动形成更大范围、更宽领域、更深层次对外开放格局。\n逐项辨析：\n“主要矛盾和矛盾的主要方面”：原文列举局部和全局、当前和长远、重点和非重点，不能用这组哲学概念替代该清单。\n出处：《期末重点截图.docx》截图060，截图标注（p115）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":29,"label":"新发展理念的实践要求 · 期末截图","paragraphs":[381],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U08","screenshots":[60],"pages":["（p115）"],"kind":"截图可见正文补充"},"id":"XU08-03","knowledge":["XU08-03-K1"],"type":"single","stem":"按照截图的完整表述，绿色发展应推动哪两方面协同共进？（单选）","options":["经济发展和环境污染同步扩大","经济社会发展和自然资源消耗同步扩大","经济增长和资源消耗同步增长","经济社会发展和生态环境保护"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"经济增长和资源消耗同步增长","reason":"绿色发展要求发展与保护协同共进，不是资源消耗同步增长。"},{"text":"经济发展和环境污染同步扩大","reason":"此项把生态环境保护换为环境污染扩大，与协同共进的要求相冲突。"},{"text":"经济社会发展和自然资源消耗同步扩大","reason":"绿色发展不以资源消耗同步扩大为目标，要求经济社会发展与生态环境保护协同。"}],"explanation":"正确项：经济社会发展和生态环境保护。\n原文要点：必须坚持创新在我国现代化建设全局中的核心地位。协调发展必须正确处理局部和全局、当前和长远、重点和非重点的关系。绿色发展必须实现经济社会发展和生态环境保护协同共进。开放发展必须推动形成更大范围、更宽领域、更深层次对外开放格局。\n逐项辨析：\n“经济增长和资源消耗同步增长”：绿色发展要求发展与保护协同共进，不是资源消耗同步增长。\n“经济发展和环境污染同步扩大”：此项把生态环境保护换为环境污染扩大，与协同共进的要求相冲突。\n“经济社会发展和自然资源消耗同步扩大”：绿色发展不以资源消耗同步扩大为目标，要求经济社会发展与生态环境保护协同。\n出处：《期末重点截图.docx》截图060，截图标注（p115）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":29,"label":"新发展理念的实践要求 · 期末截图","paragraphs":[381],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U08","screenshots":[60],"pages":["（p115）"],"kind":"截图可见正文补充"},"id":"XU08-04","knowledge":["XU08-04-K1","XU08-04-K2","XU08-04-K3"],"type":"multi","stem":"开放发展应推动形成怎样的对外开放格局？（多选）","options":["更大范围","更深层次","更深领域","更宽领域"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"更深领域","reason":"原文是更宽领域、更深层次，不能将宽与深对应错位。"}],"explanation":"正确项：更大范围；更宽领域；更深层次。\n原文要点：必须坚持创新在我国现代化建设全局中的核心地位。协调发展必须正确处理局部和全局、当前和长远、重点和非重点的关系。绿色发展必须实现经济社会发展和生态环境保护协同共进。开放发展必须推动形成更大范围、更宽领域、更深层次对外开放格局。\n逐项辨析：\n“更深领域”：原文是更宽领域、更深层次，不能将宽与深对应错位。\n出处：《期末重点截图.docx》截图060，截图标注（p115）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":30,"label":"两类经济的共同地位 · 期末截图","paragraphs":[382],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U09","screenshots":[62],"pages":["（p121）"],"kind":"截图可见正文补充"},"id":"XU09-01","knowledge":["XU09-01-K1","XU09-01-K2"],"type":"multi","stem":"公有制经济和非公有制经济的共同地位包括：（多选）","options":["二者在所有制结构中具有完全相同的主体地位","都是社会主义市场经济的重要组成部分","都是我国经济社会发展的重要基础","都是社会主义经济的主体"],"answer":[1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"都是社会主义经济的主体","reason":"公有制为主体，不能说非公有制也同为主体。"},{"text":"二者在所有制结构中具有完全相同的主体地位","reason":"共同构成重要基础不意味着主体地位完全相同。"}],"explanation":"正确项：都是社会主义市场经济的重要组成部分；都是我国经济社会发展的重要基础。\n原文要点：公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。\n逐项辨析：\n“都是社会主义经济的主体”：公有制为主体，不能说非公有制也同为主体。\n“二者在所有制结构中具有完全相同的主体地位”：共同构成重要基础不意味着主体地位完全相同。\n出处：《期末重点截图.docx》截图062，截图标注（p121）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":31,"label":"市场与政府各自作用的边界 · 期末截图","paragraphs":[383],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U10","screenshots":[63],"pages":["（p124）"],"kind":"截图可见正文补充"},"id":"XU10-01","knowledge":["XU10-01-K1"],"type":"single","stem":"把市场机制能有效调节的经济活动交给市场，旨在推动资源配置实现？（单选）","options":["效益最大化和效率最优化","效益最优化和效率均等化","效率最大化和效益最优化","利益最大化和效率最优化"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"效率最大化和效益最优化","reason":"此项把效益最大化、效率最优化的对应关系对调。"},{"text":"效益最优化和效率均等化","reason":"原文对应是效益最大化、效率最优化，不能换为效率均等化。"},{"text":"利益最大化和效率最优化","reason":"此项将效益最大化换为利益最大化，改变资源配置整体效益的表述。"}],"explanation":"正确项：效益最大化和效率最优化。\n原文要点：市场在资源配置中起决定性作用，就是把市场机制能有效调节的经济活动交给市场，推动资源配置实现效益最大化和效率最优化。更好发挥政府作用，就是要在保证市场发挥决定性作用的前提下，管好那些市场管不了或管不好的事情。\n逐项辨析：\n“效率最大化和效益最优化”：此项把效益最大化、效率最优化的对应关系对调。\n“效益最优化和效率均等化”：原文对应是效益最大化、效率最优化，不能换为效率均等化。\n“利益最大化和效率最优化”：此项将效益最大化换为利益最大化，改变资源配置整体效益的表述。\n出处：《期末重点截图.docx》截图063，截图标注（p124）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":31,"label":"市场与政府各自作用的边界 · 期末截图","paragraphs":[383],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U10","screenshots":[63],"pages":["（p124）"],"kind":"截图可见正文补充"},"id":"XU10-02","knowledge":["XU10-02-K1"],"type":"single","stem":"更好发挥政府作用，应在保证市场发挥决定性作用的前提下管好什么？（单选）","options":["市场能够有效调节的事情","市场能管好但政府更熟悉的事情","市场已能管好且企业愿意承办的事情","市场管不了或管不好的事情"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"市场能够有效调节的事情","reason":"此项把管不了或管不好反转为能够有效调节。"},{"text":"市场能管好但政府更熟悉的事情","reason":"不能以政府更熟悉为由替代有效的市场调节，原文强调市场管不了或管不好。"},{"text":"市场已能管好且企业愿意承办的事情","reason":"原文强调政府管好市场管不了或管不好的事情，此项改变边界。"}],"explanation":"正确项：市场管不了或管不好的事情。\n原文要点：市场在资源配置中起决定性作用，就是把市场机制能有效调节的经济活动交给市场，推动资源配置实现效益最大化和效率最优化。更好发挥政府作用，就是要在保证市场发挥决定性作用的前提下，管好那些市场管不了或管不好的事情。\n逐项辨析：\n“市场能够有效调节的事情”：此项把管不了或管不好反转为能够有效调节。\n“市场能管好但政府更熟悉的事情”：不能以政府更熟悉为由替代有效的市场调节，原文强调市场管不了或管不好。\n“市场已能管好且企业愿意承办的事情”：原文强调政府管好市场管不了或管不好的事情，此项改变边界。\n出处：《期末重点截图.docx》截图063，截图标注（p124）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":32,"label":"科技自立自强的地位 · 期末截图","paragraphs":[384],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U11","screenshots":[68],"pages":["（p129）"],"kind":"截图可见正文补充"},"id":"XU11-01","knowledge":["XU11-01-K1"],"type":"single","stem":"我国经济生存和发展的基础，在截图这一表述中是？（单选）","options":["扩大国内需求","建设现代化产业体系","科技自立自强","高水平对外开放"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"高水平对外开放","reason":"开放是相关发展要求，本题中我国经济生存和发展的基础对应科技自立自强。"},{"text":"扩大国内需求","reason":"扩大内需与科技自立自强各有定位，不能替代截图此处的生存发展基础。"},{"text":"建设现代化产业体系","reason":"建设现代化产业体系是发展任务，题目中的基础对应科技自立自强。"}],"explanation":"正确项：科技自立自强。\n原文要点：科技自立自强是我国经济生存和发展的基础。\n逐项辨析：\n“高水平对外开放”：开放是相关发展要求，本题中我国经济生存和发展的基础对应科技自立自强。\n“扩大国内需求”：扩大内需与科技自立自强各有定位，不能替代截图此处的生存发展基础。\n“建设现代化产业体系”：建设现代化产业体系是发展任务，题目中的基础对应科技自立自强。\n出处：《期末重点截图.docx》截图068，截图标注（p129）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":6,"topic":33,"label":"现代化建设的农村任务与基础 · 期末截图","paragraphs":[385],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U12","screenshots":[69],"pages":["（p131）"],"kind":"截图可见正文补充"},"id":"XU12-01","knowledge":["XU12-01-K1"],"type":"single","stem":"全面建设社会主义现代化国家，最艰巨最繁重的任务、最广泛最深厚的基础依然在哪里？（单选）","options":["城市","乡镇企业","农村","县城"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"城市","reason":"题目两项固定定位均对应农村，不能换成城市。"},{"text":"县城","reason":"县城是城镇化的重要载体，不能替代本题农村的固定定位。"},{"text":"乡镇企业","reason":"乡镇企业只是经济组织类型，不能替代农村这一空间和社会范围。"}],"explanation":"正确项：农村。\n原文要点：全面建设社会主义现代化国家，最艰巨最繁重的任务依然在农村，最广泛最深厚的基础依然在农村。\n逐项辨析：\n“城市”：题目两项固定定位均对应农村，不能换成城市。\n“县城”：县城是城镇化的重要载体，不能替代本题农村的固定定位。\n“乡镇企业”：乡镇企业只是经济组织类型，不能替代农村这一空间和社会范围。\n出处：《期末重点截图.docx》截图069，截图标注（p131）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":7,"topic":34,"label":"教育科技人才的三组要求 · 期末截图","paragraphs":[386],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U13","screenshots":[70],"pages":["（p135）"],"kind":"截图可见正文补充"},"id":"XU13-01","knowledge":["XU13-01-K1","XU13-01-K2","XU13-01-K3"],"type":"multi","stem":"关于教育、科技、人才的要求，下列对应正确的有：（多选）","options":["人才引领驱动","科技自立自强","教育优先发展","人才优先发展、教育引领驱动作为原文固定对应"],"answer":[0,1,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"人才优先发展、教育引领驱动作为原文固定对应","reason":"此项将截图的三组固定对应互换。"}],"explanation":"正确项：教育优先发展；科技自立自强；人才引领驱动。\n原文要点：坚持教育优先发展、科技自立自强、人才引领驱动。\n逐项辨析：\n“人才优先发展、教育引领驱动作为原文固定对应”：此项将截图的三组固定对应互换。\n出处：《期末重点截图.docx》截图070，截图标注（p135）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":7,"topic":36,"label":"科技创新资源的配置导向 · 期末截图","paragraphs":[387],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U14","screenshots":[73],"pages":["（p149）"],"kind":"截图可见正文补充"},"id":"XU14-01","knowledge":["XU14-01-K1"],"type":"single","stem":"引导创新资源有效配置的重要导向是？（单选）","options":["行政计划","科研规模","投入总量","市场需求"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"行政计划","reason":"题目问引导创新资源有效配置的重要导向，原文对应市场需求。"},{"text":"科研规模","reason":"资源配置的重要导向是市场需求，科研规模不能替代需求。"},{"text":"投入总量","reason":"投入总量是数量概念，不能替代市场需求这一配置导向。"}],"explanation":"正确项：市场需求。\n原文要点：通过市场需求引导创新资源有效配置。\n逐项辨析：\n“行政计划”：题目问引导创新资源有效配置的重要导向，原文对应市场需求。\n“科研规模”：资源配置的重要导向是市场需求，科研规模不能替代需求。\n“投入总量”：投入总量是数量概念，不能替代市场需求这一配置导向。\n出处：《期末重点截图.docx》截图073，截图标注（p149）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":7,"topic":36,"label":"基础研究的链条位置与必要性 · 期末截图","paragraphs":[388],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U15","screenshots":[74],"pages":["（p150）"],"kind":"截图可见正文补充"},"id":"XU15-01","knowledge":["XU15-01-K1"],"type":"single","stem":"基础研究处于从研究到应用、再到生产的科研链条的哪个位置？（单选）","options":["生产端","转化端","起始端","应用端"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"应用端","reason":"基础研究在链条起始端，应用研究属于后续环节。"},{"text":"生产端","reason":"原文区分研究、应用、生产，不能把基础研究放在生产端。"},{"text":"转化端","reason":"成果转化承接研究成果，不能替代基础研究的起始端定位。"}],"explanation":"正确项：起始端。\n原文要点：基础研究处于从研究到应用、再到生产的科研链条起始端。加强基础研究是科技自立自强的必然要求，是从未知到已知、从不确定性到确定性的必然选择。\n逐项辨析：\n“应用端”：基础研究在链条起始端，应用研究属于后续环节。\n“生产端”：原文区分研究、应用、生产，不能把基础研究放在生产端。\n“转化端”：成果转化承接研究成果，不能替代基础研究的起始端定位。\n出处：《期末重点截图.docx》截图074，截图标注（p150）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":7,"topic":36,"label":"基础研究的链条位置与必要性 · 期末截图","paragraphs":[388],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U15","screenshots":[74],"pages":["（p150）"],"kind":"截图可见正文补充"},"id":"XU15-02","knowledge":["XU15-02-K1","XU15-02-K2","XU15-02-K3"],"type":"multi","stem":"加强基础研究的必要性，正确的有：（多选）","options":["是从未知到已知的必然选择","是科技自立自强的必然要求","是从确定性到不确定性的必然选择","是从不确定性到确定性的必然选择"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"是从确定性到不确定性的必然选择","reason":"此项把从不确定性到确定性的方向颠倒。"}],"explanation":"正确项：是科技自立自强的必然要求；是从未知到已知的必然选择；是从不确定性到确定性的必然选择。\n原文要点：基础研究处于从研究到应用、再到生产的科研链条起始端。加强基础研究是科技自立自强的必然要求，是从未知到已知、从不确定性到确定性的必然选择。\n逐项辨析：\n“是从确定性到不确定性的必然选择”：此项把从不确定性到确定性的方向颠倒。\n出处：《期末重点截图.docx》截图074，截图标注（p150）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":8,"topic":40,"label":"协商民主的民主与团结 · 期末截图","paragraphs":[389],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U16","screenshots":[82],"pages":["（p173）"],"kind":"截图可见正文补充"},"id":"XU16-01","knowledge":["XU16-01-K1"],"type":"single","stem":"按照截图的固定表述，我国协商民主坚持发扬民主和什么相互贯通？（单选）","options":["增进团结","凝聚共识","科学决策","依法治理"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"凝聚共识","reason":"此处考发扬民主和增进团结相互贯通的固定对应；凝聚共识不能替换原句的增进团结。"},{"text":"科学决策","reason":"科学决策是相关治理要求，不是此处与发扬民主相贯通的固定表述。"},{"text":"依法治理","reason":"依法治理不能替代此处固定对应中的增进团结。"}],"explanation":"正确项：增进团结。\n原文要点：我国协商民主坚持发扬民主和增进团结相互贯通。\n逐项辨析：\n“凝聚共识”：此处考发扬民主和增进团结相互贯通的固定对应；凝聚共识不能替换原句的增进团结。\n“科学决策”：科学决策是相关治理要求，不是此处与发扬民主相贯通的固定表述。\n“依法治理”：依法治理不能替代此处固定对应中的增进团结。\n出处：《期末重点截图.docx》截图082，截图标注（p173）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"依法治国的人民基础与四项要求 · 期末截图","paragraphs":[390],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U17","screenshots":[88],"pages":["（p185-187）"],"kind":"截图可见正文补充"},"id":"XU17-01","knowledge":["XU17-01-K1"],"type":"single","stem":"全面依法治国最广泛、最深厚的基础是什么？（单选）","options":["宪法","法律规范体系","党的领导","人民"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"宪法","reason":"宪法是根本法，题目中最广泛、最深厚的基础对应人民。"},{"text":"党的领导","reason":"党的领导是法治之魂，最广泛、最深厚的基础对应人民，不能互换。"},{"text":"法律规范体系","reason":"法律规范体系属于制度体系范畴，题目问人民基础。"}],"explanation":"正确项：人民。\n原文要点：全面依法治国最广泛、最深厚的基础是人民，必须坚持法治为了人民、依靠人民、造福人民、保护人民。\n逐项辨析：\n“宪法”：宪法是根本法，题目中最广泛、最深厚的基础对应人民。\n“党的领导”：党的领导是法治之魂，最广泛、最深厚的基础对应人民，不能互换。\n“法律规范体系”：法律规范体系属于制度体系范畴，题目问人民基础。\n出处：《期末重点截图.docx》截图088，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":41,"label":"依法治国的人民基础与四项要求 · 期末截图","paragraphs":[390],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U17","screenshots":[88],"pages":["（p185-187）"],"kind":"截图可见正文补充"},"id":"XU17-02","knowledge":["XU17-02-K1","XU17-02-K2","XU17-02-K3","XU17-02-K4"],"type":"multi","stem":"全面依法治国的人民性要求包括：（多选）","options":["法治为了人民","法治保护人民","法治造福人民","法治依靠人民"],"answer":[0,1,2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[],"explanation":"正确项：法治为了人民；法治依靠人民；法治造福人民；法治保护人民。\n原文要点：全面依法治国最广泛、最深厚的基础是人民，必须坚持法治为了人民、依靠人民、造福人民、保护人民。\n本题四个选项均正确，应全部选中。\n出处：《期末重点截图.docx》截图088，截图标注（p185-187）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":9,"topic":43,"label":"依法治国与依宪治国 · 期末截图","paragraphs":[391],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U18","screenshots":[93],"pages":["（p190）"],"kind":"截图可见正文补充"},"id":"XU18-01","knowledge":["XU18-01-K1"],"type":"single","stem":"坚持依法治国，首先要坚持什么？（单选）","options":["依宪执政","依宪治国","依章治党","依法执政"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"依宪执政","reason":"依法治国首先坚持依宪治国；依宪执政与依法执政相对应。"},{"text":"依法执政","reason":"此项把治国与执政的对应混淆，题目问依法治国首先坚持什么。"},{"text":"依章治党","reason":"依章治党属于党的建设要求，不能替代依宪治国。"}],"explanation":"正确项：依宪治国。\n原文要点：坚持依法治国首先要坚持依宪治国。\n逐项辨析：\n“依宪执政”：依法治国首先坚持依宪治国；依宪执政与依法执政相对应。\n“依法执政”：此项把治国与执政的对应混淆，题目问依法治国首先坚持什么。\n“依章治党”：依章治党属于党的建设要求，不能替代依宪治国。\n出处：《期末重点截图.docx》截图093，截图标注（p190）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":10,"topic":46,"label":"文化发展道路与改革创新 · 期末截图","paragraphs":[392],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U19","screenshots":[102],"pages":["（p205）"],"kind":"截图可见正文补充"},"id":"XU19-01","knowledge":["XU19-01-K1"],"type":"single","stem":"按照截图的固定表述，中国特色社会主义文化发展道路是一条什么道路？（单选）","options":["改革创新之路","复古创新之路","守正传承之路","制度创新之路"],"answer":0,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"守正传承之路","reason":"题目考截图对文化发展道路的这一定性，原文是改革创新之路。"},{"text":"复古创新之路","reason":"此项把改革创新中的改革替换为复古。"},{"text":"制度创新之路","reason":"此项把改革创新限缩为制度创新，不是原句完整表述。"}],"explanation":"正确项：改革创新之路。\n原文要点：中国特色社会主义文化发展道路是改革创新之路。\n逐项辨析：\n“守正传承之路”：题目考截图对文化发展道路的这一定性，原文是改革创新之路。\n“复古创新之路”：此项把改革创新中的改革替换为复古。\n“制度创新之路”：此项把改革创新限缩为制度创新，不是原句完整表述。\n出处：《期末重点截图.docx》截图102，截图标注（p205）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":11,"topic":49,"label":"社会治理与国家治理现代化 · 期末截图","paragraphs":[393],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U20","screenshots":[111],"pages":["（p235）"],"kind":"截图可见正文补充"},"id":"XU20-01","knowledge":["XU20-01-K1","XU20-01-K2"],"type":"multi","stem":"关于社会治理与国家治理，下列正确的有：（多选）","options":["社会治理是国家治理的全部内容","国家治理现代化是社会治理现代化的重要内容","推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容","社会治理是国家治理的重要领域"],"answer":[2,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"社会治理是国家治理的全部内容","reason":"重要领域不能扩大为国家治理的全部内容。"},{"text":"国家治理现代化是社会治理现代化的重要内容","reason":"此项颠倒整体与部分，社会治理现代化是国家治理现代化的重要内容。"}],"explanation":"正确项：社会治理是国家治理的重要领域；推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容。\n原文要点：社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容。\n逐项辨析：\n“社会治理是国家治理的全部内容”：重要领域不能扩大为国家治理的全部内容。\n“国家治理现代化是社会治理现代化的重要内容”：此项颠倒整体与部分，社会治理现代化是国家治理现代化的重要内容。\n出处：《期末重点截图.docx》截图111，截图标注（p235）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":13,"topic":53,"label":"国家安全的群众力量与风险能力 · 期末截图","paragraphs":[394],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U21","screenshots":[116],"pages":["（p262）"],"kind":"截图可见正文补充"},"id":"XU21-01","knowledge":["XU21-01-K1","XU21-01-K2","XU21-01-K3"],"type":"multi","stem":"维护国家安全，应充分发挥广大人民群众哪些方面的作用？（多选）","options":["积极性","创造性","自主性","主动性"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"自主性","reason":"原文三性是积极性、主动性、创造性，不能把主动性换为自主性。"}],"explanation":"正确项：积极性；主动性；创造性。\n原文要点：充分发挥广大人民群众积极性、主动性、创造性，汇聚起维护国家安全的强大力量；提高防范化解政治安全风险的能力和水平。\n逐项辨析：\n“自主性”：原文三性是积极性、主动性、创造性，不能把主动性换为自主性。\n出处：《期末重点截图.docx》截图116，截图标注（p262）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":13,"topic":53,"label":"国家安全的群众力量与风险能力 · 期末截图","paragraphs":[394],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U21","screenshots":[116],"pages":["（p262）"],"kind":"截图可见正文补充"},"id":"XU21-02","knowledge":["XU21-02-K1"],"type":"single","stem":"完善政治安全工作体系，需要提高哪方面能力和水平？（单选）","options":["防范化解文化安全风险","防范化解政治安全风险","防范化解经济安全风险","防范化解社会安全风险"],"answer":1,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"防范化解经济安全风险","reason":"此项将政治安全风险换成经济安全风险。"},{"text":"防范化解社会安全风险","reason":"此项将政治安全风险换成社会安全风险。"},{"text":"防范化解文化安全风险","reason":"此项将政治安全风险换成文化安全风险。"}],"explanation":"正确项：防范化解政治安全风险。\n原文要点：充分发挥广大人民群众积极性、主动性、创造性，汇聚起维护国家安全的强大力量；提高防范化解政治安全风险的能力和水平。\n逐项辨析：\n“防范化解经济安全风险”：此项将政治安全风险换成经济安全风险。\n“防范化解社会安全风险”：此项将政治安全风险换成社会安全风险。\n“防范化解文化安全风险”：此项将政治安全风险换成文化安全风险。\n出处：《期末重点截图.docx》截图116，截图标注（p262）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":13,"topic":55,"label":"政权安全的执政参政关系 · 期末截图","paragraphs":[395],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U22","screenshots":[118],"pages":["（p267）"],"kind":"截图可见正文补充"},"id":"XU22-01","knowledge":["XU22-01-K1","XU22-01-K2"],"type":"multi","stem":"关于我国的执政参政关系，截图中完整可读的正确表述包括：（多选）","options":["中国共产党执政","各民主党派轮流执政","各民主党派参政","中国共产党与各民主党派共同执政"],"answer":[0,2],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"各民主党派轮流执政","reason":"各民主党派参政，不能改为轮流执政。"},{"text":"中国共产党与各民主党派共同执政","reason":"原文区分中国共产党执政、各民主党派参政，不能混为共同执政。"}],"explanation":"正确项：中国共产党执政；各民主党派参政。\n原文要点：我国是中国共产党执政，各民主党派参政，不搞三权分立。截图后续没有完整显示，本条仅收录完整可读的命题。\n逐项辨析：\n“各民主党派轮流执政”：各民主党派参政，不能改为轮流执政。\n“中国共产党与各民主党派共同执政”：原文区分中国共产党执政、各民主党派参政，不能混为共同执政。\n出处：《期末重点截图.docx》截图118，截图标注（p267）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":15,"topic":58,"label":"一国两制下港澳制度的前提 · 期末截图","paragraphs":[396],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U23","screenshots":[123],"pages":["（p299）"],"kind":"截图可见正文补充"},"id":"XU23-01","knowledge":["XU23-01-K1"],"type":"single","stem":"在维护国家主权、安全、发展利益的前提下，香港、澳门保持哪种原有制度长期不变？（单选）","options":["社会主义市场经济制度","中国特色社会主义制度","社会主义制度","资本主义制度"],"answer":3,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"社会主义制度","reason":"此项把港澳原有资本主义制度换为社会主义制度。"},{"text":"社会主义市场经济制度","reason":"市场经济体制与社会制度不是同一层次，港澳保持的是原有资本主义制度。"},{"text":"中国特色社会主义制度","reason":"此项混淆一国两制中的两种制度，题目问港澳原有制度。"}],"explanation":"正确项：资本主义制度。\n原文要点：维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变。\n逐项辨析：\n“社会主义制度”：此项把港澳原有资本主义制度换为社会主义制度。\n“社会主义市场经济制度”：市场经济体制与社会制度不是同一层次，港澳保持的是原有资本主义制度。\n“中国特色社会主义制度”：此项混淆一国两制中的两种制度，题目问港澳原有制度。\n出处：《期末重点截图.docx》截图123，截图标注（p299）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":16,"topic":62,"label":"全人类共同价值的成果内涵 · 期末截图","paragraphs":[397],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U24","screenshots":[129],"pages":["（p331）"],"kind":"截图可见正文补充"},"id":"XU24-01","knowledge":["XU24-01-K1"],"type":"single","stem":"全人类共同价值包含什么成果？（单选）","options":["当今时代西方价值观优秀成果","各国价值观具体形式的统一成果","当今时代人类价值观优秀成果","当今时代人类价值观全部成果"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"当今时代人类价值观全部成果","reason":"原文限定优秀成果，不能把优秀扩大为全部。"},{"text":"当今时代西方价值观优秀成果","reason":"原文范围是人类价值观，不能缩为西方价值观。"},{"text":"各国价值观具体形式的统一成果","reason":"共同价值不意味着各国价值观具体形式统一，不能替代人类价值观优秀成果。"}],"explanation":"正确项：当今时代人类价值观优秀成果。\n原文要点：全人类共同价值包含当今时代人类价值观优秀成果。\n逐项辨析：\n“当今时代人类价值观全部成果”：原文限定优秀成果，不能把优秀扩大为全部。\n“当今时代西方价值观优秀成果”：原文范围是人类价值观，不能缩为西方价值观。\n“各国价值观具体形式的统一成果”：共同价值不意味着各国价值观具体形式统一，不能替代人类价值观优秀成果。\n出处：《期末重点截图.docx》截图129，截图标注（p331）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":17,"topic":63,"label":"党的建设的一贯要求与根本方针 · 期末截图","paragraphs":[398],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U25","screenshots":[131],"pages":["（p338）"],"kind":"截图可见正文补充"},"id":"XU25-01","knowledge":["XU25-01-K1"],"type":"single","stem":"党的建设的一贯要求和根本方针是？（单选）","options":["党要管党、依法治国","党要管党、从宽治党","党要管党、从严治党","全面领导、从严治政"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"党要管党、依法治国","reason":"此项将从严治党替换为依法治国，混淆治党与治国。"},{"text":"全面领导、从严治政","reason":"此项将党要管党、从严治党的对象和用词替换。"},{"text":"党要管党、从宽治党","reason":"此项仅将严替换为宽，改变管党治党的根本要求。"}],"explanation":"正确项：党要管党、从严治党。\n原文要点：党要管党、从严治党，是党的建设的一贯要求和根本方针。\n逐项辨析：\n“党要管党、依法治国”：此项将从严治党替换为依法治国，混淆治党与治国。\n“全面领导、从严治政”：此项将党要管党、从严治党的对象和用词替换。\n“党要管党、从宽治党”：此项仅将严替换为宽，改变管党治党的根本要求。\n出处：《期末重点截图.docx》截图131，截图标注（p338）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":17,"topic":64,"label":"反腐败的必答题地位 · 期末截图","paragraphs":[399],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"U26","screenshots":[137],"pages":["（p351）"],"kind":"截图可见正文补充"},"id":"XU26-01","knowledge":["XU26-01-K1"],"type":"single","stem":"全面从严治党的“必答题”是什么？（单选）","options":["思想建设","政治建设","反腐败","组织建设"],"answer":2,"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"政治建设","reason":"政治建设是党的根本性建设，截图所说必答题对应反腐败。"},{"text":"思想建设","reason":"思想建设是党的基础性建设，不能替代截图必答题的固定对应。"},{"text":"组织建设","reason":"组织建设属于党的建设的重要内容，此处必答题具体对应反腐败。"}],"explanation":"正确项：反腐败。\n原文要点：反腐败是最彻底的自我革命，是全面从严治党的“必答题”。\n逐项辨析：\n“政治建设”：政治建设是党的根本性建设，截图所说必答题对应反腐败。\n“思想建设”：思想建设是党的基础性建设，不能替代截图必答题的固定对应。\n“组织建设”：组织建设属于党的建设的重要内容，此处必答题具体对应反腐败。\n出处：《期末重点截图.docx》截图137，截图标注（p351）。页码沿用截图标注，不是教材PDF文件页序。"},{"chapter":5,"topic":26,"label":"解放发展生产力的新时代要求 · 期末截图","paragraphs":[400],"source":"document","web":null,"screenshot":{"file":"期末重点截图.docx","group":"A01","screenshots":[57],"pages":["（p97）"],"kind":"原稿直接考查补充"},"id":"XA01-01","knowledge":["XA01-01-K1","XA01-01-K2","XA01-01-K3"],"type":"multi","stem":"解放和发展社会生产力，也是新时代开展下列哪些工作的必然要求？（多选）","options":["构建新发展格局","推动高质量发展","以高速增长替代高质量发展","贯彻新发展理念"],"answer":[0,1,3],"choiceRevision":"choice-20261029-3","distractorNotes":[{"text":"以高速增长替代高质量发展","reason":"此项把高质量发展换为高速增长，改变原文对应。"}],"explanation":"正确项：贯彻新发展理念；构建新发展格局；推动高质量发展。\n原文要点：解放和发展社会生产力，是改革开放的鲜明特征和首要任务，也是新时代贯彻新发展理念、构建新发展格局、推动高质量发展的必然要求。\n逐项辨析：\n“以高速增长替代高质量发展”：此项把高质量发展换为高速增长，改变原文对应。\n出处：《期末重点截图.docx》截图057，截图标注（p97）。页码沿用截图标注，不是教材PDF文件页序。"}],"webSources":[{"id":"w1","title":"习近平新时代中国特色社会主义思想的主要内容","publisher":"共产党员网","date":"2023-11-28","accessed":"2026-10-29","url":"https://www.12371.cn/2023/11/28/STUD1701138144512885.shtml"},{"id":"w2","title":"习近平总书记关于党的建设的重要思想（“十三个坚持”）","publisher":"共产党员网","date":"2023-11-28","accessed":"2026-10-29","url":"https://www.12371.cn/2023/11/28/STUD1701138144772933.shtml"}],"textbook":{"title":"习近平新时代中国特色社会主义思想概论","file":"习概.pdf","author":"本书编写组","publishers":"高等教育出版社、人民出版社","pdfPages":378},"source":{"title":"习概课程背诵稿.docx","paragraphs":[{"id":1,"text":"习近平新时代中国特色社会主义思想课程背诵稿"},{"id":2,"text":"章节问答  材料题精简答案  易混点速记"},{"id":3,"text":"背诵时先记每章的关键词，再合上答案复述各题要点。材料题先背分点首句，再补解释，作答时结合题干材料。关键词仅帮助回忆，正式答题使用完整表述。"},{"id":4,"text":"建议顺序：先背三组材料题及其关联的第四章、第十章、第十七章，再按章节补齐知识点，最后用易混点清单自测。"},{"id":5,"text":"第一部分 章节问答"},{"id":6,"text":"导论 习近平新时代中国特色社会主义思想创立与体系"},{"id":7,"text":"记忆线索  背景—结合—课题—体系—地位—确立"},{"id":8,"text":"01 思想创立的时代背景与理论来源"},{"id":9,"text":"习近平新时代中国特色社会主义思想是在中华民族伟大复兴进入关键时期、世界百年未有之大变局加速演进、中国共产党自我革命开辟新境界、科学社会主义在二十一世纪中国焕发新生机的时代背景中创立并不断丰富发展的。"},{"id":10,"text":"习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。"},{"id":11,"text":"02 回答了哪些重大时代课题"},{"id":12,"text":"这一思想科学回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题。"},{"id":13,"text":"03 科学体系由哪些部分构成"},{"id":14,"text":"“十个明确”是主体内容，构成思想体系的四梁八柱并发挥统摄作用；“十四个坚持”是基本方略；“十三个方面成就”反映新时代伟大实践和伟大变革。"},{"id":15,"text":"“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”共同构成习近平新时代中国特色社会主义思想的科学体系。"},{"id":16,"text":"04 六个必须坚持是什么"},{"id":17,"text":"必须坚持人民至上，必须坚持自信自立，必须坚持守正创新，必须坚持问题导向，必须坚持系统观念，必须坚持胸怀天下。"},{"id":18,"text":"这六个方面集中体现了这一思想的世界观和方法论以及贯穿其中的立场观点方法。"},{"id":19,"text":"05 指导地位与历史地位"},{"id":20,"text":"党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章。"},{"id":21,"text":"2018年3月，十三届全国人大一次会议把习近平新时代中国特色社会主义思想载入宪法。"},{"id":22,"text":"这一思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。"},{"id":23,"text":"06 两个确立是什么"},{"id":24,"text":"“两个确立”是确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。"},{"id":25,"text":"第一章 新时代坚持和发展中国特色社会主义"},{"id":26,"text":"记忆线索  基本原则—四个自信—历史方位—主要矛盾—两个布局"},{"id":27,"text":"07 中国特色社会主义为什么是社会主义"},{"id":28,"text":"“什么是社会主义、怎样建设社会主义”是中国共产党人思考的基本问题。"},{"id":29,"text":"中国特色社会主义之所以是社会主义而不是其他什么主义，是因为始终坚持科学社会主义基本原则，并根据新的时代条件赋予其鲜明的中国特色。"},{"id":30,"text":"当代中国的伟大社会变革不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版；社会主义没有定于一尊、一成不变的套路。"},{"id":31,"text":"08 四个自信与四者关系"},{"id":32,"text":"四个自信是道路自信、理论自信、制度自信、文化自信。"},{"id":33,"text":"道路是实现途径，理论体系是行动指南，制度是根本保障，文化是精神力量。四者统一于中国特色社会主义伟大实践。"},{"id":34,"text":"09 进入新时代意味着什么"},{"id":35,"text":"中国特色社会主义新时代是我国发展新的历史方位。"},{"id":36,"text":"中国特色社会主义进入新时代，意味着中华民族迎来从站起来、富起来到强起来的伟大飞跃；意味着科学社会主义在二十一世纪的中国焕发强大生机活力；意味着中国特色社会主义道路、理论、制度、文化不断发展，为其他国家和民族的现代化提供全新选择并贡献中国智慧和中国方案。"},{"id":37,"text":"10 主要矛盾发生了什么变化"},{"id":38,"text":"新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"id":39,"text":"我国社会主要矛盾的变化，是作出中国特色社会主义进入新时代重大判断的基本依据。"},{"id":40,"text":"新时代我国社会主要矛盾的变化是在社会主义初级阶段中发生的变化，没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情，也没有改变我国是世界最大发展中国家的国际地位。"},{"id":41,"text":"11 五位一体与四个全面是什么"},{"id":42,"text":"中国特色社会主义事业总体布局是“五位一体”，战略布局是“四个全面”。"},{"id":43,"text":"五位一体：经济建设、政治建设、文化建设、社会建设、生态文明建设。"},{"id":44,"text":"四个全面：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"},{"id":45,"text":"第二章 以中国式现代化全面推进中华民族伟大复兴"},{"id":46,"text":"记忆线索  一个主题—五个特色—九项要求—五项原则—六对关系"},{"id":47,"text":"12 历史使命 中心任务与中国梦"},{"id":48,"text":"实现中华民族伟大复兴是中国共产党的历史使命。新时代新征程党的中心任务，是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"id":49,"text":"一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是实现中华民族伟大复兴这一个主题。"},{"id":50,"text":"中国梦的本质是国家富强、民族振兴、人民幸福。"},{"id":51,"text":"13 中国式现代化的五个中国特色"},{"id":52,"text":"中国式现代化具有五个中国特色：人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。"},{"id":53,"text":"14 中国式现代化的本质要求"},{"id":54,"text":"中国式现代化的本质要求是坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。"},{"id":55,"text":"15 推进中国式现代化的重大原则"},{"id":56,"text":"推进中国式现代化必须坚持和加强党的全面领导，坚持中国特色社会主义道路，坚持以人民为中心的发展思想，坚持深化改革开放，坚持发扬斗争精神。"},{"id":57,"text":"16 需要处理哪些重大关系"},{"id":58,"text":"推进中国式现代化需要正确处理顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放等重大关系。"},{"id":59,"text":"推进中国式现代化必须坚持团结奋斗。"},{"id":60,"text":"第三章 坚持党的全面领导"},{"id":61,"text":"记忆线索  本质—优势—力量—原则—制度"},{"id":62,"text":"17 为什么必须坚持党的领导"},{"id":63,"text":"中国共产党的领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势；中国共产党是最高政治领导力量。"},{"id":64,"text":"中国最大的国情就是中国共产党的领导。"},{"id":65,"text":"中国共产党的自身优势是中国特色社会主义制度优势的主要来源之一。"},{"id":66,"text":"18 党的全面领导怎样体现"},{"id":67,"text":"党的领导是全面的、系统的、整体的，贯穿治国理政各领域各方面各环节；党组织在各级各种组织中发挥领导核心作用，既善于总揽全局，又善于协调各方。"},{"id":68,"text":"党的领导并不意味着党组织包揽包办一切，而是发挥总揽全局、协调各方的领导核心作用。"},{"id":69,"text":"19 最高原则和根本组织原则是什么"},{"id":70,"text":"党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在。"},{"id":71,"text":"中国共产党是以民主集中制为根本组织原则和领导制度的马克思主义政党。"},{"id":72,"text":"20 如何理解并完善党的领导制度"},{"id":73,"text":"党的领导制度是我国的根本领导制度。中国共产党领导是国家治理体系的核心，党的领导制度是中国特色社会主义制度建设的关键。"},{"id":74,"text":"坚持和加强党的全面领导，必须健全党的全面领导制度，发挥党在各种组织中总揽全局、协调各方的领导核心作用，把党的领导贯彻到党和国家所有机构履行职责全过程。"},{"id":75,"text":"第四章 坚持以人民为中心"},{"id":76,"text":"记忆线索  创造者—立场—初心—评判—路线—共富"},{"id":77,"text":"21 人民的地位和民心的重要性"},{"id":78,"text":"人民是历史的创造者，是真正的英雄；一切成就归功于人民，一切荣耀归属于人民。"},{"id":79,"text":"打江山、守江山，守的是人民的心。民心是最大的政治，决定事业兴衰成败。"},{"id":80,"text":"必须解决好为了谁、依靠谁、由谁来评价的问题。人民是党执政的最大底气。"},{"id":81,"text":"22 人民立场与初心使命是什么"},{"id":82,"text":"人民立场是中国共产党的根本政治立场，是党区别于其他政党的显著标志。"},{"id":83,"text":"为中国人民谋幸福、为中华民族谋复兴，是中国共产党人的初心和使命。"},{"id":84,"text":"23 谁来评价党的工作"},{"id":85,"text":"人民是党的工作的最高裁决者和最终评判者。"},{"id":86,"text":"我们党的最大政治优势是密切联系群众，党执政后的最大危险是脱离群众。"},{"id":87,"text":"24 群众路线的地位 内容与方法"},{"id":88,"text":"群众路线是党的生命线和根本工作路线，是党永葆青春活力和战斗力的重要传家宝；也是党始终坚持的根本工作方法。"},{"id":89,"text":"群众路线的基本内容是：一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动，把群众路线贯彻到治国理政全部活动之中。"},{"id":90,"text":"调查研究是获得真知灼见的源头活水，也是贯彻群众路线的有效路径。"},{"id":91,"text":"25 推进共同富裕应坚持哪些原则"},{"id":92,"text":"扎实推进共同富裕，必须坚持鼓励勤劳创新致富，坚持基本经济制度，尽力而为量力而行，坚持循序渐进。"},{"id":93,"text":"第五章 全面深化改革开放"},{"id":94,"text":"记忆线索  关键一招—总目标—方向—改革发展稳定—法治"},{"id":95,"text":"26 为什么必须坚持改革开放"},{"id":96,"text":"改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。"},{"id":97,"text":"改革开放是坚持和发展中国特色社会主义的必由之路，是党和人民大踏步赶上时代的重要法宝。"},{"id":98,"text":"解放和发展社会生产力是改革开放的鲜明特征和首要任务，也是新时代贯彻新发展理念、构建新发展格局、推动高质量发展的必然要求。"},{"id":99,"text":"27 全面深化改革总目标是什么"},{"id":100,"text":"全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化，两句话缺一不可。"},{"id":101,"text":"完善和发展中国特色社会主义制度，规定了改革的根本方向；推进国家治理体系和治理能力现代化，明确了改革的鲜明指向。"},{"id":102,"text":"28 改革应坚持怎样的方向和方法"},{"id":103,"text":"全面深化改革必须坚持正确方向，既不走封闭僵化的老路，也不走改旗易帜的邪路；该改的、能改的坚决改，不该改的、不能改的坚决不改。"},{"id":104,"text":"统筹改革发展稳定。改革是动力，发展是目的，稳定是前提。"},{"id":105,"text":"坚持重大改革于法有据，在法治轨道上推进改革；实践证明行之有效的改革成果要及时上升为法律。"},{"id":106,"text":"改革开放只有进行时，没有完成时；要坚定不移扩大高水平对外开放。"},{"id":107,"text":"第六章 推动高质量发展"},{"id":108,"text":"记忆线索  高质量—新理念—基本制度—市场政府—双循环—乡村振兴"},{"id":109,"text":"29 高质量发展的地位与新发展理念"},{"id":110,"text":"高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任务。"},{"id":111,"text":"新发展理念包括创新、协调、绿色、开放、共享。创新是引领发展的第一动力，解决发展动力问题；协调是持续健康发展的内在要求，解决发展不平衡问题；绿色是永续发展的必要条件，解决人与自然和谐共生问题；开放是国家繁荣发展的必由之路，解决发展内外联动问题；共享是中国特色社会主义的本质要求，解决社会公平正义问题。"},{"id":112,"text":"30 社会主义基本经济制度与两个毫不动摇"},{"id":113,"text":"社会主义基本经济制度包括：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。"},{"id":114,"text":"“两个毫不动摇”是毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。"},{"id":115,"text":"31 怎样处理政府和市场的关系"},{"id":116,"text":"构建高水平社会主义市场经济体制，关键是处理好政府和市场的关系。使市场在资源配置中起决定性作用，更好发挥政府作用，推动有效市场和有为政府更好结合。"},{"id":117,"text":"32 新发展格局是什么 如何准确理解"},{"id":118,"text":"新发展格局是以国内大循环为主体、国内国际双循环相互促进。构建新发展格局是把握未来发展主动权的先手棋，不是被迫之举和权宜之计；是开放的国内国际双循环，不是封闭的国内单循环；以全国统一大市场基础上的国内大循环为主体，不是各地搞自我小循环。"},{"id":119,"text":"构建新发展格局最本质的特征是实现高水平的自立自强。"},{"id":120,"text":"33 乡村振兴的目标 方针 要求与保障"},{"id":121,"text":"农业强国是社会主义现代化强国的根基。乡村振兴中，农业农村现代化是总目标，农业农村优先发展是总方针，产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求，城乡融合发展体制机制和政策体系是制度保障。"},{"id":122,"text":"第七章 社会主义现代化建设的教育科技人才战略"},{"id":123,"text":"记忆线索  教育根本—科技关键—人才基础—三个第一—立德树人"},{"id":124,"text":"34 教育科技人才的战略地位"},{"id":125,"text":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义现代化国家，教育是根本，科技是关键，人才是基础。"},{"id":126,"text":"必须坚持科技是第一生产力、人才是第一资源、创新是第一动力。"},{"id":127,"text":"35 教育的根本任务和根本问题"},{"id":128,"text":"必须把教育事业放在优先发展的战略位置，把立德树人作为教育的根本任务。"},{"id":129,"text":"落实立德树人根本任务，必须解决好培养什么人、怎样培养人、为谁培养人的问题，这是教育的根本问题，也是建设教育强国的核心课题。"},{"id":130,"text":"36 怎样把握科技创新的基础与机制"},{"id":131,"text":"基础研究是科技创新的源头。我国很多“卡脖子”技术问题，根子是基础理论研究跟不上。"},{"id":132,"text":"推进科技创新要发挥市场在资源配置中的决定性作用，并推动有效市场和有为政府更好结合。"},{"id":133,"text":"第八章 发展全过程人民民主"},{"id":134,"text":"记忆线索  三个统一—三个最—根本与基本制度—协商民主—统一战线"},{"id":135,"text":"37 政治发展道路必须坚持什么"},{"id":136,"text":"走中国特色社会主义政治发展道路，必须坚持党的领导、人民当家作主、依法治国有机统一。党的领导是根本保障，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式。"},{"id":137,"text":"38 全过程人民民主的本质属性与优势"},{"id":138,"text":"全过程人民民主是社会主义民主政治的本质属性，是新时代我国民主政治领域具有重大创新意义的标志性成果。"},{"id":139,"text":"评判一种民主形式好不好，实践最有说服力，人民最有发言权。全过程人民民主是最广泛、最真实、最管用的民主。"},{"id":140,"text":"39 国体 政体 根本制度和基本制度"},{"id":141,"text":"我国的国体是人民民主专政，政体和根本政治制度是人民代表大会制度。"},{"id":142,"text":"人民代表大会制度是我国的根本政治制度，是符合国情和实际、体现社会主义国家性质、保障人民当家作主、保障实现中华民族伟大复兴的好制度。"},{"id":143,"text":"中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度构成我国的基本政治制度。"},{"id":144,"text":"40 协商民主和统一战线的要点"},{"id":145,"text":"协商民主是中国特色社会主义民主政治中独特的、独有的、独到的民主形式。"},{"id":146,"text":"统一战线的本质要求是大团结大联合，解决的是人心和力量问题。统一战线是党领导的统一战线，党的领导是最鲜明特征，坚持党的领导是最核心最根本的问题。"},{"id":147,"text":"第九章 全面依法治国"},{"id":148,"text":"记忆线索  道路—原则—总目标—宪法—法治体系"},{"id":149,"text":"41 法治道路的核心要义与坚持原则"},{"id":150,"text":"中国特色社会主义法治道路的核心要义是坚持党的领导、坚持中国特色社会主义制度、贯彻中国特色社会主义法治理论。"},{"id":151,"text":"坚持和拓展中国特色社会主义法治道路，必须坚持中国共产党的领导，坚持以人民为中心，坚持法律面前人人平等，坚持依法治国和以德治国相结合，坚持从中国实际出发。"},{"id":152,"text":"42 全面依法治国的总目标"},{"id":153,"text":"全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。"},{"id":154,"text":"法治中国建设的总体目标包括法治国家、法治政府、法治社会全面建成。"},{"id":155,"text":"43 宪法的地位与依宪治国的要求"},{"id":156,"text":"宪法是国家的根本法，是治国安邦的总章程，是党和人民意志的集中体现，是国家各种制度和法律法规的总依据，具有最高法律地位、法律权威、法律效力。"},{"id":157,"text":"坚持依宪治国、依宪执政，必须坚持宪法确定的中国共产党领导地位不动摇，坚持宪法确定的人民民主专政国体和人民代表大会制度政体不动摇。"},{"id":158,"text":"44 法律规范体系与党内法规体系"},{"id":159,"text":"法律规范体系以宪法为核心；党内法规体系以党章为根本、以民主集中制为核心。"},{"id":160,"text":"建设中国特色社会主义法治体系，要加快形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形成完善的党内法规体系。"},{"id":161,"text":"第十章 建设社会主义文化强国"},{"id":162,"text":"记忆线索  文化自信—三个基础—使命任务—意识形态—精神与文明"},{"id":163,"text":"45 文化自信的地位与依据"},{"id":164,"text":"文化自信是更基础、更广泛、更深厚的自信。没有高度的文化自信，没有文化的繁荣兴盛，就没有中华民族伟大复兴。"},{"id":165,"text":"中华优秀传统文化是坚定文化自信的深厚基础；党领导人民在伟大斗争中孕育的革命文化和社会主义先进文化是坚定文化自信的坚强基石；中国特色社会主义伟大实践是文化自信的现实基础。"},{"id":166,"text":"46 怎样建设社会主义文化强国"},{"id":167,"text":"坚持中国特色社会主义文化发展道路，围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国，发展民族的科学的大众的社会主义文化。"},{"id":168,"text":"创新创造是文化的生命所在，是文化的本质特征。"},{"id":169,"text":"推动中华优秀传统文化创造性转化、创新性发展。"},{"id":170,"text":"47 意识形态与新闻舆论工作的原则"},{"id":171,"text":"坚持马克思主义在意识形态领域指导地位的根本制度。马克思主义是立党立国、兴党兴国的根本指导思想。"},{"id":172,"text":"新闻舆论工作具有鲜明意识形态属性，坚持正确政治方向是第一要求，党性原则是新闻舆论工作的根本原则。"},{"id":173,"text":"48 伟大建党精神与中华文明突出特性"},{"id":174,"text":"中国共产党人精神谱系以伟大建党精神为源头。伟大建党精神是坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。"},{"id":175,"text":"中华文明具有突出的连续性、创新性、统一性、包容性、和平性。"},{"id":176,"text":"第十一章 以保障和改善民生为重点加强社会建设"},{"id":177,"text":"记忆线索  脱贫底线—民生三性—共建共治共享"},{"id":178,"text":"49 民生建设与社会治理的重点"},{"id":179,"text":"打赢脱贫攻坚战、消除绝对贫困，是全面建成小康社会的底线任务，是必须抓紧抓好的第一民生工程。"},{"id":180,"text":"加强普惠性、基础性、兜底性民生建设，着力解决人民群众急难愁盼问题，不断增强人民获得感、幸福感、安全感。"},{"id":181,"text":"必须坚定不移走中国特色社会主义社会治理之路，不断创新社会治理理念思路、体制机制和方法手段，打造共建共治共享的社会治理新格局。"},{"id":182,"text":"第十二章 建设社会主义生态文明"},{"id":183,"text":"记忆线索  两山理念—发展保护统一—民生福祉—绿色转型"},{"id":184,"text":"50 生态环境问题的根源与治本之策"},{"id":185,"text":"生态环境问题归根到底是经济发展方式和生活方式问题。"},{"id":186,"text":"绿色发展是新发展理念的重要内容，解决的是人与自然和谐共生问题；推动发展方式绿色低碳转型，是解决生态环境问题的治本之策。"},{"id":187,"text":"51 怎样理解绿水青山就是金山银山"},{"id":188,"text":"绿水青山就是金山银山，这是重要的发展理念，也是推进现代化建设的重大原则。"},{"id":189,"text":"保护生态环境就是保护生产力，改善生态环境就是发展生产力。经济发展与生态环境保护从根本上是辩证统一、相辅相成的关系，要坚持在发展中保护、在保护中发展。"},{"id":190,"text":"处理好绿水青山和金山银山的关系，关键在人，关键在思路。"},{"id":191,"text":"52 生态文明建设的重要性"},{"id":192,"text":"生态文明建设是关系中华民族永续发展的根本大计，是重大经济问题，也是关系民生福祉的重大社会问题。良好生态环境是最公平的公共产品，是最普惠的民生福祉。"},{"id":193,"text":"第十三章 维护和塑造国家安全"},{"id":194,"text":"记忆线索  人民宗旨—政治根本—十个坚持—政权安全"},{"id":195,"text":"53 总体国家安全观的宗旨和根本"},{"id":196,"text":"总体国家安全观坚持以人民安全为宗旨，把保护人民安全摆在最重要位置；坚持以政治安全为根本，把政治安全放在首要位置。"},{"id":197,"text":"还要以经济安全为基础，以军事、科技、文化、社会安全为保障。"},{"id":198,"text":"54 总体国家安全观的十个坚持"},{"id":199,"text":"总体国家安全观的主要内容集中体现为十个坚持：坚持党对国家安全工作的绝对领导；坚持中国特色国家安全道路；坚持以人民安全为宗旨；坚持统筹发展和安全；坚持把政治安全放在首要位置；坚持统筹推进各领域安全；坚持把防范化解国家安全风险摆在突出位置；坚持推进国际共同安全；坚持推进国家安全体系和能力现代化；坚持加强国家安全干部队伍建设。"},{"id":200,"text":"55 维护政权安全的要求"},{"id":201,"text":"维护政权安全，就是毫不动摇坚持和巩固党的领导和长期执政地位。"},{"id":202,"text":"第十四章 建设巩固国防和强大人民军队"},{"id":203,"text":"记忆线索  绝对领导—强军目标—五个强军举措—科技人才法治"},{"id":204,"text":"56 建军之本与强军目标"},{"id":205,"text":"习近平强军思想的主要内容集中体现为“十一个明确”。"},{"id":206,"text":"党对人民军队的绝对领导是人民军队建军之本、强军之魂。"},{"id":207,"text":"强国必须强军；党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建成世界一流军队。"},{"id":208,"text":"57 强军思想中的重要对应关系"},{"id":209,"text":"明确军队是要准备打仗的；明确推进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治军；明确科技是核心战斗力；明确强军之道要在得人；明确依法治军是党建军治军基本方式；明确军民融合发展是兴国之举、强军之策；明确作风优良是我军鲜明特色和政治优势。"},{"id":210,"text":"改革是强军的必由之路。"},{"id":211,"text":"第十五章 坚持一国两制和推进祖国完全统一"},{"id":212,"text":"记忆线索  提出与运用—宗旨—最高原则—一国与两制—统一方式"},{"id":213,"text":"58 一国两制的提出 宗旨与最高原则"},{"id":214,"text":"“一国两制”伟大构想最早针对台湾问题提出，首先运用于解决香港和澳门问题。"},{"id":215,"text":"“一国两制”的根本宗旨是维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定。"},{"id":216,"text":"维护国家主权、安全、发展利益是“一国两制”方针的最高原则。"},{"id":217,"text":"59 一国与两制的关系及统一方式"},{"id":218,"text":"“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内。"},{"id":219,"text":"“和平统一、一国两制”方针是实现两岸统一的最佳方式。"},{"id":220,"text":"第十六章 中国特色大国外交和推动构建人类命运共同体"},{"id":221,"text":"记忆线索  主线—和平发展—新型国际关系—共同体—共同价值"},{"id":222,"text":"60 中国特色大国外交的主线与原则"},{"id":223,"text":"中国特色大国外交牢牢把握服务民族复兴、促进人类进步这条主线。"},{"id":224,"text":"坚持走和平发展道路是新时代中国外交的基本原则。"},{"id":225,"text":"推动构建新型国际关系，要秉持相互尊重、公平正义、合作共赢原则，走出对话而不对抗、结伴而不结盟的国与国交往新路。"},{"id":226,"text":"61 人类命运共同体与一带一路"},{"id":227,"text":"推动构建人类命运共同体，是当代中国共产党人回答和解决关乎人类前途命运时代之问的中国方案，是应对共同挑战、建设更加繁荣美好世界的人间正道，也是新时代对外工作的总目标。"},{"id":228,"text":"共建“一带一路”是中国与世界实现开放共赢路径的顶层设计，是推动构建人类命运共同体的实践平台。"},{"id":229,"text":"62 全人类共同价值是什么"},{"id":230,"text":"和平、发展、公平、正义、民主、自由是全人类共同价值，也是联合国的崇高目标。"},{"id":231,"text":"第十七章 全面从严治党"},{"id":232,"text":"记忆线索  全面严治—政治统领—思想基础—作风—反腐—自我革命"},{"id":233,"text":"63 全面从严治党的地位与内涵"},{"id":234,"text":"全面从严治党是新时代党的建设的鲜明主题，是党永葆生机活力、走好新的赶考之路的必由之路。"},{"id":235,"text":"全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。"},{"id":236,"text":"64 政治 思想 作风与反腐败建设"},{"id":237,"text":"以政治建设为统领深入推进党的建设，把党的政治建设摆在首位；党的政治建设是党的根本性建设。"},{"id":238,"text":"思想建设是党的基础性建设。"},{"id":239,"text":"作风问题核心是党同人民群众的关系问题。"},{"id":240,"text":"腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁；反腐败是最彻底的自我革命。"},{"id":241,"text":"65 自我革命的地位与四个自我"},{"id":242,"text":"党的自我革命是跳出治乱兴衰历史周期率的第二个答案。勇于自我革命是中国共产党区别于其他政党的显著标志，也是党最大的优势、最鲜明的品格。"},{"id":243,"text":"自我革命要实现自我净化、自我完善、自我革新、自我提高。"},{"id":244,"text":"跳出历史周期率的第一个答案是让人民来监督政府，第二个答案是自我革命。两者相互联系、相互促进。"},{"id":245,"text":"66 党建思想与基本方略如何区分"},{"id":246,"text":"习近平总书记关于党的建设的重要思想集中概括为“十三个坚持”；新时代坚持和发展中国特色社会主义基本方略为“十四个坚持”。完整清单见第三部分。"},{"id":247,"text":"资料索引"},{"id":248,"text":"章节问答按原Word的导论及第一至第十七章整理；材料题对应原Word第二部分的三组题目。PDF页码指文件页序，以下可用于回看教材。"},{"id":249,"text":"导论1—8；第一章9—17；第二章18—26；第三章27—36；第四章37—42；第五章43—46；第六章47—57；第七章58—62；第八章63—72；第九章73—81；第十章82—92；第十一章93—94；第十二章95—98；第十三章99—101；第十四章102—103；第十五章104—107；第十六章108—113；第十七章114—123。"},{"id":250,"text":"第二部分 材料分析题背诵答案"},{"id":251,"text":"使用方法：先背关键词和各点首句，再背解释。题目问“为什么”时突出依据和意义；问“怎样做”时突出措施。每题结尾结合材料中的具体做法或成效，避免只抄理论。"},{"id":252,"text":"第一组 人民立场与江山人民"},{"id":253,"text":"基础问 中国共产党人的初心和使命"},{"id":254,"text":"为中国人民谋幸福，为中华民族谋复兴。"},{"id":255,"text":"分析题 如何理解江山就是人民 人民就是江山"},{"id":256,"text":"记忆线索  人民创造—根本立场—人民评判—群众路线—民生共富"},{"id":257,"text":"“江山就是人民，人民就是江山”深刻揭示了党与人民的根本关系。打江山、守江山，守的是人民的心；民心是最大的政治，决定事业兴衰成败。"},{"id":258,"text":"第一，人民是历史的创造者，是决定党和国家前途命运的根本力量。党和国家事业的成就来自人民的实践创造，必须尊重人民主体地位和首创精神，紧紧依靠人民创造历史。"},{"id":259,"text":"第二，人民立场是党的根本政治立场。党的根本宗旨是全心全意为人民服务，初心和使命是为中国人民谋幸福、为中华民族谋复兴。必须坚持发展为了人民、发展依靠人民、发展成果由人民共享。"},{"id":260,"text":"第三，人民是党的工作的最高裁决者和最终评判者。要把人民对美好生活的向往作为奋斗目标，以人民是否得到实惠、获得感幸福感安全感是否增强检验工作成效。"},{"id":261,"text":"第四，必须贯彻党的群众路线。坚持一切为了群众、一切依靠群众，从群众中来、到群众中去；深入调查研究，把党的正确主张变为群众的自觉行动，保持党同人民群众的血肉联系。"},{"id":262,"text":"第五，必须把人民至上落实到保障和改善民生、促进共同富裕中。坚持尽力而为、量力而行，解决群众急难愁盼问题，在高质量发展中促进公平正义，使发展成果更多更公平惠及全体人民。"},{"id":263,"text":"总之，人民是党执政的最大底气。只有始终相信人民、依靠人民、为了人民，才能巩固长期执政的群众基础，凝聚推进中国式现代化的力量。"},{"id":264,"text":"结合材料：选取“听取群众意见、解决民生问题、接受群众评价”等具体事实，说明其体现了上述哪一观点。"},{"id":265,"text":"第二组 四个自信与文化自信"},{"id":266,"text":"基础问 四个自信是什么"},{"id":267,"text":"道路自信、理论自信、制度自信、文化自信。"},{"id":268,"text":"分析题 为什么我们对自己的文化充满信心"},{"id":269,"text":"记忆线索  传统基础—革命与先进文化基石—实践基础—理论指导—创新交流"},{"id":270,"text":"文化自信是更基础、更广泛、更深厚的自信。我们对自己的文化充满信心，有深厚的历史根据、理论根据和现实根据。"},{"id":271,"text":"第一，中华优秀传统文化是坚定文化自信的深厚基础。中华文化源远流长、博大精深，中华文明具有突出的连续性、创新性、统一性、包容性、和平性，为民族发展提供深厚精神滋养。"},{"id":272,"text":"第二，革命文化和社会主义先进文化是坚定文化自信的坚强基石。党领导人民在革命、建设、改革中形成的理想信念和精神力量，以伟大建党精神为源头，体现了中华民族在奋斗中创造未来的能力。"},{"id":273,"text":"第三，中国特色社会主义伟大实践是文化自信的现实基础。党领导人民创造了经济快速发展和社会长期稳定的奇迹，新时代的伟大成就为坚定文化自信提供了有力现实支撑。"},{"id":274,"text":"第四，马克思主义中国化时代化为文化发展提供科学指导。坚持“两个结合”，使马克思主义同中国具体实际、中华优秀传统文化相结合，为文化发展确立方向、筑牢根基。"},{"id":275,"text":"第五，持续创新创造和文明交流互鉴增强文化生命力。创新创造是文化的生命所在。要推动中华优秀传统文化创造性转化、创新性发展，保持文化主体性，吸收人类文明优秀成果。"},{"id":276,"text":"总之，文化自信来自悠久文明、奋斗历程和现实成就，也来自科学理论指导和持续创新。必须坚持马克思主义指导地位，以人民为中心发展文化，培育和践行社会主义核心价值观，建设社会主义文化强国。"},{"id":277,"text":"结合材料：传统文化传承对应“深厚基础”；红色文化对应“坚强基石”；发展成就对应“现实基础”；文化新表达或交流活动对应“创新与互鉴”。"},{"id":278,"text":"第三组 党的建设与自我革命"},{"id":279,"text":"基础问 党建思想的核心内容怎样概括"},{"id":280,"text":"习近平总书记关于党的建设的重要思想集中体现为“十三个坚持”，完整内容见第三部分。"},{"id":281,"text":"分析题 如何理解自我革命是跳出历史周期率的第二个答案"},{"id":282,"text":"记忆线索  两个答案—性质宗旨—风险考验—全面从严—四个自我—内外监督"},{"id":283,"text":"跳出治乱兴衰历史周期率，第一个答案是让人民来监督政府，第二个答案是自我革命。党外靠人民监督，党内靠全面从严治党，二者相互联系、相互促进。"},{"id":284,"text":"第一，党的性质宗旨和初心使命决定党必须勇于自我革命。党除了国家、民族、人民的利益，没有任何自己特殊的利益，能够以人民利益为最高标准，敢于直面问题、坚持真理、修正错误。"},{"id":285,"text":"第二，自我革命是应对长期执政风险考验的必然要求。面对精神懈怠、能力不足、脱离群众、消极腐败等危险，只有不断解决自身问题，才能保持先进性和纯洁性，确保党不变质、不变色、不变味。"},{"id":286,"text":"第三，必须把全面从严治党作为自我革命的重要实践。以党的政治建设为统领，加强思想建设、组织建设、作风建设和纪律建设，坚持制度治党、依规治党，一体推进不敢腐、不能腐、不想腐，落实管党治党政治责任。"},{"id":287,"text":"第四，不断增强自我净化、自我完善、自我革新、自我提高能力。清除侵蚀党的健康肌体的因素，补短板、堵漏洞，推进创新，提高领导能力和执政水平。"},{"id":288,"text":"第五，把自我监督与人民监督结合起来。健全党和国家监督体系，主动接受人民监督，规范权力运行，使权力在阳光下运行，以伟大自我革命引领伟大社会革命。"},{"id":289,"text":"总之，勇于自我革命是中国共产党区别于其他政党的显著标志。坚持全面从严治党永远在路上、党的自我革命永远在路上，才能永葆生机活力，始终赢得人民拥护，为推进中国式现代化提供根本政治保证。"},{"id":290,"text":"结合材料：反腐典型、巡视整改、作风整治对应“发现和解决自身问题”；群众监督对应“两个答案贯通”；改革发展成效对应“自我革命引领社会革命”。"},{"id":291,"text":"第三部分 清单与易混点"},{"id":292,"text":"党建思想的十三个坚持"},{"id":293,"text":"记忆线索  领导—革命—政治—人民—思想—组织—干部—人才—作风纪律—反腐—监督—制度—责任"},{"id":294,"text":"1. 坚持和加强党的全面领导。"},{"id":295,"text":"2. 坚持以党的自我革命引领社会革命。"},{"id":296,"text":"3. 坚持以党的政治建设统领党的建设各项工作。"},{"id":297,"text":"4. 坚持江山就是人民、人民就是江山。"},{"id":298,"text":"5. 坚持思想建党、理论强党。"},{"id":299,"text":"6. 坚持严密党的组织体系。"},{"id":300,"text":"7. 坚持造就忠诚干净担当的高素质干部队伍。"},{"id":301,"text":"8. 坚持聚天下英才而用之。"},{"id":302,"text":"9. 坚持持之以恒正风肃纪。"},{"id":303,"text":"10. 坚持一体推进不敢腐、不能腐、不想腐。"},{"id":304,"text":"11. 坚持完善党和国家监督体系。"},{"id":305,"text":"12. 坚持制度治党、依规治党。"},{"id":306,"text":"13. 坚持落实全面从严治党政治责任。"},{"id":307,"text":"核对依据：PDF第114页（教材第338页）的相关清单；共产党员网《学习资料 习近平总书记关于党的建设的重要思想》。"},{"id":308,"text":"https://www.12371.cn/2025/02/20/ARTI1740018057057522.shtml"},{"id":309,"text":"新时代坚持和发展中国特色社会主义基本方略"},{"id":310,"text":"十四个坚持：坚持党对一切工作的领导；坚持以人民为中心；坚持全面深化改革；坚持新发展理念；坚持人民当家作主；坚持全面依法治国；坚持社会主义核心价值体系；坚持在发展中保障和改善民生；坚持人与自然和谐共生；坚持总体国家安全观；坚持党对人民军队的绝对领导；坚持“一国两制”和推进祖国统一；坚持推动构建人类命运共同体；坚持全面从严治党。"},{"id":311,"text":"数字概念对应"},{"id":312,"text":"两个结合：马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。"},{"id":313,"text":"两个确立：确立核心地位、确立思想指导地位。正式作答展开完整表述。"},{"id":314,"text":"四个自信：道路、理论、制度、文化。"},{"id":315,"text":"六个必须坚持：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。"},{"id":316,"text":"四组体系概括：十个明确是主体内容；十四个坚持是基本方略；十三个方面成就是实践总结；六个必须坚持体现世界观和方法论。"},{"id":317,"text":"中国式现代化：五个中国特色、九项本质要求、五项重大原则、六对重大关系。"},{"id":318,"text":"国家安全与强军：总体国家安全观的十个坚持；习近平强军思想的十一个明确。"},{"id":319,"text":"最容易混淆的对应关系"},{"id":320,"text":"容易混淆的概念"},{"id":321,"text":"正确对应"},{"id":322,"text":"新时代与初级阶段"},{"id":323,"text":"新时代是新的历史方位；仍处于并将长期处于社会主义初级阶段。"},{"id":324,"text":"党的领导与人民立场"},{"id":325,"text":"最本质特征、最大制度优势是党的领导；根本政治立场是人民立场。"},{"id":326,"text":"根本领导制度与根本政治制度"},{"id":327,"text":"党的领导制度；人民代表大会制度。"},{"id":328,"text":"国体与政体"},{"id":329,"text":"国体是人民民主专政；政体是人民代表大会制度。"},{"id":330,"text":"根本政治制度与基本政治制度"},{"id":331,"text":"人大制度是根本；多党合作和政治协商、民族区域自治、基层群众自治是基本。"},{"id":332,"text":"政治建设与思想建设"},{"id":333,"text":"政治建设是根本性建设；思想建设是基础性建设。"},{"id":334,"text":"人民安全与政治安全"},{"id":335,"text":"人民安全是宗旨；政治安全是根本，放在首要位置。"},{"id":336,"text":"改革 发展 稳定"},{"id":337,"text":"改革是动力，发展是目的，稳定是前提。"},{"id":338,"text":"教育 科技 人才"},{"id":339,"text":"教育是根本，科技是关键，人才是基础。"},{"id":340,"text":"三个第一"},{"id":341,"text":"科技是第一生产力，人才是第一资源，创新是第一动力。"},{"id":342,"text":"文化自信的三个依据"},{"id":343,"text":"传统文化是深厚基础；革命文化和社会主义先进文化是坚强基石；伟大实践是现实基础。"},{"id":344,"text":"两个跳出历史周期率的答案"},{"id":345,"text":"第一个是人民监督；第二个是自我革命。"},{"id":346,"text":"三组相近数字"},{"id":347,"text":"党建思想是十三个坚持；基本方略是十四个坚持；实践成就是十三个方面成就。"},{"id":348,"text":"闭卷自测"},{"id":349,"text":"① 说出六个必须坚持。② 说出中国式现代化五个中国特色。③ 分清根本政治制度与基本政治制度。④ 说出新发展理念各解决什么问题。⑤ 用五个关键词复述三道材料分析题。⑥ 分清党建十三个坚持与基本方略十四个坚持。"},{"id":350,"text":"《期末重点截图.docx》截图001，截图标注（p2）。实现中华民族伟大复兴是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标。"},{"id":351,"text":"《期末重点截图.docx》截图004，截图标注（p7）。“十个明确”是主体内容，集中体现这一思想体系的主要观点和基本精神，构成四梁八柱，发挥统摄作用。"},{"id":352,"text":"《期末重点截图.docx》截图006，截图标注（p8）。“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，体现理论和实际相结合、认识论和方法论相统一的鲜明特色。"},{"id":353,"text":"《期末重点截图.docx》截图007，截图标注（p9）。2017年10月，党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章，实现了党的指导思想的与时俱进。"},{"id":354,"text":"《期末重点截图.docx》截图016，截图标注（p24）。原来的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾；新时代转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一变化反映了我国社会主义初级阶段不断变化的新特点，是作出中国特色社会主义进入新时代重大判断的基本依据。"},{"id":355,"text":"《期末重点截图.docx》截图018，截图标注（p30）。统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局。"},{"id":356,"text":"《期末重点截图.docx》截图060，截图标注（p115）。绿色是永续发展的必要条件和人民对美好生活追求的重要体现。"},{"id":357,"text":"《期末重点截图.docx》截图063，截图标注（p124）。使市场在资源配置中起决定性作用，更好发挥政府作用，二者是有机统一的，不是相互否定的，不能割裂开来、对立起来。"},{"id":358,"text":"《期末重点截图.docx》截图075，截图标注（p160）。中国特色社会主义政治制度是由根本政治制度、基本政治制度、重要政治制度等组成的制度体系。人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。"},{"id":359,"text":"《期末重点截图.docx》截图076，截图标注（p163）。党的领导、人民当家作主、依法治国，三者统一于我国社会主义民主政治伟大实践。党的领导是人民当家作主和依法治国的根本保证。"},{"id":360,"text":"《期末重点截图.docx》截图079，截图标注（p168）。全过程人民民主既能确保人民充分享有各方面权利，又能有效促进国家治理高效和社会和谐稳定，维护和保障人民群众的根本利益。"},{"id":361,"text":"《期末重点截图.docx》截图080，截图标注（p170）。人民代表大会制度是我们党领导人民在人类政治制度史上的伟大创造。"},{"id":362,"text":"《期末重点截图.docx》截图087，截图标注（p185-187）。党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。"},{"id":363,"text":"《期末重点截图.docx》截图088、089，截图标注（p185-187）。推进全面依法治国，根本目的是依法保障人民权益。"},{"id":364,"text":"《期末重点截图.docx》截图096，截图标注（p192）。法律规范体系是以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律规范所构成的有机整体。"},{"id":365,"text":"《期末重点截图.docx》截图097，截图标注（p194）。党内法规体系以党章为根本，以民主集中制为核心，以准则、条例等中央党内法规为主干，以部委党内法规、地方党内法规为重要组成部分，由各领域各层级党内法规组成有机统一整体。"},{"id":366,"text":"《期末重点截图.docx》截图098，截图标注（p195）。实现法律规范科学完备统一，执法司法公正高效权威，权力运行受到有效制约监督，人民合法权益得到充分尊重保障，法治信仰普遍确立，法治国家、法治政府、法治社会全面建成。"},{"id":367,"text":"《期末重点截图.docx》截图100，截图标注（p202-203）。文化自信是一个国家、一个民族发展中最基本、最深沉、最持久的力量。"},{"id":368,"text":"《期末重点截图.docx》截图104，截图标注（p208）。马克思主义始终是随着时代、实践、认识发展而发展的。习近平新时代中国特色社会主义思想是马克思主义中国化时代化最新成果，是当今时代最现实、最鲜活的马克思主义。"},{"id":369,"text":"《期末重点截图.docx》截图107，截图标注（p215）。新民主主义革命时期：井冈山精神、苏区精神、长征精神、遵义会议精神、延安精神、抗战精神、红岩精神、西柏坡精神等。社会主义革命和建设时期：抗美援朝精神、“两弹一星”精神、雷锋精神、焦裕禄精神、大庆精神（铁人精神）、红旗渠精神等。改革开放和社会主义现代化建设新时期：改革开放精神、特区精神、抗洪精神、抗击“非典”精神、抗震救灾精神、载人航天精神等。中国特色社会主义新时代：脱贫攻坚精神、抗疫精神、探月精神、新时代北斗精神等。"},{"id":370,"text":"《期末重点截图.docx》截图114，截图标注（p246）。生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题。"},{"id":371,"text":"《期末重点截图.docx》截图115，截图标注（p248）。绿色发展是新发展理念的重要内容，是发展观的一场深刻革命。"},{"id":372,"text":"《期末重点截图.docx》截图116，截图标注（p262）。坚持国家安全一切为了人民、一切依靠人民；完善政治安全工作体系。"},{"id":373,"text":"《期末重点截图.docx》截图126，截图标注（p322）。坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择。"},{"id":374,"text":"《期末重点截图.docx》截图002，截图标注（p4）。“两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。"},{"id":375,"text":"《期末重点截图.docx》截图005，截图标注（p8）。坚持人民至上是根本价值立场，体现了历史唯物主义群众史观。"},{"id":376,"text":"《期末重点截图.docx》截图012，截图标注（p19）。中国特色社会主义写出了科学社会主义的“新版本”。"},{"id":377,"text":"《期末重点截图.docx》截图028，截图标注（p47）。中国式现代化的本质要求符合人类现代化的一般规律。"},{"id":378,"text":"《期末重点截图.docx》截图044，截图标注（p68）。必须坚持党员个人服从党的组织，少数服从多数。截图后续没有完整显示，本条只收录这两个完整要求。"},{"id":379,"text":"《期末重点截图.docx》截图048，截图标注（p78）。政治立场是一个政党观察、认识、处理政治问题的立足点，反映这个政党的世界观、方法论和执政理念，体现这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。"},{"id":380,"text":"《期末重点截图.docx》截图049，截图标注（p79）。同人民群众的血肉联系关系到党的生死存亡、兴旺发达。"},{"id":381,"text":"《期末重点截图.docx》截图060，截图标注（p115）。必须坚持创新在我国现代化建设全局中的核心地位。协调发展必须正确处理局部和全局、当前和长远、重点和非重点的关系。绿色发展必须实现经济社会发展和生态环境保护协同共进。开放发展必须推动形成更大范围、更宽领域、更深层次对外开放格局。"},{"id":382,"text":"《期末重点截图.docx》截图062，截图标注（p121）。公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。"},{"id":383,"text":"《期末重点截图.docx》截图063，截图标注（p124）。市场在资源配置中起决定性作用，就是把市场机制能有效调节的经济活动交给市场，推动资源配置实现效益最大化和效率最优化。更好发挥政府作用，就是要在保证市场发挥决定性作用的前提下，管好那些市场管不了或管不好的事情。"},{"id":384,"text":"《期末重点截图.docx》截图068，截图标注（p129）。科技自立自强是我国经济生存和发展的基础。"},{"id":385,"text":"《期末重点截图.docx》截图069，截图标注（p131）。全面建设社会主义现代化国家，最艰巨最繁重的任务依然在农村，最广泛最深厚的基础依然在农村。"},{"id":386,"text":"《期末重点截图.docx》截图070，截图标注（p135）。坚持教育优先发展、科技自立自强、人才引领驱动。"},{"id":387,"text":"《期末重点截图.docx》截图073，截图标注（p149）。通过市场需求引导创新资源有效配置。"},{"id":388,"text":"《期末重点截图.docx》截图074，截图标注（p150）。基础研究处于从研究到应用、再到生产的科研链条起始端。加强基础研究是科技自立自强的必然要求，是从未知到已知、从不确定性到确定性的必然选择。"},{"id":389,"text":"《期末重点截图.docx》截图082，截图标注（p173）。我国协商民主坚持发扬民主和增进团结相互贯通。"},{"id":390,"text":"《期末重点截图.docx》截图088，截图标注（p185-187）。全面依法治国最广泛、最深厚的基础是人民，必须坚持法治为了人民、依靠人民、造福人民、保护人民。"},{"id":391,"text":"《期末重点截图.docx》截图093，截图标注（p190）。坚持依法治国首先要坚持依宪治国。"},{"id":392,"text":"《期末重点截图.docx》截图102，截图标注（p205）。中国特色社会主义文化发展道路是改革创新之路。"},{"id":393,"text":"《期末重点截图.docx》截图111，截图标注（p235）。社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容。"},{"id":394,"text":"《期末重点截图.docx》截图116，截图标注（p262）。充分发挥广大人民群众积极性、主动性、创造性，汇聚起维护国家安全的强大力量；提高防范化解政治安全风险的能力和水平。"},{"id":395,"text":"《期末重点截图.docx》截图118，截图标注（p267）。我国是中国共产党执政，各民主党派参政，不搞三权分立。截图后续没有完整显示，本条仅收录完整可读的命题。"},{"id":396,"text":"《期末重点截图.docx》截图123，截图标注（p299）。维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变。"},{"id":397,"text":"《期末重点截图.docx》截图129，截图标注（p331）。全人类共同价值包含当今时代人类价值观优秀成果。"},{"id":398,"text":"《期末重点截图.docx》截图131，截图标注（p338）。党要管党、从严治党，是党的建设的一贯要求和根本方针。"},{"id":399,"text":"《期末重点截图.docx》截图137，截图标注（p351）。反腐败是最彻底的自我革命，是全面从严治党的“必答题”。"},{"id":400,"text":"《期末重点截图.docx》截图057，截图标注（p97）。解放和发展社会生产力，是改革开放的鲜明特征和首要任务，也是新时代贯彻新发展理念、构建新发展格局、推动高质量发展的必然要求。"},{"id":401,"text":"《期末重点截图.docx》截图038，截图标注（p60）。中国共产党的自身优势是中国特色社会主义制度优势的主要来源。"}]},"coverage":{"requiredParagraphs":197,"coveredParagraphs":197,"missing":[],"types":{"single":237,"multi":155,"fill":147,"judge":147},"topics":66,"materials":28,"multiAnswerCounts":{"2":47,"3":75,"4":33},"screenshots":{"groups":52,"primaryGroups":24,"extraGroups":27,"questions":81,"file":"期末重点截图.docx","date":"2026-10-30"}}};</script>

  const esc = (v) =>
    String(v ?? "").replace(
      /[&<>"']/g,

    while (result.length < count && groups.some((g) => g.length)) {

    }

        })
        .join("")}</div>`;
    }
    const material=q.material ? `<section class="quiz-material" aria-label="题目材料"><div class="material-label">阅读材料 · 教材改编</div><p>${esc(q.material.text)}</p><small>依据教材内容改编，情境为练习设定。教材页码见提交后的解析。</small></section>` : "";
    return `<div class="section-heading"><div><div class="eyebrow">${exam ? "模拟考试" : "自主练习"} / ${esc(D.chapters[q.chapter].title.split(" ")[0])}</div><h1 style="font-size:29px">${esc(topicMap.get(q.topic).title)}</h1></div><button class="text-button" data-act="nav" data-view="home">返回学习首页</button></div>${exam && s.settled ? '<div class="review-banner">已交卷 · 正在回看答案。复习不会重复计分。</div>' : ""}<div class="quiz-layout"><section class="panel quiz-panel"><div class="quiz-top"><span><span class="tag">${labels[q.type]}</span> ${q.source === "web" ? '<span class="tag web">网络拓展</span>' : ""} <span class="mono">${esc(q.id)}</span></span><span>第 <strong>${s.index + 1}</strong> / ${s.ids.length} 题 <button class="text-button" data-act="bookmark" aria-pressed="${state.bookmarks.includes(q.id)}">${state.bookmarks.includes(q.id) ? "★ 已收藏" : "☆ 收藏"}</button></span></div>${material}<h2 class="quiz-stem">${esc(q.stem)}</h2><p class="quiz-hint">${q.type === "multi" ? "每题四个选项，有2、3或4个正确答案。请选择全部正确项；少选、错选均不得分。" : q.type === "fill" ? "每空分别填写。忽略空格和标点，关键概念须完整准确。" : q.type === "judge" ? "判断下列表述是否正确。" : "请选择一个最恰当的答案。"}</p>${body}<div class="quiz-actions"><button class="btn secondary" data-act="prev" ${s.index === 0 ? "disabled" : ""}>← 上一题</button><div class="quiz-action-right">${exam && !s.settled ? `<button class="btn secondary small" data-act="flag">${s.flagged.includes(q.id) ? "已标记" : "标记本题"}</button>` : ""}${!exam && !revealed ? `<button class="btn primary" id="submitBtn" data-act="submit" ${E.hasAnswer(q, a) ? "" : "disabled"}>提交答案</button>` : ""}${!exam && revealed ? '<button class="btn secondary small" data-act="retry">再答一次</button>' : ""}${exam || revealed ? `<button class="btn ${exam ? "primary" : "quiet"}" data-act="next">${s.index === s.ids.length - 1 ? (exam ? (s.settled ? "查看成绩" : "准备交卷") : "本轮小结") : "下一题 →"}</button>` : ""}</div></div>${revealed ? explanation(q, s) : ""}<div class="help-row">${exam ? "考试结束后统一解析。" : "提交后可用数字键选项、Enter提交或继续。"}</div></section><aside class="panel question-map"><h3>${exam ? "考试答题卡" : "本轮答题卡"}</h3>${exam && !s.settled ? '<div class="timer" id="timer" aria-label="剩余时间"></div><p class="bottom-note" style="margin:5px 0 16px">倒计时结束后自动交卷</p>' : ""}<div class="map-grid">${s.ids
      .map((id, i) => {
        const item = byId.get(id),

        const status = showResult
          ? E.grade(item, s.answers[id])
            ? "correct"
            : "wrong"
          : E.hasAnswer(item, s.answers[id])
            ? "answered"
            : "";
        return `<button data-act="jump" data-index="${i}" class="map-button ${status} ${i === s.index ? "current" : ""} ${s.flagged.includes(id) ? "flagged" : ""}" aria-label="第${i + 1}题${status === "wrong" ? "，答错" : status === "correct" ? "，答对" : ""}">${i + 1}</button>`;
      })
      .join(
        "",
      )}</div><div class="map-legend"><span><i class="legend-square"></i>${exam && !s.settled ? "已答" : "正确"}</span>${exam && !s.settled ? "" : `<span><i class="legend-square wrong"></i>错误 / 未答</span>`}</div><div class="map-foot"><button class="btn ${exam ? "primary" : "secondary"}" data-act="finish">${exam ? (s.settled ? "查看成绩" : "交卷") : "本轮小结"}</button><button class="text-button" data-act="export">备份本轮进度 ↗</button></div><p class="topic-note">${esc(D.chapters[q.chapter].title)}<br>知识点：${q.knowledge.map(esc).join("、")}<br>来源：${q.source === "web" ? "共产党员网公开学习资料" : q.screenshot ? "期末重点截图" : "课程背诵稿"}</p></aside></div>`;
  }
  function current() {
    const s = state.session;
    return { s, q: byId.get(s.ids[s.index]) };
  }
  function choose(value) {
    const { s, q } = current();
    if (
      (s.mode === "exam" && s.settled) ||
      (s.mode === "practice" && Object.hasOwn(s.checked, q.id))
    )
      return;
    const v = q.type === "judge" ? value === "true" : Number(value);
    if (q.type === "multi") {
      let a = s.answers[q.id] || [];
      s.answers[q.id] = a.includes(v) ? a.filter((n) => n !== v) : [...a, v];
    } else s.answers[q.id] = v;
    save();
    render();
    const btn = app.querySelector(`[data-option="${value}"]`);
    btn?.focus({ preventScroll: true });
  }
  function submit() {
    const { s, q } = current();
    if (s.mode === "exam" || Object.hasOwn(s.checked, q.id)) return;
    if (!E.hasAnswer(q, s.answers[q.id])) {
      toast("请先完成本题");
      return;
    }
    const ok = E.grade(q, s.answers[q.id]);
    s.checked[q.id] = ok;
    state = E.record(state, q.id, ok);
    save();
    render();
  }
  function jump(index) {
    const s = state.session;
    s.index = Math.max(0, Math.min(index, s.ids.length - 1));
    save();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  function finish() {
    const s = state.session;
    if (s.mode === "exam") {
      if (s.settled) {
        s.reviewing = false;
        save();
        render();
        return;
      }
      const blank = s.ids.filter(
        (id) => !E.hasAnswer(byId.get(id), s.answers[id]),
      ).length;
      ask(
        "确认交卷？",
        `本轮共${s.ids.length}题，${blank ? "还有" + blank + "题未完成，未答题将计为错误。" : "已全部作答。"}交卷后显示成绩与解析。`,
        () => settle(),
      );
    } else {
      s.completed = true;
      s.reviewing = false;
      save();
      render();
    }
  }
  function settle() {
    const s = state.session;
    if (!s || s.mode !== "exam" || s.settled) return;
    const done = E.settleExam(state, s, D.questions);

    save();
    navigate("quiz");
  }
  function resultsView(s) {

    const correct = exam

      : s.ids.filter((id) => s.checked[id] === true).length;
    const unanswered = exam ? s.result.unanswered : s.ids.length - done;
    return `<div class="section-heading"><div><div class="eyebrow">${exam ? "模拟考试" : "自主练习"} / 学习回顾</div><h1>${exam ? "交卷完成，看看掌握得怎样。" : "这一轮，记住了多少？"}</h1></div></div><section class="panel results"><span class="tag">${exam ? "考试成绩" : "已提交题目正确率"}</span><div class="result-score">${exam ? s.result.score : done ? pct(correct, done) : "—"}<small>${exam ? "分" : "%"}</small></div><p class="result-note">${exam ? "每题等权计分，少选、多选、未答均不得分。" : "自主练习只统计已提交题目的判分；未提交题目尚未计入练习记录。"}</p><div class="result-stats"><div><strong>${s.ids.length}</strong>本轮题目</div><div><strong>${correct}</strong>回答正确</div><div><strong>${done - correct}</strong>${exam ? "错误（含未答）" : "回答错误"}</div><div><strong>${unanswered}</strong>${exam ? "未完成作答" : "尚未提交"}</div></div><div class="result-buttons"><button class="btn primary" data-act="review">逐题回看解析</button><button class="btn secondary" data-act="retry-wrong">重练本轮错题</button><button class="btn secondary" data-act="nav" data-view="home">返回首页</button></div><div class="result-grid">${s.ids
      .map((id, i) => {
        const answered = exam || Object.hasOwn(s.checked, id);
        const ok = answered && E.grade(byId.get(id), s.answers[id]);
        return `<button class="map-button ${answered ? (ok ? "correct" : "wrong") : ""}" data-act="review-jump" data-index="${i}" aria-label="回看第${i + 1}题">${i + 1}</button>`;
      })
      .join(
        "",
      )}</div></section><p class="footnote">${exam ? "考试结果已记入本地记录，回看不会再次计分。" : "通过再答一次或错题重练订正错误，历史错误次数会保留。"}</p>`;
  }

  function settingsView() {

  app.addEventListener("click", (event) => {

    } else if (a === "start") launch(getPool(), mode === "exam");
    else if (a === "resume") {
      if (state.session?.settled || state.session?.completed)
        state.session.reviewing = false;
      navigate("quiz");
    } else if (a === "option") choose(b.dataset.option);
    else if (a === "submit") submit();
    else if (a === "prev") jump(state.session.index - 1);
    else if (a === "next") {
      const s = state.session;
      s.index < s.ids.length - 1 ? jump(s.index + 1) : finish();
    } else if (a === "jump") jump(Number(b.dataset.index));
    else if (a === "finish") finish();
    else if (a === "bookmark") {
      const { q } = current();
      state.bookmarks = state.bookmarks.includes(q.id)
        ? state.bookmarks.filter((id) => id !== q.id)
        : [...state.bookmarks, q.id];
      save();
      render();
    } else if (a === "unbookmark") {
      state.bookmarks = state.bookmarks.filter((id) => id !== b.dataset.id);
      save();
      render();
    } else if (a === "flag") {
      const { s, q } = current();
      s.flagged = s.flagged.includes(q.id)
        ? s.flagged.filter((id) => id !== q.id)
        : [...s.flagged, q.id];
      save();
      render();
    } else if (a === "retry") {
      const { s, q } = current();
      delete s.checked[q.id];
      delete s.answers[q.id];
      s.completed = false;
      save();
      render();
    } else if (a === "review" || a === "review-jump") {
      state.session.reviewing = true;
      state.session.index = a === "review" ? 0 : Number(b.dataset.index);
      save();
      render();
    } else if (a === "retry-wrong") {
      const s = state.session;
      const qs = s.ids
        .map((id) => byId.get(id))
        .filter(
          (q) =>
            (s.mode === "exam" || Object.hasOwn(s.checked, q.id)) &&
            !E.grade(q, s.answers[q.id]),
        );
      launch(qs, false, qs.length);
    } else if (a === "knowledge-practice") {
      const qs = D.questions.filter((q) => q.knowledge.includes(b.dataset.kid));
      launch(qs, false, qs.length);
    } else if (a === "knowledge-prev") {
      libraryPage--;
      render();
      window.scrollTo(0, 0);
    } else if (a === "knowledge-next") {
      libraryPage++;
      render();
      window.scrollTo(0, 0);
    } else if (a === "collection-practice") {
      const qs = E.filterQuestions(
        D.questions,
        { ...collectionFilters, mode: view },
        state,
      );
      launch(qs, false, qs.length);
    } else if (a === "one-question") launch([byId.get(b.dataset.id)], false, 1);
    else if (a === "export") {
      download(
        "习概学习进度-" + new Date().toISOString().slice(0, 10) + ".json",
        E.exportBackup(state),
      );
      toast("备份已导出，包含本轮进度和所有学习记录");
    } else if (a === "import") document.getElementById("importFile").click();
    else if (a === "corrupt-export") download("习概原始记录.json", corruptRaw);
    else if (a === "clear")
      ask(
        "清空当前学习记录？",
        "练习、错题、收藏和考试成绩将被清空。建议先导出备份，以便恢复。",
        () => {
          state = E.blankState();
          save();
          navigate("home");
          toast("当前记录已清空");
        },
      );
  });
  app.addEventListener("change", (event) => {
    const el = event.target;
    if (el.dataset.config) {
      config[el.dataset.config] = el.value;
      if (el.tagName === "SELECT") {
        const key = el.dataset.config;
        render();
        app
          .querySelector(`[data-config="${key}"]`)
          ?.focus({ preventScroll: true });
      }
    }
    if (el.dataset.library) {
      libraryFilters[el.dataset.library] = el.value;
      libraryPage = 0;
      render();
    }
    if (el.dataset.collection) {
      collectionFilters[el.dataset.collection] = el.value;
      render();
    }
  });
  let searchTimer;
  app.addEventListener("input", (event) => {
    const el = event.target;
    if (el.hasAttribute("data-fill")) {
      const { s, q } = current();
      if ((s.mode === "exam" && s.settled) || Object.hasOwn(s.checked, q.id))
        return;
      const a = s.answers[q.id] || q.answer.map(() => "");
      a[Number(el.dataset.fill)] = el.value;
      s.answers[q.id] = a;
      save();
      const btn = document.getElementById("submitBtn");
      if (btn) btn.disabled = !E.hasAnswer(q, a);
    }
    if (el.dataset.config) {
      config[el.dataset.config] = el.value;
      const pool = getPool();
      document.getElementById("poolCount").textContent = pool.length;
      document.getElementById("startButton").disabled = !pool.length;
      if (el.tagName === "INPUT") {
        const key = el.dataset.config;
        const start = el.selectionStart;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          render();
          const input = app.querySelector(`[data-config="${key}"]`);
          input?.focus({ preventScroll: true });
          input?.setSelectionRange(start, start);
        }, 260);
      }
    }
    if (el.dataset.library || el.dataset.collection) {
      const dataset = el.dataset.library ? "library" : "collection";
      const prop = el.dataset[dataset];
      const start = el.selectionStart;
      if (dataset === "library") {
        libraryFilters[prop] = el.value;
        libraryPage = 0;
      } else collectionFilters[prop] = el.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        render();
        const input = app.querySelector(`[data-${dataset}="${prop}"]`);
        input?.focus({ preventScroll: true });
        input?.setSelectionRange(start, start);
      }, 260);
    }
  });
  document.getElementById("dialogCancel").onclick = () => {
    confirmAction = null;
    document.getElementById("confirmDialog").close();
  };
  document.getElementById("dialogConfirm").onclick = () => {
    const action = confirmAction;
    confirmAction = null;
    document.getElementById("confirmDialog").close();
    action?.();
  };
  document
    .getElementById("confirmDialog")
    .addEventListener("cancel", () => (confirmAction = null));
  document
    .getElementById("importFile")
    .addEventListener("change", async (event) => {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (file.size > 15000000) {
        toast("备份文件过大，请选择由本应用导出的JSON");
        return;
      }
      try {
        const reconciled=E.reconcileChoices(E.importBackup(await file.text(), known),D.questions,D.choiceRevision);
        const restored = reconciled.state;
        validateSession(restored.session);
        ask(
          "用备份替换当前记录？",
          "将导入备份中的错题、收藏和练习进度。当前记录会被替换；建议先导出当前记录。",
          () => {
            state = restored;
            storageError = reconciled.retired ? "选择题选项已更新，备份中的旧试卷已结束。错题、收藏和历史成绩均已恢复。" : "";
            save();
            navigate("home");
            toast(reconciled.retired ? "学习记录已恢复，请重新组卷使用新版选项" : "备份已恢复");
          },
        );
      } catch (err) {
        toast("导入失败：" + (err.message || "备份无法读取"));
      }
    });
  document.addEventListener("keydown", (event) => {
    if (
      view !== "quiz" ||
      document.getElementById("confirmDialog").open ||
      event.ctrlKey ||
      event.metaKey ||
      event.altKey ||
      event.repeat
    )
      return;
    if (["SELECT", "TEXTAREA"].includes(event.target.tagName)) return;
    const s = state.session;
    if (!s || ((s.completed || s.settled) && !s.reviewing)) return;
    const q = byId.get(s.ids[s.index]);
    if (
      event.key === "Enter" &&
      event.target.tagName === "INPUT" &&
      q.type === "fill"
    ) {
      event.preventDefault();
      if (s.mode === "practice") submit();
      return;
    }
    if (event.target.tagName === "INPUT") return;
    if (/^[1-9]$/.test(event.key)) {
      const order = q.type === "judge" ? [true, false] : s.orders[q.id];
      const pos = Number(event.key) - 1;
      if (order && pos < order.length) {
        event.preventDefault();
        choose(String(order[pos]));
      }
    }
    if (event.key === "Enter" && event.target.tagName !== "BUTTON") {
      event.preventDefault();
      if (s.mode === "practice" && !Object.hasOwn(s.checked, q.id)) submit();
      else if (s.index < s.ids.length - 1) jump(s.index + 1);
      else finish();
    }
  });
  function updateTimer() {
    const s = state.session;
    if (!s || s.mode !== "exam" || s.settled) return;
    const left = Math.max(0, Math.ceil((s.endAt - Date.now()) / 1000));
    const el = document.getElementById("timer");
    if (el)
      el.textContent =
        String(Math.floor(left / 60)).padStart(2, "0") +
        ":" +
        String(left % 60).padStart(2, "0");
    if (left === 0) {
      document.getElementById("confirmDialog").close();
      confirmAction = null;
      settle();
      toast("考试时间已到，已自动交卷");
    }
  }
  render();
  setInterval(updateTimer, 1000);
})();
</script>
</body>
</html>
